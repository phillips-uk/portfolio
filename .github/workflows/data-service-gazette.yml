# Phillips. data service: nightly corporate insolvency notices from The Gazette.
# Off until DATA_SERVICE_ENABLED is 'true' and the repository variable GAZETTE_UA is set (app name/version and a
# contact URL, as the Gazette fair use policy requires). Runs inside the Gazette's 9pm to 7am UK window.
name: Data service nightly Gazette
on:
  schedule:
    - cron: '30 22 * * *'   # 22:30 UTC = 22:30 or 23:30 UK time
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days back to read (default 3; a backfill must still finish before 7am UK)'
        required: false
        default: '3'

jobs:
  gazette:
    if: vars.DATA_SERVICE_ENABLED == 'true' && vars.GAZETTE_UA != ''
    runs-on: ubuntu-latest
    timeout-minutes: 420
    defaults:
      run:
        working-directory: data-service
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GAZETTE_UA: ${{ vars.GAZETTE_UA }}
      DAYS: ${{ github.event.inputs.days || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save --no-audit --no-fund wrangler@4.151.0  # package-lock.json is git-ignored in this repo
        working-directory: .
      - name: Read notices
        run: |
          set -euo pipefail
          [[ "$DAYS" =~ ^[0-9]{1,4}$ ]]
          python3 -I ingest/gazette.py "$(date -u -d "$DAYS days ago" +%F)" "$RUNNER_TEMP/gazette.sql"
      - name: Load
        run: |
          for try in 1 2 3; do
            npx --no-install wrangler d1 execute phillips-data --remote --file "$RUNNER_TEMP/gazette.sql" && break
            [ "$try" = 3 ] && exit 1; sleep 30
          done
          rm -f "$RUNNER_TEMP/gazette.sql"
