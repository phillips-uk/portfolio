# Phillips. data service: monthly refresh of payment practices and company basics into D1.
# Off until the repository variable DATA_SERVICE_ENABLED is 'true' and these secrets exist:
#   CLOUDFLARE_API_TOKEN (D1 edit only), CLOUDFLARE_ACCOUNT_ID
# A load that fails validation is never published; the job fails and GitHub emails Lewis.
name: Data service monthly refresh
on:
  schedule:
    - cron: '0 5 4 * *'   # 05:00 UTC on the 4th; the Companies House snapshot lands in the first days of the month
  workflow_dispatch: {}

jobs:
  refresh:
    if: vars.DATA_SERVICE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: data-service
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
        working-directory: .
      - name: Download the source files
        run: |
          mkdir -p "$RUNNER_TEMP/src"
          curl -sfL -o "$RUNNER_TEMP/src/payments.csv" https://check-payment-practices.service.gov.uk/export/csv/
          f=$(curl -sfL https://download.companieshouse.gov.uk/en_output.html | grep -oE 'BasicCompanyDataAsOneFile-[0-9-]+\.zip' | head -1)
          test -n "$f"
          curl -sfL -o "$RUNNER_TEMP/src/basic.zip" "https://download.companieshouse.gov.uk/$f"
      - name: Build and validate
        run: |
          python3 -I ingest/build.py "$RUNNER_TEMP/src/payments.csv" "$RUNNER_TEMP/src/basic.zip" "$RUNNER_TEMP/load"
          python3 -I -c "import json,sys; r=json.load(open('$RUNNER_TEMP/load/report.json')); sys.exit(0 if r['ok'] else 1)"
      - name: Load and publish
        run: |
          npx --no-install wrangler d1 execute phillips-data --remote --file "$RUNNER_TEMP/load/load.sql"
          npx --no-install wrangler d1 execute phillips-data --remote --file "$RUNNER_TEMP/load/publish.sql"
      - name: Delete the downloaded files
        if: always()
        run: rm -rf "$RUNNER_TEMP/src" "$RUNNER_TEMP/load"
