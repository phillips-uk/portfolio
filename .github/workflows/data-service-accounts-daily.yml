# Phillips. data service: daily accounts figures (companies with 10+ staff) and industry benchmarks.
# Off until the repository variable DATA_SERVICE_ENABLED is 'true' and these secrets exist:
#   CLOUDFLARE_API_TOKEN (D1 edit only), CLOUDFLARE_ACCOUNT_ID. SIC codes come from the register table (monthly job).
# Each bulk file is processed once (recorded in dataset_versions as 'accounts-file'), so reruns are safe.
# Manual runs can backfill: give a space-separated list of file names from
# https://download.companieshouse.gov.uk/en_accountsdata.html (or the monthly archive page).
name: Data service daily accounts
on:
  schedule:
    - cron: '30 6 * * 2-6'   # 06:30 UTC Tuesday to Saturday, after each working day's file is published
  workflow_dispatch:
    inputs:
      files:
        description: 'Bulk file names to backfill (space-separated); empty means the latest daily file'
        required: false
        default: ''

jobs:
  accounts:
    if: vars.DATA_SERVICE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: data-service
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
        working-directory: .
      - name: Process new bulk files
        env:
          FILES: ${{ github.event.inputs.files }}
        run: |
          set -euo pipefail
          if [ -z "${FILES:-}" ]; then
            FILES=$(curl -sfL https://download.companieshouse.gov.uk/en_accountsdata.html | grep -oE 'Accounts_Bulk_Data-[0-9-]+\.zip' | sort -u | tail -1)
          fi
          for f in $FILES; do
            [[ "$f" =~ ^Accounts_(Bulk|Monthly)_Data-[A-Za-z0-9-]+\.zip$ ]] || { echo "skip $f"; continue; }
            done_before=$(npx --no-install wrangler d1 execute phillips-data --remote --json \
              --command "SELECT COUNT(*) AS n FROM dataset_versions WHERE dataset = 'accounts-file' AND notes = '$f'" \
              | python3 -I -c "import json,sys; print(json.load(sys.stdin)[0]['results'][0]['n'])")
            if [ "$done_before" != "0" ]; then echo "already processed $f"; continue; fi
            curl -sfL -o "$RUNNER_TEMP/acc.zip" "https://download.companieshouse.gov.uk/$f"
            python3 -I ingest/accounts.py "$RUNNER_TEMP/acc.zip" "$RUNNER_TEMP/acc.sql"
            if [ -s "$RUNNER_TEMP/acc.sql" ]; then
              npx --no-install wrangler d1 execute phillips-data --remote --file "$RUNNER_TEMP/acc.sql"
            fi
            npx --no-install wrangler d1 execute phillips-data --remote --command \
              "INSERT INTO dataset_versions (dataset, as_of, row_count, checksum, validated, published_at, notes) VALUES ('accounts-file', date('now'), 0, '', 1, datetime('now'), '$f')"
            rm -f "$RUNNER_TEMP/acc.zip" "$RUNNER_TEMP/acc.sql"
          done
      - name: Rebuild accounts benchmarks
        run: |
          npx --no-install wrangler d1 execute phillips-data --remote --json --command \
            "SELECT period_end, turnover, cost_of_sales, trade_debtors, stock, trade_creditors, division, section FROM accounts_facts" \
            > "$RUNNER_TEMP/facts.json"
          python3 -I ingest/accounts_benchmarks.py "$RUNNER_TEMP/facts.json" "$RUNNER_TEMP/bench.sql"
          npx --no-install wrangler d1 execute phillips-data --remote --file "$RUNNER_TEMP/bench.sql"
          rm -f "$RUNNER_TEMP/facts.json" "$RUNNER_TEMP/bench.sql"
