<script type="text/babel">

/* =============== SEVERITY TOKENS =============== */
/* Warm-tuned palette so severity colours sit inside the Phillips. system.
   High:    warm red    Medium: amber     Low: mid grey     Pass: muted green */
const SEV = {
  critical: { label: "Critical", fg: "#7B1C0C", bg: "#F5D5CD", border: "#E8B4A8" },
  high:     { label: "High",     fg: "#B83A1F", bg: "#F8E4DC", border: "#EBC4B5" },
  medium:   { label: "Medium",   fg: "#985830", bg: "#F5EBD9", border: "#E8D8C4" },
  low:      { label: "Low",      fg: "#6B6B6B", bg: "#EFECE6", border: "#DCD7CC" },
  pass:     { label: "Pass",     fg: "#4F7A4A", bg: "#E6EFE4", border: "#CDDCC8" },
  suggest:  { label: "Suggest",  fg: "#4A6B7A", bg: "#E4EEF2", border: "#C0D8E4" },
};

/* =============== BUTTONS =============== */
function BtnFilled({ children, onClick, large, full }) {
  const [h, setH] = React.useState(false);
  return (
    <button onClick={onClick} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{
        background: h ? "#7A3F1F" : "#985830", color: "#fff", border: 0,
        padding: large ? "16px 32px" : "14px 30px",
        fontSize: large ? 15 : 14, fontWeight: 600,
        borderRadius: 4, cursor: "pointer", fontFamily: "inherit",
        transition: "background 150ms cubic-bezier(0.2,0,0,1)",
        letterSpacing: "-0.005em",
        width: full ? "100%" : "auto",
      }}>{children}</button>
  );
}
function BtnFilledSmall({ children, onClick }) {
  const [h, setH] = React.useState(false);
  return (
    <button onClick={onClick} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{
        background: h ? "#7A3F1F" : "#985830", color: "#fff", border: 0,
        padding: "10px 20px", fontSize: 13, fontWeight: 600,
        borderRadius: 4, cursor: "pointer", fontFamily: "inherit",
        transition: "background 150ms cubic-bezier(0.2,0,0,1)",
      }}>{children}</button>
  );
}
function BtnOutline({ children, onClick, icon, disabled }) {
  const [h, setH] = React.useState(false);
  return (
    <button onClick={onClick} disabled={disabled}
      onMouseEnter={() => !disabled && setH(true)} onMouseLeave={() => setH(false)}
      style={{
        background: disabled ? "transparent" : (h ? "#985830" : "transparent"),
        color: disabled ? "#6B6B6B" : (h ? "#fff" : "#1A1A1A"),
        border: `1.5px solid ${disabled ? "#E8D8C4" : "#985830"}`,
        padding: "10px 18px",
        fontSize: 13, fontWeight: 600,
        borderRadius: 4,
        cursor: disabled ? "default" : "pointer",
        fontFamily: "inherit",
        outline: "none",
        transition: "background 150ms cubic-bezier(0.2,0,0,1), color 150ms cubic-bezier(0.2,0,0,1)",
        display: "inline-flex", alignItems: "center", gap: 8,
      }}>
      {icon}
      <span>{children}</span>
    </button>
  );
}

function ShareButton() {
  const [copied, setCopied] = React.useState(false);
  function handleShare() {
    const url = window.location.href;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(() => {
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      }).catch(() => fallbackCopy(url));
    } else {
      fallbackCopy(url);
    }
  }
  function fallbackCopy(url) {
    const ta = document.createElement('textarea');
    ta.value = url;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch(e) {}
    document.body.removeChild(ta);
  }
  return (
    <BtnOutline icon={<IconShare/>} onClick={handleShare}>
      {copied ? "Link copied!" : "Share"}
    </BtnOutline>
  );
}

function PdfDownloadButton() {
  const [busy, setBusy] = React.useState(false);
  return (
    <BtnOutline
      icon={busy ? <Spinner/> : <IconDownload/>}
      disabled={busy}
      onClick={async () => {
        if (busy || !window.downloadAuditPDF) return;
        setBusy(true);
        try { await window.downloadAuditPDF(); }
        catch (e) { console.error(e); }
        finally { setBusy(false); }
      }}>
      {busy ? "Generating PDF…" : "Download PDF"}
    </BtnOutline>
  );
}

/* =============== AUDIT DATA CONTEXT =============== */
const AuditCtx = React.createContext(null);
function useAudit() { return React.useContext(AuditCtx); }

function AuditProvider({ children }) {
  const [data, setData] = React.useState(null);
  const [loading, setLoading] = React.useState(false);

  React.useEffect(() => {
    const id = new URLSearchParams(window.location.search).get('id');
    if (!id || !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(id)) return;

    // 1. Try sessionStorage (same-session submit)
    try {
      const stored = sessionStorage.getItem('lp_audit_' + id);
      if (stored) { setData(JSON.parse(stored)); return; }
    } catch(e) {}

    // 2. Fetch from API (direct link or refresh)
    setLoading(true);
    fetch('/.netlify/functions/landing-audit-status?id=' + id)
      .then(r => r.json())
      .then(resp => {
        if (resp.status === 'complete' && resp.data) setData(resp.data);
      })
      .catch(() => {})
      .finally(() => setLoading(false));
  }, []);

  if (loading) {
    return (
      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "60vh", flexDirection: "column", gap: 16 }}>
        <Spinner/>
        <p style={{ fontSize: 14, color: "#6B6B6B" }}>Loading your results…</p>
      </div>
    );
  }

  return React.createElement(AuditCtx.Provider, { value: data }, children);
}

/* Helper: category key → display label */
const CAT_LABELS = {
  performance:            "Performance",
  keyword_clarity:        "Keyword Clarity",
  landing_page_experience:"Landing Page Experience",
  conversion_architecture:"Conversion Architecture",
  trust_signals:          "Trust Signals",
  tracking:               "Tracking",
  mobile:                 "Mobile Experience",
};

function Spinner() {
  return (
    <svg width="14" height="14" viewBox="0 0 24 24" style={{ animation: "ph-spin 0.8s linear infinite" }}>
      <circle cx="12" cy="12" r="9" fill="none" stroke="#985830" strokeWidth="2.5" strokeOpacity="0.25"/>
      <path d="M21 12a9 9 0 0 0-9-9" fill="none" stroke="#985830" strokeWidth="2.5" strokeLinecap="round"/>
    </svg>
  );
}
/* =============== NAV =============== */
function Nav({ active }) {
  const linkStyle = (k) => ({
    fontSize: 14, fontWeight: 500,
    color: active === k ? "#1A1A1A" : "#6B6B6B",
    textDecoration: "none",
    transition: "color 150ms cubic-bezier(0.2,0,0,1)",
  });
  return (
    <header style={{
      position: "sticky", top: 0, zIndex: 50,
      background: "rgba(255,255,255,0.96)",
      backdropFilter: "saturate(120%)",
      borderBottom: "1px solid #E8D8C4", height: 64,
    }}>
      <div style={{
        maxWidth: 1200, margin: "0 auto", height: "100%",
        display: "flex", alignItems: "center", justifyContent: "space-between",
        padding: "0 32px",
      }}>
        <a href="/" style={{ textDecoration: "none", fontSize: 24, fontWeight: 700, letterSpacing: "-0.01em", color: "#1A1A1A", lineHeight: 1 }}>
          Phillips<span style={{ color: "#985830" }}>.</span>
        </a>
        <nav style={{ display: "flex", alignItems: "center", gap: 28 }}>
          <a href="/landing-page-audit" style={linkStyle("lp")}>Landing Page Audit</a>
          <a href="/google-ads-audit" style={linkStyle("ga")}>Google Ads Audit</a>
          <a href="/creative-analysis" style={linkStyle("ca")}>Creative Scoring</a>
          <a href="/guides" style={linkStyle("guides")}>Guides</a>
          <BtnFilledSmall onClick={() => window.location.href = '/#contact'}>Get in touch</BtnFilledSmall>
        </nav>
      </div>
    </header>
  );
}

/* =============== SHARED PRIMITIVES =============== */
function SeverityBadge({ kind, size = "md" }) {
  const s = SEV[kind] || SEV.low;
  const pad = size === "sm" ? "3px 9px" : "4px 11px";
  const fs = size === "sm" ? 10 : 11;
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", gap: 6,
      background: s.bg, color: s.fg,
      border: `1px solid ${s.border}`,
      padding: pad, borderRadius: 20,
      fontSize: fs, fontWeight: 700, letterSpacing: "0.10em",
      textTransform: "uppercase", lineHeight: 1, whiteSpace: "nowrap",
    }}>
      <span style={{
        width: 6, height: 6, borderRadius: 999,
        background: s.fg, display: "inline-block",
      }}/>
      {s.label}
    </span>
  );
}

function Eyebrow({ children, color = "#985830" }) {
  return (
    <span style={{
      display: "inline-block",
      fontSize: 11, fontWeight: 700, letterSpacing: "0.12em",
      textTransform: "uppercase", color,
    }}>{children}</span>
  );
}

function SectionHeader({ eyebrow, title, emphasis, sub }) {
  return (
    <div style={{ borderLeft: "3px solid #985830", paddingLeft: 24, marginBottom: 32 }}>
      <Eyebrow>{eyebrow}</Eyebrow>
      <h2 style={{
        fontSize: "clamp(28px, 3.2vw, 36px)", fontWeight: 700,
        letterSpacing: "-0.02em", lineHeight: 1.1,
        color: "#1A1A1A", margin: "10px 0 0", maxWidth: 800,
      }}>
        {title}
        {emphasis && <> <em style={{ fontStyle: "italic", color: "#985830" }}>{emphasis}</em></>}
      </h2>
      {sub && (
        <p style={{ fontSize: 15, lineHeight: 1.6, color: "#6B6B6B", margin: "12px 0 0", maxWidth: 720 }}>
          {sub}
        </p>
      )}
    </div>
  );
}

/* =============== REPORT HEADER (SCORE) =============== */
function ReportHeader() {
  const audit = useAudit();
  const score    = audit ? (audit.health_score ?? 58) : 58;
  const band     = audit ? (audit.score_band   || "Average") : "Average";
  const url      = audit ? (audit.url          || "") : "https://yourstore.com/products/best-seller";
  const pageType = audit ? (audit.page_meta?.page_type === "ecommerce" ? "eCommerce" : "Lead Gen") : "Lead Gen";
  const time     = audit ? new Date(audit.audited_at).toLocaleDateString("en-GB", { day:"numeric", month:"long", year:"numeric" }) : "Demo report";

  return (
    <section style={{
      background: "linear-gradient(180deg, #FFFFFF 0%, #FDF6EE 100%)",
      padding: "56px 0 72px",
      borderBottom: "1px solid #E8D8C4",
    }}>
      <div className="page-w">
        {/* Meta bar — audited URL, timestamp, actions */}
        <div style={{
          display: "flex", justifyContent: "space-between", alignItems: "center",
          flexWrap: "wrap", gap: 16, marginBottom: 36,
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap" }}>
            <Eyebrow>Audit complete</Eyebrow>
            <span style={{ width: 4, height: 4, borderRadius: 999, background: "#E8D8C4" }}/>
            <span style={{ fontSize: 12, color: "#6B6B6B" }}>{time}</span>
          </div>
          <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
            <ShareButton/>
            <PdfDownloadButton/>
            <BtnFilledSmall onClick={() => window.location.href = '/landing-page-audit'}>Run another audit</BtnFilledSmall>
          </div>
        </div>

        {/* URL bar */}
        <div style={{
          background: "#fff", border: "1px solid #E8D8C4", borderRadius: 6,
          padding: "16px 20px",
          display: "flex", alignItems: "center", gap: 14,
          marginBottom: 36,
          boxShadow: "0 2px 8px rgba(152, 88, 48, 0.06)",
        }}>
          <span style={{
            display: "inline-flex", alignItems: "center", justifyContent: "center",
            width: 32, height: 32, borderRadius: 999,
            background: "#F5EBD9", color: "#985830", flexShrink: 0,
          }}>
            <IconLink/>
          </span>
          <div style={{ minWidth: 0, flex: 1 }}>
            <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.12em", textTransform: "uppercase", color: "#6B6B6B", marginBottom: 4 }}>
              Page audited
            </div>
            <div data-audit-url={url} style={{
              fontSize: 16, fontWeight: 600, color: "#1A1A1A",
              letterSpacing: "-0.005em",
              whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
            }}>{url}</div>
          </div>
          <span style={{
            flexShrink: 0,
            display: "inline-flex", alignItems: "center", gap: 6,
            background: "#F5EBD9", color: "#985830",
            border: "1px solid #E8D8C4",
            padding: "6px 12px", borderRadius: 20,
            fontSize: 11, fontWeight: 700, letterSpacing: "0.10em",
            textTransform: "uppercase", lineHeight: 1, whiteSpace: "nowrap",
          }}>
            <span style={{ width: 6, height: 6, borderRadius: 999, background: "#985830" }}/>
            Page type · {pageType}
          </span>
        </div>

        {/* Score + breakdown */}
        <div className="rpt-score-grid" style={{
          display: "grid", gridTemplateColumns: "minmax(280px, 380px) 1fr",
          gap: 40, alignItems: "stretch",
        }}>
          <ScoreCard score={score} band={band}/>
          <ScoreBreakdown/>
        </div>
      </div>
    </section>
  );
}

function ScoreCard({ score, band }) {
  return (
    <div style={{
      background: "linear-gradient(135deg, #1A1A1A 0%, #241408 100%)",
      borderRadius: 6, padding: "36px 32px 32px",
      color: "#fff", position: "relative", overflow: "hidden",
      display: "flex", flexDirection: "column",
    }}>
      <Eyebrow color="#B87040">Health score</Eyebrow>
      <div style={{
        display: "flex", alignItems: "baseline", gap: 10,
        margin: "18px 0 8px",
      }}>
        <span style={{
          fontSize: 120, fontWeight: 700, letterSpacing: "-0.05em",
          lineHeight: 0.9, color: "#fff",
          fontVariantNumeric: "tabular-nums",
        }}>{score}</span>
        <span style={{
          fontSize: 24, fontWeight: 500, letterSpacing: "-0.02em",
          color: "rgba(255,255,255,0.5)",
        }}>/ 100</span>
      </div>
      <div style={{
        fontSize: 20, fontWeight: 700, letterSpacing: "-0.015em",
        color: "#985830", marginBottom: 24,
      }}>{band}</div>

      {/* Score scale bar */}
      <div style={{ marginTop: "auto" }}>
        <div style={{
          height: 4, borderRadius: 2, position: "relative",
          background: "linear-gradient(90deg, #B83A1F 0%, #985830 40%, #B87040 60%, #4F7A4A 100%)",
          marginBottom: 10,
        }}>
          <div style={{
            position: "absolute", top: -4, bottom: -4,
            left: `calc(${score}% - 6px)`, width: 12,
            background: "#fff", borderRadius: 2,
            boxShadow: "0 0 0 2px #241408",
          }}/>
        </div>
        <div style={{
          display: "flex", justifyContent: "space-between",
          fontSize: 11, color: "rgba(255,255,255,0.5)", letterSpacing: "-0.005em",
        }}>
          <span>0 · Needs work</span>
          <span>50 · Mixed</span>
          <span>100 · Excellent</span>
        </div>
      </div>
    </div>
  );
}

function ScoreBreakdown() {
  const rows = [
    { cat: "Performance",            score: 58, total: 25, issues: 3, top: "high" },
    { cat: "Keyword Clarity",        score: 72, total: 15, issues: 1, top: "medium" },
    { cat: "Landing Page Experience",score: 64, total: 20, issues: 2, top: "medium" },
    { cat: "Conversion Architecture",score: 50, total: 20, issues: 2, top: "high" },
    { cat: "Trust Signals",          score: 70, total: 10, issues: 1, top: "low" },
    { cat: "Mobile",                 score: 80, total: 10, issues: 1, top: "low" },
  ];
  return (
    <div style={{
      background: "#fff", border: "1px solid #E8D8C4", borderRadius: 6,
      padding: "24px 28px",
      display: "flex", flexDirection: "column",
    }}>
      <div style={{
        display: "flex", justifyContent: "space-between", alignItems: "center",
        marginBottom: 8,
      }}>
        <Eyebrow>Score breakdown</Eyebrow>
        <span style={{ fontSize: 11, color: "#6B6B6B", letterSpacing: "-0.005em" }}>
          10 findings · 2 high · 5 medium · 3 low
        </span>
      </div>
      <div style={{ display: "flex", flexDirection: "column" }}>
        {rows.map((r, i) => (
          <div key={i} style={{
            display: "grid",
            gridTemplateColumns: "1.4fr 1fr auto",
            gap: 16, alignItems: "center",
            padding: "12px 0",
            borderTop: i === 0 ? 0 : "1px solid #E8D8C4",

function ProblemFixImpact({ detail, fix, impact, dense }) {
  const Row = ({ label, body }) => (
    <div style={{
      display: "grid",
      gridTemplateColumns: dense ? "78px 1fr" : "86px 1fr",
      gap: 16,
      padding: dense ? "10px 0" : "12px 0",
      borderTop: "1px solid #F0E5D2",
    }}>
      <div style={{
        fontSize: 10, fontWeight: 700, letterSpacing: "0.14em",
        textTransform: "uppercase", color: "#985830",
        paddingTop: 3,
      }}>{label}</div>
      <div style={{ fontSize: dense ? 13 : 14, lineHeight: 1.6, color: "#1A1A1A" }}>
        {body}
      </div>
    </div>
  );
  // Don't show Problem if it's blank or identical to Fix (old stored audits)
  const showProblem = detail && detail !== fix;
  return (
    <div>
      {showProblem && <Row label="Problem" body={detail}/>}
      {fix    && <Row label="Fix" body={fix}/>}
      {impact && <Row label="Impact" body={<span style={{ color: "#6B6B6B" }}>{impact}</span>}/>}
    </div>
  );
}

  return (

function KeywordInference() {
  const audit = useAudit();
  const mockNgrams = [
    { phrase: "wool throw",          freq: 9, inH1: false, inTitle: true,  inUrl: false },
    { phrase: "premium wool",        freq: 7, inH1: false, inTitle: true,  inUrl: false },
    { phrase: "best seller",         freq: 6, inH1: false, inTitle: true,  inUrl: true  },
    { phrase: "slow mornings",       freq: 5, inH1: true,  inTitle: false, inUrl: false },
    { phrase: "merino wool throw",   freq: 4, inH1: false, inTitle: false, inUrl: false },
  ];
  const ngrams = audit
    ? (audit.categories?.keyword_clarity?.top_ngrams || []).map(n => ({
        phrase:  n.phrase || n.ngram || n,
        freq:    n.freq   || n.count || 0,
        inH1:    n.inH1   || false,
        inTitle: n.inTitle || false,
        inUrl:   n.inUrl  || false,
      }))
    : mockNgrams;

  return (
    <section className="sec-cream">
      <div className="page-w">
        <SectionHeader
          eyebrow="Keyword inference"

}

function InferenceCard() {
  const audit = useAudit();
  const keyword    = audit ? (audit.inferred_keyword || audit.categories?.keyword_clarity?.inferred_keyword || "—") : "premium wool throw";
  const confidence = audit ? (audit.keyword_confidence || audit.categories?.keyword_clarity?.confidence || "medium") : "medium";
  const reason     = audit ? (audit.keyword_confidence_reason || audit.categories?.keyword_clarity?.confidence_reason || "") : "H1 lifestyle copy and title-tag product copy disagree. Confidence sits in medium territory — that ambiguity is itself a Quality Score risk.";
  const confPct    = { high: "90%", medium: "60%", low: "30%", none: "10%" }[confidence] || "60%";
  const confLabel  = confidence.charAt(0).toUpperCase() + confidence.slice(1);

  return (
    <div style={{
      background: "#fff", border: "1px solid #E8D8C4", borderRadius: 6,
      padding: "28px 32px",
      display: "flex", flexDirection: "column",
    }}>
      <Eyebrow>AI inference</Eyebrow>
      <div style={{
        fontSize: 11, fontWeight: 700, letterSpacing: "0.10em",
        textTransform: "uppercase", color: "#6B6B6B",
        marginTop: 20, marginBottom: 10,
      }}>Primary keyword</div>
      <div style={{
        fontSize: 28, fontWeight: 700, letterSpacing: "-0.02em",
        lineHeight: 1.15, color: "#1A1A1A", marginBottom: 20,
      }}>{keyword || <span style={{ color: "#6B6B6B", fontStyle: "italic", fontSize: 18 }}>Could not infer</span>}</div>

      <div style={{ marginBottom: 16 }}>
        <div style={{
          display: "flex", justifyContent: "space-between",
          fontSize: 12, color: "#6B6B6B", marginBottom: 8,
        }}>
          <span>Confidence</span>
          <span style={{ fontWeight: 600, color: "#1A1A1A" }}>{confLabel}</span>
        </div>
        <div style={{ height: 6, background: "#F5EBD9", borderRadius: 3, overflow: "hidden" }}>
          <div style={{ width: confPct, height: "100%", background: "#985830", borderRadius: 3 }}/>
        </div>
      </div>

      {reason && (
        <div style={{
          fontSize: 13, lineHeight: 1.6, color: "#1A1A1A",
          background: "#FDF6EE", padding: "14px 16px",
          borderRadius: 4, borderLeft: "3px solid #985830",
        }}>
          {reason}
        </div>
      )}
    </div>
  );
}

/* =============== LPE ESTIMATE =============== */
function LpeSection() {
  const audit = useAudit();

  const mockLpe = [
    { signal: "H1 keyword match",                  state: "weak",    note: "H1 doesn't echo URL or title-tag keyword" },
    { signal: "Title tag clarity",                 state: "strong",  note: "Keyword in first 40 characters" },
    { signal: "Above-fold message match",          state: "average", note: "No restatement of offer in first viewport" },
    { signal: "Mobile LCP under 2.5s",             state: "weak",    note: "5.20s — Landing Page Experience deduction" },
    { signal: "Single primary CTA",                state: "weak",    note: "Four competing CTAs above the fold" },
    { signal: "Returns / risk reducer near CTA",   state: "average", note: "Present in footer, not adjacent to CTA" },
    { signal: "Privacy policy linked",             state: "strong",  note: "Visible in footer" },
  ];

  const lpe = audit ? (() => {
    const l = audit.categories?.landing_page_experience || {};
    const p = audit.categories?.performance || {};
    const conv = audit.categories?.conversion_architecture || {};
    const trust = audit.categories?.trust_signals || {};
    const lcpMs = p.lcp ? parseFloat(p.lcp) : null;
    function s(v, trueState, falseState) { return v === true ? trueState : v === false ? falseState : "average"; }
    return [
      { signal: "H1 keyword match",        state: s(l.h1_contains_keyword, "strong", "weak"),   note: l.h1 ? `H1: "${l.h1}"` : "H1 not detected" },
      { signal: "Title tag clarity",       state: l.title ? "strong" : "weak",                  note: l.title || "Title tag not detected" },
      { signal: "Above-fold message match",state: l.above_fold_signal === "strong" ? "strong" : l.above_fold_signal === "moderate" ? "average" : "weak", note: l.above_fold_signal || "—" },
      { signal: "Mobile LCP under 2.5s",   state: lcpMs == null ? "average" : lcpMs <= 2.5 ? "strong" : "weak", note: p.lcp ? `${p.lcp} mobile` : "No data" },
      { signal: "Single primary CTA",      state: s(conv.conversion_goal_clarity === "single", "strong", "weak"), note: conv.cta_text ? `"${conv.cta_text}"` : conv.conversion_goal_clarity || "—" },
      { signal: "Risk reducer near CTA",   state: s(trust.risk_reducer_present, "strong", "weak"), note: trust.risk_reducer_type || (trust.risk_reducer_present ? "Present" : "Not detected") },
      { signal: "Privacy policy linked",   state: s(trust.has_privacy_link, "strong", "average"), note: trust.has_privacy_link ? "Present" : "Not detected" },
    ];
  })() : mockLpe;

  return (
    <section className="sec-white">
      <div className="page-w">
        <SectionHeader
          eyebrow="Landing Page Experience"
          title="Estimated rating against"
          emphasis="the same signals Google uses."
          sub="The signals here mirror Google's published Landing Page Experience guidance. Estimated rating is calculated from the signal mix below."
        />
        <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 16 }}>
          <LpeTable rows={lpe}/>
        </div>
      </div>
    </section>
  );
}

function LpeTable({ rows }) {
  const STATE = {
    weak:    { label: "Below average", fg: "#B83A1F", bg: "#F8E4DC", border: "#EBC4B5" },

  const totals = rows.reduce((a, r) => { a[r.state]++; return a; }, { weak:0, average:0, strong:0 });
  const ratingBand =
    totals.weak >= 3 ? { label: "Below average", fg: "#B83A1F" }
    : totals.weak >= 1 ? { label: "Average", fg: "#985830" }
    : { label: "Above average", fg: "#4F7A4A" };

        <div style={{ display: "flex", gap: 18, fontSize: 12, color: "#6B6B6B" }}>
          <span><strong style={{ color: "#4F7A4A" }}>{totals.strong}</strong> above</span>
          <span><strong style={{ color: "#985830" }}>{totals.average}</strong> average</span>
          <span><strong style={{ color: "#B83A1F" }}>{totals.weak}</strong> below</span>
        </div>
      </div>

      <div style={{
        display: "grid",
        gridTemplateColumns: "minmax(220px, 1.2fr) 160px 1fr",
        gap: 16, padding: "14px 28px",
        borderBottom: "1px solid #E8D8C4",

        <span>Assessment</span>
        <span>Note</span>

      {rows.map((r, i) => {

        return (

                <span style={{ width: 6, height: 6, borderRadius: 999, background: s.fg }}/>
                {s.label}
              </span>
            </span>
            <span style={{ fontSize: 13, color: "#6B6B6B", lineHeight: 1.5 }}>{r.note}</span>
          </div>
        );
      })}
    </div>
  );
}

function TrackingTable({ rows }) {
  const DOT = {
    ok:      { fg: "#4F7A4A", bg: "#E6EFE4", border: "#CDDCC8", label: "Firing",              icon: "check" },
    partial: { fg: "#985830", bg: "#F5EBD9", border: "#E8D8C4", label: "Remarketing only",    icon: "cross" },
    missing: { fg: "#B83A1F", bg: "#F8E4DC", border: "#EBC4B5", label: "Not detected",        icon: "cross" },
  };
  const safeDot = (s) => DOT[s] || DOT.missing;
  const Glyph = ({ kind, color }) => kind === "check" ? (
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">

    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
      <line x1="5" y1="5" x2="19" y2="19"/>
      <line x1="19" y1="5" x2="5" y2="19"/>
    </svg>
  );

  return (
    <div style={{
      background: "#fff", border: "1px solid #E8D8C4", borderRadius: 6,
      overflow: "hidden",
    }}>
      <div style={{
        display: "grid",
        gridTemplateColumns: "1fr 220px",
        gap: 16, padding: "14px 28px",
        background: "#FDF6EE",
        borderBottom: "1px solid #E8D8C4",
        fontSize: 10, fontWeight: 700, letterSpacing: "0.12em",
        textTransform: "uppercase", color: "#6B6B6B",
      }}>
        <span>Tag</span>
        <span>Status</span>
      </div>
      {rows.map((r, i) => {
        const d = safeDot(r.status);
        return (
          <div key={i} style={{
            display: "grid",
            gridTemplateColumns: "1fr 220px",
            gap: 16, padding: "18px 28px",
            borderTop: i === 0 ? 0 : "1px solid #F0E5D2",

              {r.tag}

            <span style={{
              display: "inline-flex", alignItems: "center", gap: 8,
              background: d.bg, border: `1px solid ${d.border}`,
              padding: "6px 12px", borderRadius: 20,

              <Glyph kind={d.icon} color={d.fg}/>
              <span style={{ fontSize: 12, color: d.fg, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase" }}>{d.label}</span>
            </span>
          </div>
        );
      })}
    </div>
  );
}

const PDF_SEV = {
  critical: { label: "CRITICAL", fg: "#7B1C0C", bg: "#F5D5CD", border: "#E8B4A8" },
  high:     { label: "HIGH",     fg: "#B83A1F", bg: "#F8E4DC", border: "#EBC4B5" },
  medium:   { label: "MEDIUM",   fg: "#985830", bg: "#F5EBD9", border: "#E8D8C4" },
  low:      { label: "LOW",      fg: "#6B6B6B", bg: "#EFECE6", border: "#DCD7CC" },
  pass:     { label: "PASS",     fg: "#4F7A4A", bg: "#E6EFE4", border: "#CDDCC8" },
  suggest:  { label: "SUGGEST",  fg: "#4A6B7A", bg: "#E4EEF2", border: "#C0D8E4" },
};
function safePdfSev(s) { return PDF_SEV[s] || PDF_SEV.low; }
const PDF_STATE = {
  weak:    { label: "BELOW AVG",  fg: "#B83A1F", bg: "#F8E4DC", border: "#EBC4B5" },
  average: { label: "AVERAGE",    fg: "#985830", bg: "#F5EBD9", border: "#E8D8C4" },
  strong:  { label: "ABOVE AVG",  fg: "#4F7A4A", bg: "#E6EFE4", border: "#CDDCC8" },
};

function PdfPill({ tokens, children }) {
  return (
    <span style={{
      display: "inline-block",
      background: tokens.bg, color: tokens.fg,
      border: `1px solid ${tokens.border}`,
      padding: "2px 9px",
      borderRadius: 20,
      fontSize: 9, fontWeight: 700, letterSpacing: "0.10em",
      textTransform: "uppercase",
      lineHeight: 1.3, whiteSpace: "nowrap",
    }}>{children}</span>
  );
}

function PdfEyebrow({ children }) {
  return (
    <div style={{
      fontSize: 9, fontWeight: 700, letterSpacing: "0.14em",
      textTransform: "uppercase", color: "#985830",
    }}>{children}</div>
  );
}

function PdfSectionTitle({ eyebrow, title, sub }) {
  return (
    <div style={{ borderLeft: "3px solid #985830", paddingLeft: 16, marginBottom: 18 }}>
      <PdfEyebrow>{eyebrow}</PdfEyebrow>
      <h2 style={{
        margin: "6px 0 0",
        fontSize: 22, fontWeight: 700, color: "#1A1A1A",
        letterSpacing: "-0.01em", lineHeight: 1.15,
      }}>{title}</h2>
      {sub && (
        <p style={{
          margin: "8px 0 0", fontSize: 11, lineHeight: 1.55,
          color: "#6B6B6B", maxWidth: 600,
        }}>{sub}</p>
      )}
    </div>
  );
}

function PdfPFI({ problem, fix, impact }) {
  const Row = ({ label, body, dim }) => (
    <div style={{
      display: "flex",
      gap: 12,
      padding: "6px 0",
      borderTop: "1px solid #F0E5D2",
    }}>
      <div style={{
        flex: "0 0 56px",
        fontSize: 8, fontWeight: 700, letterSpacing: "0.14em",
        textTransform: "uppercase", color: "#985830",
        paddingTop: 2,
      }}>{label}</div>
      <div style={{
        flex: 1,
        fontSize: 10.5, lineHeight: 1.55,
        color: dim ? "#6B6B6B" : "#1A1A1A",
      }}>{body}</div>
    </div>
  );
  return (
    <div>
      <Row label="Problem" body={problem}/>
      <Row label="Fix" body={fix}/>
      <Row label="Impact" body={impact} dim/>
    </div>
  );
}

function PdfFinding({ severity, title, problem, fix, impact, idx, total }) {
  return (
    <div style={{
      padding: "12px 0",
      borderTop: idx > 0 ? "1px solid #F0E5D2" : 0,
      breakInside: "avoid",
      pageBreakInside: "avoid",
    }}>
      <div style={{ display: "flex", gap: 12, alignItems: "flex-start" }}>
        <div style={{ flex: "0 0 90px", paddingTop: 2 }}>
          <PdfPill tokens={safePdfSev(severity)}>{safePdfSev(severity).label}</PdfPill>
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <h4 style={{
            margin: "0 0 8px", fontSize: 12, fontWeight: 700,
            color: "#1A1A1A", lineHeight: 1.3, letterSpacing: "-0.005em",
          }}>{title}</h4>
          <PdfPFI problem={problem} fix={fix} impact={impact}/>
        </div>
      </div>
    </div>
  );
}

function PdfCategory({ cat }) {
  const counts = cat.findings.reduce((a, f) => { a[f.severity] = (a[f.severity] || 0) + 1; return a; }, {});
  return (
    <section style={{
      marginBottom: 20,
      border: "1px solid #E8D8C4",
      borderRadius: 4,
      overflow: "hidden",
      breakInside: "avoid",
      pageBreakInside: "avoid",
    }}>
      <div style={{
        background: "#FDF6EE",
        padding: "12px 16px",
        borderBottom: "1px solid #E8D8C4",
        display: "flex", alignItems: "center", gap: 12,
      }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <h3 style={{
            margin: "0 0 4px",
            fontSize: 14, fontWeight: 700, letterSpacing: "-0.01em",
            color: "#1A1A1A",
          }}>{cat.name}</h3>
          <div style={{ fontSize: 10, color: "#6B6B6B", lineHeight: 1.45 }}>
            {cat.blurb}
          </div>
        </div>
        <div style={{ display: "flex", gap: 4, flexShrink: 0 }}>
          {["critical", "high", "medium", "low", "pass", "suggest"].map(k => counts[k] ? (
            <PdfPill key={k} tokens={safePdfSev(k)}>{counts[k]} {safePdfSev(k).label}</PdfPill>
          ) : null)}
        </div>
        <div style={{

          letterSpacing: "-0.01em", marginLeft: 8,
          flexShrink: 0,

      </div>

      <div style={{ padding: "4px 16px 12px" }}>

      </div>
    </section>
  );
}

    </div>
  );
}

            }}>Primary keyword</div>
            <div style={{
              fontSize: 20, fontWeight: 700, color: "#1A1A1A",
              letterSpacing: "-0.01em", marginBottom: 14, lineHeight: 1.15,
            }}>{d.keyword.primary}</div>

            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 9, color: "#6B6B6B", marginBottom: 4 }}>
              <span>Confidence</span>
              <span style={{ fontWeight: 700, color: "#1A1A1A" }}>{d.keyword.confidence}</span>
            </div>
            <div style={{ height: 5, background: "#F5EBD9", borderRadius: 3, overflow: "hidden", marginBottom: 12 }}>
              <div style={{ width: `${d.keyword.confidencePct}%`, height: "100%", background: "#985830" }}/>
            </div>

            <div style={{
              fontSize: 10, lineHeight: 1.5, color: "#1A1A1A",
              background: "#FDF6EE", padding: "10px 12px",
              borderLeft: "3px solid #985830", borderRadius: 2,
            }}>{d.keyword.note}</div>
          </div>

          <div style={{
            border: "1px solid #E8D8C4", borderRadius: 4,
            padding: "12px 14px",
          }}>
            <PdfEyebrow>Top n-grams</PdfEyebrow>
            <div style={{
              display: "grid", gridTemplateColumns: "1fr 40px 76px",
              gap: 8, alignItems: "center",
              marginTop: 8, paddingBottom: 6,
              borderBottom: "1px solid #E8D8C4",
              fontSize: 7.5, fontWeight: 700, letterSpacing: "0.12em",
              textTransform: "uppercase", color: "#6B6B6B",
            }}>
              <span>Phrase</span>
              <span style={{ textAlign: "right" }}>Count</span>
              <span style={{ textAlign: "right" }}>Signals</span>
            </div>
            {d.keyword.ngrams.map((r, i) => {
              const Chip = ({ on, label }) => (
                <span style={{
                  display: "inline-block",
                  width: 20, padding: "2px 0",
                  textAlign: "center",
                  fontSize: 7, fontWeight: 700,
                  borderRadius: 2,
                  background: on ? "#985830" : "#F5EBD9",
                  color: on ? "#fff" : "#985830",
                  border: `1px solid ${on ? "#985830" : "#E8D8C4"}`,
                  marginLeft: 2,
                }}>{label}</span>
              );
              return (
                <div key={i} style={{
                  display: "grid", gridTemplateColumns: "1fr 40px 76px",
                  gap: 8, alignItems: "center",
                  padding: "6px 0",
                  borderTop: i === 0 ? 0 : "1px solid #F0E5D2",
                  fontSize: 10,
                }}>
                  <span style={{ color: "#1A1A1A", fontWeight: 500 }}>{r.phrase}</span>
                  <span style={{ textAlign: "right", color: "#6B6B6B" }}>{r.freq}</span>
                  <span style={{ textAlign: "right" }}>
                    <Chip on={r.h1}  label="H1"/>
                    <Chip on={r.tt}  label="TT"/>
                    <Chip on={r.url} label="URL"/>
                  </span>
                </div>
              );
            })}
          </div>
        </div>

        {/* LPE table */}
        <PdfSectionTitle
          eyebrow="Landing Page Experience"
          title="Estimated rating against the signals Google uses."
        />
        <div style={{
          border: "1px solid #E8D8C4", borderRadius: 4, overflow: "hidden", marginBottom: 24,
          breakInside: "avoid", pageBreakInside: "avoid",
        }}>
          <div style={{
            background: "#FDF6EE", padding: "10px 16px",
            borderBottom: "1px solid #E8D8C4",
            display: "grid", gridTemplateColumns: "1.4fr 110px 1fr", gap: 12,
            fontSize: 8, fontWeight: 700, letterSpacing: "0.12em",
            textTransform: "uppercase", color: "#6B6B6B",
          }}>
            <span>Signal</span>
            <span>Assessment</span>
            <span>Note</span>
          </div>
          {d.lpe.map((r, i) => (
            <div key={i} style={{
              display: "grid", gridTemplateColumns: "1.4fr 110px 1fr",
              gap: 12, padding: "10px 16px",
              borderTop: i === 0 ? 0 : "1px solid #F0E5D2",
              alignItems: "center",
            }}>
              <span style={{ fontSize: 10.5, fontWeight: 700, color: "#1A1A1A" }}>{r.signal}</span>
              <span><PdfPill tokens={PDF_STATE[r.state]}>{PDF_STATE[r.state].label}</PdfPill></span>
              <span style={{ fontSize: 10, color: "#6B6B6B", lineHeight: 1.45 }}>{r.note}</span>
            </div>
          ))}
        </div>

        {/* Tracking */}
        <PdfSectionTitle
          eyebrow="Tracking status"
          title="What's firing on this page."
          sub="Detected from page source and rendered page data. Tags loaded dynamically via a tag manager container may not appear even if they are firing correctly."
        />
        <div style={{
          border: "1px solid #E8D8C4", borderRadius: 4, overflow: "hidden",
          breakInside: "avoid", pageBreakInside: "avoid",
        }}>
          <div style={{
            background: "#FDF6EE", padding: "10px 16px",
            borderBottom: "1px solid #E8D8C4",
            display: "grid", gridTemplateColumns: "1fr 180px",
            fontSize: 8, fontWeight: 700, letterSpacing: "0.12em",
            textTransform: "uppercase", color: "#6B6B6B",
          }}>
            <span>Tag</span>
            <span>Status</span>
          </div>
          {d.tracking.map((r, i) => {
            const ok = r.status === "ok";
            const tokens = ok
              ? { fg: "#4F7A4A", bg: "#E6EFE4", border: "#CDDCC8", label: "FIRING" }
              : { fg: "#B83A1F", bg: "#F8E4DC", border: "#EBC4B5", label: "NOT DETECTED" };
            return (
              <div key={i} style={{
                display: "grid", gridTemplateColumns: "1fr 180px",
                padding: "12px 16px",
                borderTop: i === 0 ? 0 : "1px solid #F0E5D2",
                alignItems: "center",
              }}>
                <span style={{ fontSize: 12, fontWeight: 700, color: "#1A1A1A" }}>{r.tag}</span>
                <span><PdfPill tokens={tokens}>{ok ? "✓ " : "â "}{tokens.label}</PdfPill></span>
              </div>
            );
          })}
        </div>

        {/* End footer line */}
        <div style={{
          marginTop: 32, paddingTop: 12, borderTop: "1px solid #E8D8C4",
          display: "flex", justifyContent: "space-between",
          fontSize: 9, color: "#6B6B6B", letterSpacing: "-0.005em",
        }}>
          <span>End of report · {d.audited}</span>
          <span>phillips-uk.com</span>
        </div>
      </div>
    </div>
  );
}

/* =============== ERROR BOUNDARY =============== */
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(e) { return { error: e }; }
  render() {
    if (this.state.error) {
      return (
        <div style={{ padding: "80px 32px", maxWidth: 640, margin: "0 auto", textAlign: "center" }}>
          <div style={{ fontSize: 14, fontWeight: 700, color: "#985830", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 16 }}>Report error</div>
          <h1 style={{ fontSize: 28, fontWeight: 700, color: "#1A1A1A", marginBottom: 16 }}>Something went wrong rendering this report</h1>
          <p style={{ fontSize: 15, color: "#6B6B6B", marginBottom: 32 }}>The audit completed successfully but the report couldn't render. Try running the audit again or contact lewis@phillips-uk.com if the issue persists.</p>
          <a href="/landing-page-audit" style={{ display: "inline-block", background: "#985830", color: "#fff", padding: "12px 24px", borderRadius: 4, textDecoration: "none", fontWeight: 600, fontSize: 14 }}>Run a new audit →</a>
        </div>
      );
    }
    return this.props.children;
  }
}

/* =============== APP =============== */
function App() {
  return (
    <ErrorBoundary>
      <AuditProvider>
        <div data-screen-label="01 Landing Page Audit Report">
          <Nav active="lp"/>
          <ReportHeader/>
          <PriorityActions/>
          <KeywordInference/>
          <LpeSection/>
          <TrackingSection/>
          <FindingsByCategory/>
          <EndCta/>
          <Footer/>
          <PdfLayout/>
        </div>
      </AuditProvider>
    </ErrorBoundary>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
