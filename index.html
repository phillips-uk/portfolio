/* =============== BUTTONS =============== */
function BtnFilled({ children, onClick, small }) {
  const [h, setH] = React.useState(false);
  return (
    <button onClick={onClick} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{
        background: h ? "#7A3F1F" : "#985830", color: "#fff", border: 0,
        padding: small ? "10px 20px" : "14px 30px",
        fontSize: small ? 13 : 14, fontWeight: 600,
        borderRadius: 4, cursor: "pointer", fontFamily: "inherit",
        transition: "background 150ms cubic-bezier(0.2,0,0,1)",
        letterSpacing: "-0.005em",
      }}>{children}</button>
  );
}
function BtnOutline({ children, onClick, small }) {
  const [h, setH] = React.useState(false);
  return (
    <button onClick={onClick} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{
        background: h ? "#985830" : "transparent",
        color: h ? "#fff" : "#985830",
        border: "1.5px solid #985830",
        padding: small ? "9px 18px" : "12px 28px",
        fontSize: small ? 13 : 14, fontWeight: 600,
        borderRadius: 4, cursor: "pointer", fontFamily: "inherit",
        transition: "all 150ms cubic-bezier(0.2,0,0,1)",
      }}>{children}</button>
  );
}

function LogoItem({ name, src, href }) {
  const [h, setH] = React.useState(false);
  const imgEl = (
    <img
      src={src}
      alt={name}
      style={{
        height: 36,
        maxWidth: 130,
        objectFit: "contain",
        filter: h ? "grayscale(0) opacity(1)" : "grayscale(1) opacity(0.45)",
        transition: "filter 200ms ease",
        display: "block",
      }}
    />
  );
  const cellStyle = {
    display: "flex", alignItems: "center", justifyContent: "center",
    padding: "28px 20px",
  };
  return href ? (
    <a
      href={href}
      target="_blank"
      rel="noopener noreferrer"
      onMouseEnter={() => setH(true)}
      onMouseLeave={() => setH(false)}
      style={{ ...cellStyle, textDecoration: "none" }}
    >{imgEl}</a>
  ) : (
    <div
      onMouseEnter={() => setH(true)}
      onMouseLeave={() => setH(false)}
      style={cellStyle}
    >{imgEl}</div>
  );
}
