<meta charset="utf-8">

<meta property="og:type" content="website">

<style>
  :root {
    --font-sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --ink: #1A1A1A;
    --white: #ffffff;
    --cream: #FDF6EE;
    --amber: #985830;
    --mid: #6B6B6B;
    --border: #E8D8C4;
  }
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--font-sans); color: var(--ink); background: var(--white); }
  .page-w { max-width: 1200px; margin: 0 auto; padding: 0 32px; }
  .read-w { max-width: 720px; margin: 0 auto; padding: 0 32px; }
  .sec-white { background: #fff; padding: 64px 0; }
  .sec-cream { background: #FDF6EE; padding: 64px 0; }
  ::selection { background: #985830; color: #fff; }
  *, *::before, *::after { box-sizing: border-box; }
  @media (max-width: 700px) {
    .page-w { padding: 0 20px; }
    .nav-links { display: none; }
    .nav-cta { display: none; }
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>

<body>
<!-- GTM noscript -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WS5CP6NW"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<div id="root"></div>

<script type="text/babel">

/* =============== CATEGORY TOKENS =============== */
const CAT = {
  "Google Ads":         { fg: "#985830", bg: "#F5EBD9", border: "#E8D8C4" },
  "Conversion Tracking":{ fg: "#985830", bg: "#F5EBD9", border: "#E8D8C4" },
  "Landing Pages":      { fg: "#2E5F5C", bg: "#DCEAE8", border: "#BFD6D2" },
  "Tracking":           { fg: "#4F5760", bg: "#E4E7EB", border: "#CFD4DA" },
};

/* =============== GUIDES =============== */
const GUIDES = [
  {
    slug: "ga4-imports-break-smart-bidding",
    cat: "Google Ads",
    time: "5 min read",
    date: "26 May 2026",
    title: "Why GA4 imports break Smart Bidding",
    desc: "The most common paid media mistake — and why it’s not obvious until CPA doubles.",
    live: true,
  },
  {
    slug: "fix-google-ads-conversion-tracking",
    cat: "Conversion Tracking",
    time: "12 min read",
    date: "21 May 2026",
    title: "How to Fix Google Ads Conversion Tracking",
    desc: "The seven most common causes of broken conversion tracking — inactive actions, duplicate counting, wrong primary/secondary setup, Enhanced Conversions failures and Consent Mode v2 silent issues.",
    live: true,
  },
  {
    slug: "tcpa-thin-conversion-window",
    cat: "Google Ads",
    time: "4 min read",
    title: "tCPA on a thin conversion window",
    desc: "How to spot campaigns learning on bad data before they lock in the wrong baseline.",
    live: false,
  },
  {
    slug: "lcp-above-2-5s-real-cpc",
    cat: "Landing Pages",
    time: "6 min read",
    title: "LCP above 2.5s costs you real CPC",
    desc: "The direct line between Core Web Vitals and your Quality Score — with numbers.",
    live: false,
  },
  {
    slug: "consent-mode-v2-defaulting-denied",
    cat: "Tracking",
    time: "5 min read",
    title: "Consent Mode v2 and what defaulting to denied actually means",
    desc: "It’s not a compliance checkbox. It’s a data gap that warps every downstream report.",
    live: false,
  },
  {
    slug: "enhanced-conversions-what-and-why",
    cat: "Google Ads",
    time: "4 min read",
    title: "Enhanced Conversions: what it is, why you probably don’t have it",
    desc: "The easiest high-ROI fix on most accounts. Also the most skipped.",
    live: false,
  },
];

const FILTERS = ["All", "Google Ads", "Landing Pages", "Tracking"];

/* =============== BUTTONS =============== */
function BtnFilled({ children, href }) {
  const [h, setH] = React.useState(false);
  return (
    <a href={href} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{
        display: "inline-flex", alignItems: "center", justifyContent: "center",
        background: h ? "#7A3F1F" : "#985830", color: "#fff",
        padding: "10px 20px", fontSize: 13, fontWeight: 600,
        borderRadius: 4, textDecoration: "none", fontFamily: "inherit",
        transition: "background 150ms cubic-bezier(0.2,0,0,1)",
      }}>{children}</a>
  );
}

/* =============== NAV =============== */
function Nav() {
  const base = { fontSize: 14, fontWeight: 500, color: "#6B6B6B", textDecoration: "none", transition: "color 150ms" };
  const active = { ...base, color: "#1A1A1A", fontWeight: 600 };
  return (
    <header style={{
      position: "sticky", top: 0, zIndex: 50,
      background: "rgba(255,255,255,0.96)",
      backdropFilter: "saturate(120%)",
      borderBottom: "1px solid #E8D8C4", height: 64,
    }}>
      <div style={{
        maxWidth: 1200, margin: "0 auto", height: "100%",
        display: "flex", alignItems: "center", justifyContent: "space-between",
        padding: "0 32px",
      }}>
        <a href="/" style={{ textDecoration: "none", fontSize: 24, fontWeight: 700, letterSpacing: "-0.01em", color: "#1A1A1A", lineHeight: 1 }}>
          Phillips<span style={{ color: "#985830" }}>.</span>
        </a>
        <nav className="nav-links" style={{ display: "flex", alignItems: "center", gap: 28 }}>
          <a href="/landing-page-audit" style={base}>Landing Page Audit</a>
          <a href="/google-ads-audit" style={base}>Google Ads Audit</a>
          <a href="/guides/" style={active}>Guides</a>
          <BtnFilled href="/#contact">Get in touch</BtnFilled>
        </nav>
      </div>
    </header>
  );
}

/* =============== SHARED PRIMITIVES =============== */
function Eyebrow({ children, color = "#985830" }) {
  return (
    <span style={{
      display: "inline-block",
      fontSize: 11, fontWeight: 700, letterSpacing: "0.12em",
      textTransform: "uppercase", color,
    }}>{children}</span>
  );
}

function CategoryPill({ cat, size = "md" }) {
  const t = CAT[cat] || CAT["Google Ads"];
  const pad = size === "sm" ? "3px 9px" : "4px 11px";
  const fs = size === "sm" ? 10 : 11;
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", gap: 6,
      background: t.bg, color: t.fg,
      border: `1px solid ${t.border}`,
      padding: pad, borderRadius: 20,
      fontSize: fs, fontWeight: 700, letterSpacing: "0.10em",
      textTransform: "uppercase", lineHeight: 1, whiteSpace: "nowrap",
    }}>
      <span style={{ width: 6, height: 6, borderRadius: 999, background: t.fg, display: "inline-block" }}/>
      {cat}
    </span>
  );
}

/* =============== HERO =============== */
function Hero() {
  return (
    <section style={{ background: "#fff", padding: "72px 0 56px" }}>
      <div className="page-w">
        <div style={{ borderLeft: "3px solid #985830", paddingLeft: 24, maxWidth: 860 }}>
          <Eyebrow>Guides</Eyebrow>
          <h1 style={{
            fontSize: "clamp(40px, 5.4vw, 64px)", fontWeight: 700,
            letterSpacing: "-0.025em", lineHeight: 1.04,
            color: "#1A1A1A", margin: "16px 0 0",
          }}>
            Things worth knowing before you <em style={{ fontStyle: "italic", color: "#985830" }}>run an audit.</em>
          </h1>
          <p style={{
            fontSize: 18, lineHeight: 1.55, color: "#6B6B6B",
            margin: "20px 0 0", maxWidth: 620,
          }}>
            Short, practical reads. No fluff, no agency speak. Written from 11 years running paid media.
          </p>
        </div>
      </div>
    </section>
  );
}

/* =============== FILTER BAR =============== */
function FilterBar({ value, onChange }) {
  return (
    <div style={{
      position: "sticky", top: 64, zIndex: 40,
      background: "#FDF6EE",
      borderTop: "1px solid #E8D8C4",
      borderBottom: "1px solid #E8D8C4",
    }}>
      <div className="page-w" style={{
        padding: "16px 32px",
        display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap",
      }}>
        <Eyebrow>Filter</Eyebrow>
        <span style={{ width: 4, height: 4, borderRadius: 999, background: "#E8D8C4", margin: "0 6px" }}/>
        {FILTERS.map(f => (
          <FilterPill key={f} label={f} active={value === f} onClick={() => onChange(f)}/>
        ))}
      </div>
    </div>
  );
}

function FilterPill({ label, active, onClick }) {
  const [h, setH] = React.useState(false);
  return (
    <button
      onClick={onClick}
      onMouseEnter={() => setH(true)}
      onMouseLeave={() => setH(false)}
      style={{
        background: active ? "#1A1A1A" : (h ? "#fff" : "transparent"),
        color: active ? "#fff" : "#1A1A1A",
        border: `1px solid ${active ? "#1A1A1A" : "#E8D8C4"}`,
        padding: "8px 16px",
        fontSize: 13, fontWeight: 600,
        borderRadius: 999, cursor: "pointer", fontFamily: "inherit",
        letterSpacing: "-0.005em",
        transition: "background 150ms cubic-bezier(0.2,0,0,1), color 150ms cubic-bezier(0.2,0,0,1)",
      }}>
      {label}
    </button>
  );
}

/* =============== GUIDE GRID =============== */
function GuideGrid({ filter }) {
  const visible = filter === "All" ? GUIDES : GUIDES.filter(g => g.cat === filter);

  return (
    <section className="sec-cream" style={{ padding: "56px 0 96px" }}>
      <div className="page-w">
        <div style={{
          display: "flex", justifyContent: "space-between", alignItems: "flex-end",
          marginBottom: 28, gap: 24, flexWrap: "wrap",
        }}>
          <Eyebrow>{filter === "All" ? "All guides" : filter}</Eyebrow>
          <span style={{ fontSize: 12, color: "#6B6B6B", letterSpacing: "-0.005em" }}>
            {visible.length} {visible.length === 1 ? "guide" : "guides"}
          </span>
        </div>

        <div style={{
          display: "grid",
          gridTemplateColumns: "repeat(auto-fill, minmax(320px, 1fr))",
          gap: 16,
        }}>
          {visible.map(g => <GuideCard key={g.slug} guide={g}/>)}
        </div>

        {visible.length === 0 && (
          <div style={{
            background: "#fff", border: "1px solid #E8D8C4", borderRadius: 6,
            padding: "48px 32px", textAlign: "center",
            color: "#6B6B6B", fontSize: 14,
          }}>
            No guides in this category yet. Check back soon.
          </div>
        )}
      </div>
    </section>
  );
}

function GuideCard({ guide }) {
  const [h, setH] = React.useState(false);
  const isLive = guide.live !== false;

  return (
    <a
      href={isLive ? `/guides/${guide.slug}/` : undefined}
      onClick={!isLive ? (e) => e.preventDefault() : undefined}
      onMouseEnter={() => isLive && setH(true)}
      onMouseLeave={() => setH(false)}
      style={{
        display: "flex", flexDirection: "column",
        textDecoration: "none", color: "inherit",
        background: "#fff",
        border: "1px solid #E8D8C4",
        borderRadius: 6,
        padding: "24px 26px",
        transition: "transform 200ms cubic-bezier(0.2,0,0,1), box-shadow 200ms cubic-bezier(0.2,0,0,1), border-color 200ms cubic-bezier(0.2,0,0,1)",
        transform: h ? "translateY(-3px)" : "translateY(0)",
        boxShadow: h ? "0 8px 28px rgba(152, 88, 48, 0.10)" : "0 1px 0 rgba(152, 88, 48, 0.02)",
        borderColor: h ? "#985830" : "#E8D8C4",
        minHeight: 260,
        cursor: isLive ? "pointer" : "default",
        opacity: isLive ? 1 : 0.6,
      }}>

      <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap", marginBottom: 20 }}>
        <CategoryPill cat={guide.cat} size="sm"/>
        <span style={{ fontSize: 11, color: "#6B6B6B", letterSpacing: "-0.005em" }}>
          {guide.time}
        </span>
        {!isLive && (
          <span style={{
            fontSize: 10, fontWeight: 700, letterSpacing: "0.10em", textTransform: "uppercase",
            color: "#6B6B6B", background: "#F0EEEB", border: "1px solid #E8D8C4",
            padding: "2px 8px", borderRadius: 20,
          }}>Coming soon</span>
        )}
      </div>

      <h3 style={{
        fontSize: 20, fontWeight: 700, letterSpacing: "-0.015em",
        lineHeight: 1.25, color: "#1A1A1A",
        margin: "0 0 12px",
      }}>{guide.title}</h3>

      <p style={{
        fontSize: 14, lineHeight: 1.55, color: "#6B6B6B",
        margin: "0 0 24px",
      }}>{guide.desc}</p>

      {isLive && (
        <span style={{
          marginTop: "auto",
          display: "inline-flex", alignItems: "center", gap: 6,
          fontSize: 13, fontWeight: 600,
          color: "#985830",
          letterSpacing: "-0.005em",
        }}>
          Read guide
          <span style={{
            display: "inline-block",
            transform: h ? "translateX(3px)" : "translateX(0)",
            transition: "transform 200ms cubic-bezier(0.2,0,0,1)",
          }}>&rarr;</span>
        </span>
      )}
    </a>
  );
}

/* =============== END CTA (DARK) =============== */
function EndCta() {
  return (
    <section style={{
      background: "linear-gradient(135deg, #1A1A1A 0%, #241408 100%)",
      padding: "96px 32px",
    }}>
      <div style={{ maxWidth: 880, margin: "0 auto", textAlign: "center" }}>
        <Eyebrow color="#B87040">Ready to check yours?</Eyebrow>
        <h2 style={{
          fontSize: "clamp(36px, 4.6vw, 52px)", fontWeight: 700,
          letterSpacing: "-0.025em", lineHeight: 1.06, color: "#fff",
          margin: "20px 0 32px",
        }}>
          Run the audit. <em style={{ fontStyle: "italic", color: "#985830" }}>See what&rsquo;s actually going on.</em>
        </h2>
        <div style={{ display: "flex", gap: 14, justifyContent: "center", flexWrap: "wrap" }}>
          <a href="/landing-page-audit" style={ctaButtonStyle(true)}>
            Run the Landing Page Audit &rarr;
          </a>
          <a href="/google-ads-audit" style={ctaButtonStyle(false)}>
            Run the Google Ads Audit &rarr;
          </a>
        </div>
        <div style={{ marginTop: 32, fontSize: 13, color: "rgba(255,255,255,0.5)" }}>
          Free &middot; Read-only &middot; No agency pitch
        </div>
      </div>
    </section>
  );
}

function ctaButtonStyle(filled) {
  return {
    display: "inline-flex", alignItems: "center", justifyContent: "center",
    padding: "16px 32px", fontSize: 15, fontWeight: 600,
    color: "#fff",
    background: filled ? "#985830" : "transparent",
    border: filled ? "1.5px solid #985830" : "1.5px solid rgba(255,255,255,0.3)",
    borderRadius: 4, textDecoration: "none", letterSpacing: "-0.005em",
  };
}

/* =============== FOOTER =============== */
function Footer() {
  return (
    <footer style={{
      background: "linear-gradient(135deg, #1A1A1A 0%, #241408 100%)",
      padding: "28px 32px",
    }}>
      <div style={{
        maxWidth: 1200, margin: "0 auto",
        display: "flex", justifyContent: "space-between", alignItems: "center",
        flexWrap: "wrap", gap: 12,
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 16, fontSize: 12, color: "rgba(255,255,255,0.4)" }}>
          <a href="/" style={{ fontSize: 16, fontWeight: 700, color: "#fff", letterSpacing: "-0.01em", textDecoration: "none" }}>
            Phillips<span style={{ color: "#985830" }}>.</span>
          </a>
          <span>&copy; 2026 Lewis Phillips &middot; phillips-uk.com</span>
        </div>
        <div style={{ display: "flex", gap: 20 }}>
          <a href="/landing-page-audit" style={{ fontSize: 12, color: "rgba(255,255,255,0.4)", textDecoration: "none" }}>Landing Page Audit</a>
          <a href="/google-ads-audit" style={{ fontSize: 12, color: "rgba(255,255,255,0.4)", textDecoration: "none" }}>Google Ads Audit</a>
          <a href="/#contact" style={{ fontSize: 12, color: "rgba(255,255,255,0.4)", textDecoration: "none" }}>Get in touch</a>
        </div>
      </div>
    </footer>
  );
}

/* =============== APP =============== */
function App() {
  const [filter, setFilter] = React.useState("All");
  return (
    <div>
      <Nav/>
      <Hero/>
      <FilterBar value={filter} onChange={setFilter}/>
      <GuideGrid filter={filter}/>
      <EndCta/>
      <Footer/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
