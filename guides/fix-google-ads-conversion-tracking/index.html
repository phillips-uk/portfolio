function ArticleBody() {

    <section style={{ background: "#fff", padding: "8px 0 96px" }}>
      <div className="read-w">
        <div className="article-body">

          {/* Why it matters */}
          <h2>Why this matters more than people realise</h2>
          <p>
            When Smart Bidding decides how much to bid for an auction, it draws on your historical conversion data. Every strategy — Target CPA, Target ROAS, Maximise Conversions — works from that same signal. If the data feeding it is incomplete, duplicated, or miscategorised, the algorithm optimises toward the wrong thing.
          </p>
          <p>
            You can have excellent ad copy, tight keyword lists, and a competitive budget, and still get bad results because the conversion data is broken. Most tracking failures are invisible: the account looks like it is working, conversions are being recorded, but the signal going into Smart Bidding is off.
          </p>
          <p>
            <strong>Fix conversion tracking first.</strong> Every other optimisation sits on top of it.
          </p>
        </div>

        {/* Symptoms table */}
        <SymptomsTable/>

        <div className="article-body">
          <h2>The 7 most common conversion tracking issues</h2>
          <p>
            Each of these has a different root cause and a different fix. Identify which applies before making changes — working through them randomly wastes time and makes it harder to know what actually resolved the problem.
          </p>
        </div>

        <PriorityGrid/>

        {/* Issues — each as its own block */}
        <Issue n={1} id="issue-1" title="Conversion action is inactive or shows 'Needs attention'">
          <p>
            Usually the first warning you see. <strong>Inactive</strong> means the conversion tag has not fired within the conversion window (typically 30 days). <strong>Needs attention</strong> flags a configuration issue, often Enhanced Conversions failing or a consent mode conflict.
          </p>
          <p>
            <strong>Fix:</strong> Run Tag Assistant on the conversion page to confirm whether the tag fires at all. If the tag fires but status remains inactive, check that the Conversion ID and Label in the tag exactly match the values in your Google Ads conversion action — a single character difference causes a silent mismatch. For Needs attention errors, go to <strong>Goals › Conversions › Diagnostics</strong> and Google will flag the specific field. Common causes: a phone number not in E.164 format (<code>+44xxxxxxxxxx</code>), or <code>user_data</code> being passed before the consent tag fires.
          </p>
        </Issue>

        <Issue n={2} id="issue-2" title="Duplicate conversion counting">
          <p>
            The most widespread misconfiguration in Google Ads accounts. It happens when two sources are both tracking the same conversion and both are set as primary. The common version: a GTM-deployed Google Ads Conversion Tag <em>and</em> a GA4-imported conversion action both set to Include in Conversions = On for the same event. Every conversion gets counted twice.
          </p>
          <p>
            Impact goes beyond inflated reporting. Smart Bidding receives a corrupted signal — thinks conversions are happening more frequently than they are, at a lower CPA than is real. Performance looks better than it is until you compare against actual revenue or CRM data.
          </p>
          <p>
            <strong>Fix:</strong> Open every conversion action and identify any pairs tracking the same event from different sources. Set the GA4-imported version to <strong>secondary</strong> (Include in Conversions = Off). The GTM-deployed Google Ads Conversion Tag stays primary. Re-run this check every time you add a new conversion source.
          </p>
        </Issue>

        <Issue n={3} id="issue-3" title="GA4 conversions imported as primary">
          <p>
            A subtle issue that most guides don't cover. Importing GA4 conversions into Google Ads is useful — it gives you GA4's attribution model as a reference point. For most lead-generation accounts, though, a native Google Ads conversion tag belongs in the primary slot, with GA4 imports kept secondary for reporting and validation.
          </p>
          <p>
            Two reasons. First, GA4 and Google Ads can attribute the same conversion differently because they use different reporting models, lookback settings and event processing paths. Bidding against a GA4-attributed metric means Smart Bidding works from data that doesn't always match how Google Ads measures performance. Second, GA4 import latency means conversions can appear in reports with a delay, so the algorithm operates on incomplete recent data.
          </p>
        </Issue>

        <ArchitectureDiagram/>

        <div className="article-body">
          <p>
            <strong>Fix:</strong> For every conversion action imported from GA4, set <strong>Include in Conversions = Off</strong>. Keep the import for reference and reporting; let your GTM-deployed Google Ads Conversion Tag carry the bidding weight. The rule isn't "never import GA4" — it's "never let two sources track the same event as primary".
          </p>
        </div>

        <Issue n={4} id="issue-4" title="Conversion tag firing on page load instead of the actual conversion">
          <p>
            Happens most often when an account is set up quickly. A conversion tag gets attached to a Page View trigger on the thank-you URL, which sounds correct, but Page View triggers fire on every visit to that page — direct navigation, link previews, page refreshes all trigger it. Conversion rates of 20–40% in Search campaigns are usually the symptom.
          </p>
        </Issue>

        <TriggerDiagram/>

        <div className="article-body">
          <p>
            <strong>Fix:</strong> In GTM, use a <strong>Form Submission trigger</strong> on the specific form, or a <strong>Custom Event trigger</strong> firing on a dataLayer event pushed by your form confirmation logic. For Shopify, check the current checkout setup before relying on GTM — the Google &amp; YouTube app or Customer Events approach is usually safer than legacy GTM snippets on checkout pages. Test in Preview Mode: submit once, confirm the trigger fires exactly once on submission.
          </p>
        </div>

        <Issue n={5} id="issue-5" title="Enhanced Conversions not enabled or misconfigured">
          <p>
            Standard browser-side conversion tracking misses a growing share of conversions to ad blockers, iOS ITP, and cookie consent restrictions. Enhanced Conversions recovers a portion by sending hashed customer data alongside the conversion signal, which Google matches to signed-in Google accounts.
          </p>
          <p>
            The common misconfiguration: the Google Ads Conversion Tag is set to <strong>Automatic</strong> user data collection, which scrapes email addresses from the DOM. It's unreliable — misses users who type slowly, fails on single-page apps, doesn't capture phone numbers. The correct approach is <strong>Code mode</strong>: push a structured <code>user_data</code> object to the dataLayer at the point of conversion, and read it via a Data Layer Variable.
          </p>
        </Issue>

        <CodeBlock caption="GTM dataLayer push · Enhanced Conversions (Code mode)">{`dataLayer.push({
  'event':     'conversion_form_submit',
  'user_data': {
    'email':        formEmail,        // raw — Google hashes it
    'phone_number': formPhone         // E.164: +447911123456
  }
});`}</CodeBlock>

        <div className="article-body">
          <p>
            <strong>Fix:</strong> Capture email and phone from the form at submission and push a structured <code>user_data</code> object to the dataLayer. Phone numbers must be E.164 (UK numbers starting with 07 become +447). After 7 days, check the Enhanced Conversions Diagnostics in Google Ads to confirm user-provided data is being received and match quality is healthy.
          </p>
        </div>

        <Issue n={6} id="issue-6" title="Consent Mode v2 silently blocking conversions">
          <p>
            The hardest issue to diagnose because there's no error. For advertisers in EEA/UK, Consent Mode v2 is now core to Google Ads measurement. Configured correctly, it signals consent state to Google tags so they can behave appropriately for each user. Configured incorrectly, remarketing and attribution signals can be restricted, conversion modelling degraded, and data blocked silently for users who haven't consented.
          </p>
          <p>
            The failure mode: the Consent Mode default state tag is missing, fires too late, or sets the wrong consent types. Tags that require <code>ad_storage</code> fire before consent is granted on page load, then the consent signal never updates to granted even after the user accepts. Google tags interpret this as a permanently denied state and suppress the conversion.
          </p>
        </Issue>

        <ConsentTimeline/>

        <div className="article-body">
          <p>
            <strong>Fix:</strong> Your Consent Mode default state tag must fire <strong>before any other Google tag</strong> on every page. Set it to fire on Consent Initialization, with <code>ad_storage</code> and <code>ad_user_data</code> denied by default. Your CMP must push a consent update to the dataLayer when the user accepts. Verify in Tag Assistant that consent state shows granted before the conversion tag fires.
          </p>
        </div>

        <Issue n={7} id="issue-7" title="Auto-tagging disabled">
          <p>
            Without auto-tagging, Google Ads doesn't append a GCLID parameter to landing page URLs. GCLID is how Google Ads connects an ad click to a subsequent conversion. Disable it and click-based attribution stops working entirely. Most often turned off accidentally after a URL rewrite, or by a developer who thought the parameters were tracking spam.
          </p>
          <p>
            <strong>Fix:</strong> Google Ads: <strong>Admin › Account settings › Auto-tagging</strong>. Toggle it on. If your website strips URL parameters (some CMSs do this), whitelist GCLID in your URL parameter handling, or move to server-side auto-tagging.
          </p>
        </Issue>

        <div className="article-body">
          <h2>What correct setup looks like in 2026</h2>
          <p>

          </p>
        </div>
