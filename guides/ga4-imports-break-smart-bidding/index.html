/* =============== ARTICLE BODY =============== */
function ArticleBody() {
  return (
    <section style={{ background: "#fff", padding: "8px 0 96px" }}>
      <div className="read-w">
        <div className="article-body">

          <h2>The problem in plain English</h2>
          <p>
            When you link GA4 to Google Ads and import the <strong>purchase</strong> event as a conversion action, Google Ads treats it as a primary signal &mdash; exactly the same weight it would give a native Google Ads conversion tag. That sounds fine. It isn&rsquo;t.
          </p>
          <p>
            GA4 conversions are <strong>modelled</strong>. Google reconstructs them from session data, consent state, and cross-device joining. The native Google Ads tag is <strong>observed</strong> &mdash; it fires on the actual thank-you page, in the actual user&rsquo;s browser, on the actual click. Two different things measuring two different events.
          </p>
          <p>
            Smart Bidding doesn&rsquo;t know the difference. It will train on whichever signal you mark Primary. If that&rsquo;s the modelled one, you&rsquo;re bidding on Google&rsquo;s best guess about what happened &mdash; sometimes inflated, sometimes deflated, never quite right.
          </p>

          <h2>What the data looks like</h2>
          <p>
            This is the version that&rsquo;s hard to catch. Cost-per-conversion looks fine. The bidding strategy stays in the green. CPA holds steady week-on-week.
          </p>
          <p>
            But ROAS softens. Impression share starts drifting down on your best campaigns. New customer mix shifts toward people who were going to buy anyway. The signal looks plausible enough that nobody investigates &mdash; and the longer it runs, the more Smart Bidding bakes the noise into its baseline.
          </p>
          <p>
            By the time someone notices the gap between what Google Ads reports and what actually hit the bank account, the model has been training on shaky ground for months.
          </p>

          <h2>Why it&rsquo;s so common</h2>
          <p>
            The default path makes the mistake for you. Most accounts get set up in this order:
          </p>
          <ul>
            <li>GA4 goes in first, usually by a developer or analytics person.</li>
            <li>Google Ads is linked to GA4 to pull audience and conversion data.</li>
            <li>The GA4 purchase event appears in Google Ads conversion settings as importable.</li>
            <li>Someone clicks Import. It defaults to Primary.</li>
          </ul>
          <p>
            Nobody designed it this way. It&rsquo;s the path of least resistance, and the UI doesn&rsquo;t flag the consequence. The native Google Ads tag &mdash; the one that should be Primary &mdash; either never gets implemented, or gets left as Secondary because there&rsquo;s already a Primary in place.
          </p>

          <h2>The fix</h2>
          <p>
            Ten minutes, two steps:
          </p>
          <ul>
            <li><strong>Demote the GA4 import to Secondary.</strong> Google Ads &rarr; Tools &rarr; Conversions &rarr; the GA4-imported action &rarr; Edit settings &rarr; set to Secondary. This keeps the data flowing for reporting without letting Smart Bidding train on it.</li>
            <li><strong>Set up a native Google Ads conversion tag</strong> via GTM, firing on the actual thank-you page or post-purchase event. Mark it Primary. Add Enhanced Conversions while you&rsquo;re in there &mdash; same tag, ten extra minutes, materially better attribution on iOS.</li>
          </ul>
          <p>
            Once both are in place, give the account 14 days. Smart Bidding will retrain on the observed signal. CPA reporting will look different &mdash; usually <em>worse</em> on paper, because the modelled signal was over-counting. ROAS, the thing you actually care about, will start to recover.
          </p>

          <h2>Check yours</h2>
          <p>
            If you&rsquo;re not sure which signal Smart Bidding is training on, the Google Ads Audit checks it directly. It reads your Conversions page, identifies which actions are set to Primary, and flags any GA4 imports sitting in that slot.
          </p>
          <p>
            <a href="/google-ads-audit">Run the Google Ads Audit &rarr;</a>
          </p>

        </div>

        <PullQuote/>
      </div>
    </section>
  );
}
