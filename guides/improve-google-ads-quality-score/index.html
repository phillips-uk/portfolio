      "name": "What is a good Quality Score in Google Ads?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Google considers 7–10 above average, 5–6 average, and 1–4 below average. A score of 7 or above generally means your ad and landing page are performing well relative to competitors showing for the same searches. That said, Quality Score is a diagnostic — chasing a 10 on every keyword is a distraction. Focus on the components showing Below average rather than the composite number."
      }
    },
    {
      "@type": "Question",
      "name": "Does Quality Score affect Shopping and Performance Max campaigns?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. The 1–10 Quality Score metric exists only for Search campaign keywords. Shopping and Performance Max campaigns have no keyword structure to score against, so the Quality Score column will be empty or unavailable for those campaign types. Quality signals still influence how Google serves ads in these campaigns, but they are not surfaced as a visible score."
      }
    },
    {
      "@type": "Question",
      "name": "How long does it take for Quality Score to improve?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Quality Score is based on impressions over the last 90 days, so changes take time to reflect. A significant ad copy improvement or landing page change may take 2–4 weeks to show meaningful movement in the score, depending on impression volume. High-volume keywords update faster than low-volume terms. Don't expect overnight changes — check week-over-week using the historical Quality Score column."
      }
    },
    {
      "@type": "Question",
      "name": "Can I have a low Quality Score and still perform well on ROAS or CPA?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, particularly in accounts running broad match with Smart Bidding. Smart Bidding adjusts bids in real time based on conversion signals — it can deprioritise auctions where quality signals are weak and still hit CPA or ROAS targets. A keyword may show QS 3 in the Keywords table while the campaign converts efficiently. Quality Score is most meaningful as a cost-efficiency indicator for exact and phrase match keywords where the QS calculation most accurately reflects auction reality."
      }
    },

      "@type": "Question",
      "name": "What is the difference between Quality Score and Ad Rank?",
      "acceptedAnswer": {
        "@type": "Answer",

      }
    }

function ArticleBody() {
  return (
    <section style={{ background: "#fff", padding: "8px 0 96px" }}>
      <div className="read-w">
        <div className="article-body">

          {/* Why it matters */}
          <h2>Why Quality Score affects what you pay, not just where you rank</h2>
          <p>
            Ad Rank determines your position in each auction. It is calculated from your bid, the quality of your ad and landing page, Ad Rank thresholds, competition, search context, and the expected impact of your assets. Quality is not a single number in that formula — it is a real-time assessment Google makes for every auction. The 1–10 Quality Score in your Keywords table is a diagnostic approximation of that quality signal, not the auction input itself.
          </p>
          <p>
            What the diagnostic tells you matters commercially. Google's second-price auction means your actual CPC is partly determined by the ratio of your quality to your competitors'. The simplified version: your cost is roughly the Ad Rank of the advertiser below you divided by your Quality Score. A keyword at QS 3 costs meaningfully more per click than the same keyword at QS 7 — to hold the same position — because your quality score is in the denominator of your cost calculation.
          </p>
          <p>
            <strong>Fix the quality first.</strong> Bidding up on a low-quality keyword makes it worse, not better.
          </p>
        </div>

        <AdRankDiagram/>

        <div className="article-body">
          <h2>The three components — what each one measures</h2>
          <p>
            Every Quality Score is built from three components, each rated Above average, Average, or Below average relative to other advertisers showing for the same searches over the last 90 days. A Below average rating on any component tells you something specific about where the problem is.
          </p>
        </div>

        <ComponentTable/>

        <div className="article-body">
          <h2>How to find your Quality Score in Google Ads</h2>
          <p>
            Quality Score is not visible by default. You need to add it to the Keywords table manually.
          </p>
          <p>
            Navigate to <strong>Campaigns &rsaquo; Keywords</strong>. Click the columns icon at the top right of the table, then select <strong>Modify columns for keywords</strong>. Under the Quality Score section, add:
          </p>
          <ul>
            <li><strong>Quality Score</strong> — the 1–10 composite</li>
            <li><strong>Exp. CTR</strong> — Expected CTR component rating</li>
            <li><strong>Ad Relevance</strong> — Ad Relevance component rating</li>
            <li><strong>Landing Page Exp.</strong> — Landing Page Experience component rating</li>
          </ul>
          <p>
            Once visible, sort by Quality Score ascending. Work through keywords showing Below average on any component — that is where the fixes are.
          </p>
          <p>
            A dash (<code>—</code>) in the Quality Score column means there is insufficient exact-match impression data to calculate a score. This is normal for low-volume or new keywords. You cannot directly improve a dash — only time and accumulated impressions will generate a score.
          </p>
        </div>

        {/* Component 1 */}
        <Issue n={1} id="component-1" title="Expected CTR is Below average">
          <p>
            Expected CTR is Google's prediction of how likely your ad is to be clicked when shown for a specific search query. It is benchmarked against other advertisers showing for the same exact queries. Below average means Google expects your ad to receive fewer clicks than competitors — not that your historical CTR is low, but that it is predicted to be.
          </p>
          <p>
            The most direct lever is your ad copy. Headlines that reflect the searched query raise click prediction because they signal relevance to the user. Generic headlines — "Marketing Agency London", "Quality Products Online" — match no specific intent and score poorly against competitors who have written to the exact query.
          </p>
          <p>
            <strong>Fix:</strong> Rewrite Headline 1 in your Responsive Search Ads to directly reflect the query intent. Use a call-to-action that matches what the searcher wants to do ("Get a Quote" for service intent, "Shop Now" for transactional, "See How It Works" for informational). Add negative keywords to exclude queries where a click is unlikely — every low-intent impression that doesn't get clicked is dragging expected CTR down. Run regular search term audits and exclude irrelevant match expansions before they accumulate.
          </p>
        </Issue>

        <CTRDiagram/>

        {/* Component 2 */}
        <Issue n={2} id="component-2" title="Ad Relevance is Below average">
          <p>
            Ad Relevance measures how closely your ad matches the intent behind the search query. It scores poorly when there is a gap between what someone searched for and what your ad says. The most common cause is ad group structure: too many keywords with different intents forced into the same group, served by the same set of ads.
          </p>
          <p>
            If your ad group contains "buy running shoes", "are running shoes good for hiking", and "running shoe care tips", no single set of ads can be highly relevant to all three. The commercial buyer, the curious researcher, and the existing owner are different audiences with different intents.
          </p>
          <p>
            <strong>Fix:</strong> Group keywords with near-identical intent into the same ad group — 5 to 15 closely related terms is a workable target. The headline in your RSA should address the intent shared by all keywords in that group. For high-value exact match keywords with significant impression volume and competitive CPCs, a dedicated ad group gives you full control over the message. The underlying principle is that tight groupings make it possible to write genuinely relevant ads; loose groupings make it structurally impossible.
          </p>
        </Issue>

        <AdGroupDiagram/>

        {/* Component 3 */}
        <Issue n={3} id="component-3" title="Landing Page Experience is Below average">
          <p>
            Landing Page Experience reflects how relevant and useful your landing page is to people who click your ad. Google's crawlers assess the page for usefulness of content, ease of navigation, and whether it delivers on what the ad promised. A poor rating here almost always means one of three things: the page is too generic for the query, it loads too slowly, or it performs poorly on mobile.
          </p>
          <p>
            Sending paid traffic to a homepage is the most common structural mistake. The homepage serves too many audiences and too many goals. The user who clicked an ad for "emergency boiler repair London" does not want to navigate through a services menu. A dedicated landing page with a single message and a single conversion action is the correct structure — and it performs better on this component because it unambiguously matches the ad.
          </p>
          <p>
            <strong>Fix:</strong> Match the landing page to the specific ad. The primary keyword should appear in the H1. The offer or service promised in the ad should be the first thing visible on the page. Use PageSpeed Insights (<code>pagespeed.web.dev</code>) to check mobile performance — Google assesses mobile and desktop separately, so a fast desktop page does not compensate for a slow mobile one. For lead generation pages, put the form or call-to-action above the fold on a 375px screen. The page must load quickly, deliver on the ad's promise, and make the next action obvious.
          </p>
        </Issue>

        <LandingPageDiagram/>

        <div className="article-body">
          <h2>The six mistakes that keep Quality Score low</h2>
          <p>
            Most Quality Score problems are structural — they are baked into how the account was set up, not just how the ads were written. Fixing individual keywords one at a time is less effective than identifying which of these structural issues applies and fixing it at the root.
          </p>
        </div>

        <MistakesGrid/>

        <Update2026/>

        <div className="article-body">

        </div>

}

        <CategoryPill cat={guide.cat} size="sm"/>
        <span style={{ fontSize: 11, color: "#6B6B6B", letterSpacing: "-0.005em" }}>{guide.time}</span>
      </div>
      <h3 style={{ fontSize: 20, fontWeight: 700, letterSpacing: "-0.015em", lineHeight: 1.25, color: "#1A1A1A", margin: "0 0 12px", textWrap: "pretty" }}>{guide.title}</h3>
      <p style={{ fontSize: 14, lineHeight: 1.55, color: "#6B6B6B", margin: "0 0 24px" }}>{guide.desc}</p>
      <span style={{
        marginTop: "auto", display: "inline-flex", alignItems: "center", gap: 6,
        fontSize: 13, fontWeight: 600, color: "#985830", letterSpacing: "-0.005em",
      }}>
        Read guide
        <span style={{ display: "inline-block", transform: h ? "translateX(3px)" : "translateX(0)", transition: "transform 200ms cubic-bezier(0.2,0,0,1)" }}>→</span>
      </span>
    </a>
  );
}

/* =============== END CTA (DARK) =============== */

  return (
    <section style={{ background: "linear-gradient(135deg, #1A1A1A 0%, #241408 100%)", padding: "96px 32px" }}>
      <div style={{ maxWidth: 880, margin: "0 auto", textAlign: "center" }}>
        <Eyebrow color="#B87040">Ready to check yours?</Eyebrow>
        <h2 style={{
          fontSize: "clamp(36px, 4.6vw, 52px)", fontWeight: 700,
          letterSpacing: "-0.025em", lineHeight: 1.06, color: "#fff",
          margin: "20px 0 32px",
        }}>
          Run the audit. <em style={{ fontStyle: "italic", color: "#985830" }}>See what's actually going on.</em>
        </h2>
        <div style={{ display: "flex", gap: 14, justifyContent: "center", flexWrap: "wrap" }}>
          <a href="/google-ads-audit" style={ctaButtonStyle(true)}>Run the Google Ads Audit →</a>
          <a href="/landing-page-audit" style={ctaButtonStyle(false)}>Run the Landing Page Audit →</a>
        </div>
        <div style={{ marginTop: 32, fontSize: 13, color: "rgba(255,255,255,0.5)" }}>
          Free · Read-only · No agency pitch
        </div>
      </div>
    </section>
  );
}

function ctaButtonStyle(filled) {
  return {
    display: "inline-flex", alignItems: "center", justifyContent: "center",
    padding: "16px 32px", fontSize: 15, fontWeight: 600,
    color: "#fff",
    background: filled ? "#985830" : "transparent",
    border: filled ? "1.5px solid #985830" : "1.5px solid rgba(255,255,255,0.3)",
    borderRadius: 4, textDecoration: "none", letterSpacing: "-0.005em",
  };
}

/* =============== FOOTER =============== */
function Footer() {
  return (
    <footer style={{ background: "linear-gradient(135deg, #1A1A1A 0%, #241408 100%)", padding: "28px 32px" }}>
      <div style={{
        maxWidth: 1200, margin: "0 auto",
        display: "flex", justifyContent: "space-between", alignItems: "center",
        flexWrap: "wrap", gap: 12,
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 16, fontSize: 12, color: "rgba(255,255,255,0.4)" }}>
          <span style={{ fontSize: 16, fontWeight: 700, color: "#fff", letterSpacing: "-0.01em" }}>
            Phillips<span style={{ color: "#985830" }}>.</span>
          </span>
          <span>© 2026 Lewis Phillips · phillips-uk.com</span>
        </div>
      </div>
    </footer>
  );
}

/* =============== APP =============== */
function App() {
  return (
    <div data-screen-label="02 Improve Quality Score">
      <Nav active="guides"/>
      <ArticleHeader/>
      <ArticleBody/>
      <Related/>
      <EndCta/>
      <Footer/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
