<script type="text/babel">


/* =============== SCORE COLOR MAP =============== */
function scoreColor(n) {
  if (n >= 7) return { fg: "#2D6A4F", bg: "#E1EFE6", border: "#BFD9C8", label: "Strong" };
  if (n >= 5) return { fg: "#985830", bg: "#F5EBD9", border: "#E8D8C4", label: "Average" };
  return { fg: "#C0392B", bg: "#F8E0DC", border: "#EBC4B5", label: "Weak" };
}

const DIM_KEYS = ["hook", "hierarchy", "copy", "brand", "fatigue", "offer", "emotion"];
const DIM_LABELS = {
  hook:      "Hook quality",
  hierarchy: "Visual hierarchy",
  copy:      "Copy clarity",
  brand:     "Brand consistency",
  fatigue:   "Originality & fatigue",
  offer:     "Offer clarity",
  emotion:   "Emotional resonance"
};

/* =============== DATA =============== */
const CREATIVES = [
{
  rank: 1,
  file: "summer_prospecting_ugc-hero.mp4",
  sub: "opening frame",
  type: "video",
  composite: 7.1,
  scores: { hook: 8, hierarchy: 7, copy: 7, brand: 6, fatigue: 8, offer: 7, emotion: 7 },
  dims: {
    hook:      { rationale: "Close-up motion in the opening frame creates an immediate pattern interrupt. The on-screen text caption loads within the first second, giving the viewer a clear reason to stay.", weak: null, impact: null },
    hierarchy: { rationale: "Subject occupies the upper two-thirds of the frame with negative space used cleanly below. Reading order is intuitive.", weak: "Background element in bottom-right competes with the subject for attention.", impact: "quick_win" },
    copy:      { rationale: "Headline caption is legible and specific. The value proposition is clear in under two seconds. No explicit CTA in this opening frame — acceptable here.", weak: null, impact: null },
    brand:     { rationale: "Amber overlay text matches product palette but no logo or consistent brand lockup visible in this frame.", weak: "No logo or brand lockup. This creative could belong to any brand.", impact: "high" },
    fatigue:   { rationale: "Format avoids common fatigued treatments. No plain white background, no static talking-head variant. The motion-first approach is less saturated than most UGC in this category.", weak: null, impact: null },
    offer:     { rationale: "Opening frame; no offer is expected here — the hook frame's job is to capture attention, not sell. Offer context is acceptable later in the video.", weak: null, impact: null },
    emotion:   { rationale: "The motion close-up and caption sequence creates genuine curiosity pull — the viewer wants to know what's being said and what happens next.", weak: null, impact: null }
  },
  notes: "The opening frame lands a strong pattern interrupt with close-up motion and an on-screen text hook. Visual hierarchy is clean. The main gap is brand anchoring.",
  priority: "Add a subtle branded element to the bottom-left corner without obscuring the hook."
},
{
  rank: 2,
  file: "summer_prospecting_static-offer.jpg",
  sub: "static",
  type: "image",
  composite: 6.4,
  scores: { hook: 6, hierarchy: 7, copy: 8, brand: 7, fatigue: 5, offer: 8, emotion: 4 },
  dims: {
    hook:      { rationale: "Product is clearly visible and the offer is readable, but there is no pattern interrupt to stop a scrolling thumb. Static format with no motion, contrast surprise, or emotional trigger.", weak: "Static product shot with no scroll-stopping element. Likely to be skipped on mobile feed.", impact: "high" },
    hierarchy: { rationale: "Product is the clear focal point. Headline and price point sit naturally below. Clean layout with adequate white space. No competing visual elements.", weak: null, impact: null },
    copy:      { rationale: "Offer is specific and immediately legible. Discount percentage and end date both visible. No ambiguity about what is being sold or what the deal is.", weak: null, impact: null },
    brand:     { rationale: "Brand colours applied consistently. Logo positioned correctly. Font choice matches the brand system. Minor inconsistency in the CTA button colour weight.", weak: null, impact: null },
    fatigue:   { rationale: "Plain white background product shot is one of the most overused formats in paid social. The format has been saturated for two-plus years across e-commerce categories.", weak: "Plain white background product format. High fatigue risk — audiences have learned to skip this format.", impact: "high" },
    offer:     { rationale: "Discount percentage and end date are both visible and immediately legible — the specific offer is unambiguous.", weak: null, impact: null },
    emotion:   { rationale: "The creative communicates the offer logically but creates no emotional pull — it reads as a price tag, not a desire. Purely transactional.", weak: "No emotional hook — purely transactional. Viewers will compare price without engagement.", impact: "high" }
  },
  notes: "Strong on clarity and brand, weak on attention capture and emotional engagement. The copy does its job but the format won't stop the scroll and the offer-first framing generates no desire.",
  priority: "Test a lifestyle or contextual background version of this offer against the plain white to measure CTR delta and add a desire-based headline alongside the price."
},
{
  rank: 3,
  file: "retargeting_abandoned-cart_v2.jpg",
  sub: "static",
  type: "image",
  composite: 5.3,
  scores: { hook: 5, hierarchy: 6, copy: 7, brand: 6, fatigue: 4, offer: 5, emotion: 4 },
  dims: {
    hook:      { rationale: "Retargeting context means the audience already knows the product, which reduces the hook burden slightly. Even so, the creative doesn't leverage that recognition with a specific reengagement angle.", weak: "No urgency or reengagement hook. Retargeting creatives need a specific reason to return, not just a product reminder.", impact: "high" },
    hierarchy: { rationale: "Product is identifiable but the composition has two competing focal points: the product image and a text overlay of equal visual weight.", weak: "Two competing focal points at equal weight. The eye doesn't know where to go first.", impact: "high" },
    copy:      { rationale: "Reminder message is clear. 'You left something behind' framing is specific and relevant to an abandoned-cart audience. Lands in under two seconds.", weak: null, impact: null },
    brand:     { rationale: "Brand colours present but the text weight on the overlay is lighter than the brand system standard, creating a visual inconsistency.", weak: "Text weight inconsistency with brand system. Feels off-brand at a glance.", impact: "quick_win" },
    fatigue:   { rationale: "Generic 'you left something' format with product image and text overlay is among the most replicated retargeting formats. No differentiating visual treatment.", weak: "Overused retargeting format with no visual differentiation. Audiences in this segment will have seen near-identical creatives from competitors.", impact: "high" },
    offer:     { rationale: "The creative identifies the product but includes no incentive, discount, or urgency — the offer is just 'come back', which gives the audience no reason to act now.", weak: "No incentive or urgency offer. Retargeting audiences need a reason to act, not just a reminder.", impact: "high" },
    emotion:   { rationale: "The retargeting angle is understated and generates no urgency or emotional pull — the creative fails to create the 'I should do something about this' feeling needed in this funnel stage.", weak: "No urgency or emotional pressure for a retargeting audience at this stage of the funnel.", impact: "high" }
  },
  notes: "Copy angle is right for a retargeting audience but the execution is generic. Fatigue risk is high, there's no offer incentive, and the emotional temperature is too low for a conversion-stage creative.",
  priority: "Add a time-limited incentive and test a social-proof variant (reviews, 'X people bought this today') to introduce urgency and emotional validation."
},
{
  rank: 4,
  file: "retargeting_generic-cta.jpg",
  sub: "static",
  type: "image",
  composite: 3.3,
  scores: { hook: 3, hierarchy: 4, copy: 5, brand: 4, fatigue: 3, offer: 2, emotion: 2 },
  dims: {
    hook:      { rationale: "No visual trigger, no text hook, no motion. The creative opens on a product shot with a logo and a CTA button. There is nothing to stop a scroll.", weak: "No hook element of any kind. The creative assumes the audience will stop voluntarily.", impact: "critical" },
    hierarchy: { rationale: "Logo, product, headline, and CTA button all compete at similar visual weights. No single element dominates. Reading order is unclear.", weak: "Four elements at equal weight with no clear visual priority. The reader's eye has nowhere to land.", impact: "critical" },
    copy:      { rationale: "Product name is legible but the headline doesn't state a benefit or offer. The CTA is 'Shop Now' with no supporting context.", weak: "'Shop Now' CTA with no offer, benefit, or urgency. Gives the audience no reason to act now rather than later.", impact: "critical" },
    brand:     { rationale: "Brand colours present but the layout doesn't follow the brand's established visual system. Feels like a template rather than a brand asset.", weak: "Template-style layout with no branded personality. Indistinguishable from competitor creative at a glance.", impact: "high" },
    fatigue:   { rationale: "Logo-first layout, plain background, generic 'Shop Now' CTA. Hits three of the most common ad fatigue indicators simultaneously.", weak: "Logo-first layout + plain background + generic CTA. Three critical fatigue signals in one creative.", impact: "critical" },
    offer:     { rationale: "'Shop Now' with no accompanying offer, benefit, or incentive. The viewer has no reason to act — there is nothing to shop for in the creative.", weak: "Completely absent offer — no price, no benefit, no incentive visible anywhere.", impact: "critical" },
    emotion:   { rationale: "The creative is entirely emotionally inert — no feeling, no desire, no curiosity is generated. It expects the viewer to act without any emotional motivation.", weak: "Zero emotional engagement — no reason for the viewer to feel anything or want to act.", impact: "critical" }
  },
  notes: "No hook, no visual hierarchy, no specific offer, no emotional engagement. Built around brand visibility rather than performance. For paid social, where the audience didn't choose to see the ad, every element needs to earn its place.",
  priority: "Complete rebuild starting from the hook. The brand assets are present — the problem is how they're deployed."
}];


/* =============== BUTTONS =============== */
function BtnFilled({ children, onClick, large, href }) {
  const [h, setH] = React.useState(false);
  const C = href ? "a" : "button";
  return (
    <C onClick={onClick} href={href} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
    style={{
      background: h ? "#7A3F1F" : "#985830", color: "#fff", border: 0,
      padding: large ? "16px 32px" : "14px 30px",
      fontSize: large ? 15 : 14, fontWeight: 600,
      borderRadius: 4, cursor: "pointer", fontFamily: "inherit",
      transition: "background 150ms cubic-bezier(0.2,0,0,1)",
      letterSpacing: "-0.005em",
      textDecoration: "none",
      display: "inline-flex", alignItems: "center", gap: 6
    }}>{children}</C>);

}

function BtnOutline({ children, onClick, href }) {
  const [h, setH] = React.useState(false);
  return (
    <a href={href} onClick={onClick} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
    style={{
      background: h ? "#985830" : "transparent",
      color: h ? "#fff" : "#985830",
      border: "1.5px solid #985830",
      padding: "10px 18px",
      fontSize: 13, fontWeight: 600,
      borderRadius: 4, cursor: "pointer", fontFamily: "inherit",
      textDecoration: "none",
      display: "inline-flex", alignItems: "center", gap: 8,
      transition: "background 150ms cubic-bezier(0.2,0,0,1), color 150ms cubic-bezier(0.2,0,0,1)",
      letterSpacing: "-0.005em"
    }}>{children}</a>);

}

function BtnFilledSmall({ children, onClick }) {
  const [h, setH] = React.useState(false);
  return (
    <button onClick={onClick} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
    style={{
      background: h ? "#7A3F1F" : "#985830", color: "#fff", border: 0,
      padding: "10px 20px", fontSize: 13, fontWeight: 600,
      borderRadius: 4, cursor: "pointer", fontFamily: "inherit",
      transition: "background 150ms cubic-bezier(0.2,0,0,1)"
    }}>{children}</button>);

}

/* =============== NAV =============== */
function Nav() {
  const linkStyle = (active) => ({
    fontSize: 14, fontWeight: 500,
    color: active ? "#1A1A1A" : "#6B6B6B",
    textDecoration: "none",
    transition: "color 150ms cubic-bezier(0.2,0,0,1)"
  });
  return (
    <header style={{
      position: "sticky", top: 0, zIndex: 50,
      background: "rgba(255,255,255,0.96)",
      backdropFilter: "saturate(120%)",
      borderBottom: "1px solid #E8D8C4", height: 64
    }}>
      <div style={{
        maxWidth: 1200, margin: "0 auto", height: "100%",
        display: "flex", alignItems: "center", justifyContent: "space-between",
        padding: "0 32px"
      }}>
        <a href="/" style={{ textDecoration: "none", fontSize: 24, fontWeight: 700, letterSpacing: "-0.01em", color: "#1A1A1A", lineHeight: 1 }}>
          Phillips<span style={{ color: "#985830" }}>.</span>
        </a>
        <nav style={{ display: "flex", alignItems: "center", gap: 28 }}>
          <a href="/landing-page-audit" style={linkStyle(false)}>Landing Page Audit</a>
          <a href="/google-ads-audit" style={linkStyle(false)}>Google Ads Audit</a>
          <a href="/creative-analysis" style={linkStyle(true)}>Creative Scoring</a>
          <a href="/guides/" style={linkStyle(false)}>Guides</a>
          <BtnFilledSmall onClick={() => window.location.href = "/#contact"}>Get in touch</BtnFilledSmall>
        </nav>
      </div>
    </header>);

}

/* =============== EYEBROW =============== */
function Eyebrow({ children, color = "#985830" }) {
  return (
    <span style={{
      display: "inline-block",
      fontSize: 11, fontWeight: 700, letterSpacing: "0.12em",
      textTransform: "uppercase", color
    }}>{children}</span>);

}

/* =============== REPORT HEADER =============== */
function ReportHeader() {
  const avg = (CREATIVES.reduce((s, c) => s + c.composite, 0) / CREATIVES.length).toFixed(1);
  const weakCount = CREATIVES.reduce((n, c) =>
  n + DIM_KEYS.filter((k) => c.dims[k].weak).length, 0);

  return (
    <section style={{
      background: "linear-gradient(180deg, #FFFFFF 0%, #FDF6EE 100%)",
      padding: "44px 0 64px",
      borderBottom: "1px solid #E8D8C4"
    }}>
      <div className="page-w">
        {/* Top meta bar */}
        <div style={{
          display: "flex", justifyContent: "space-between", alignItems: "center",
          flexWrap: "wrap", gap: 16, marginBottom: 36
        }}>
          <a href="/creative-analysis" style={{
            display: "inline-flex", alignItems: "center", gap: 6,
            fontSize: 13, fontWeight: 600, color: "#985830",
            textDecoration: "none"
          }}>
            ← Back to Creative Scoring
          </a>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <BtnOutline>Download .md</BtnOutline>
            <BtnFilledSmall>Run on your creatives</BtnFilledSmall>
          </div>
        </div>

        {/* Hero header */}
        <div style={{ maxWidth: 880, marginBottom: 40 }}>
          <Eyebrow>Example report</Eyebrow>
          <h1 style={{
            fontSize: "clamp(40px, 5.4vw, 64px)", fontWeight: 700,
            letterSpacing: "-0.03em", lineHeight: 1.04,
            color: "#1A1A1A", margin: "16px 0 22px",
            textWrap: "balance"
          }}>
            Four creatives. <em style={{ fontStyle: "italic", color: "#985830" }}>Scored and ranked.</em>
          </h1>
          <p style={{
            fontSize: 17, lineHeight: 1.6, color: "#1A1A1A",
            margin: 0, maxWidth: 700
          }}>
            This is what a report looks like. Four sample ad creatives, each scored across seven dimensions with impact-tiered weak signals flagged on any dimension scoring 6 or below.
          </p>
        </div>

        {/* Stats strip */}
        <div className="demo-stats-strip" style={{
          display: "grid", gridTemplateColumns: "repeat(4, 1fr)",
          gap: 0, background: "#fff",
          border: "1px solid #E8D8C4", borderRadius: 6,
          overflow: "hidden",
          boxShadow: "0 2px 8px rgba(152, 88, 48, 0.06)"
        }}>
          <Stat label="Creatives scored" v={CREATIVES.length} />
          <Stat label="Composite average" v={avg} unit="/ 10" />
          <Stat label="Top score" v={CREATIVES[0].composite.toFixed(1)} unit="/ 10" />
          <Stat label="Weak signals flagged" v={weakCount} />
        </div>
      </div>
    </section>);

}

function Stat({ label, v, unit }) {
  return (
    <div style={{
      padding: "22px 26px",
      borderLeft: "1px solid #F0E5D2"
    }}>
      <div style={{
        fontSize: 11, fontWeight: 700, letterSpacing: "0.10em",
        textTransform: "uppercase", color: "#6B6B6B", marginBottom: 8
      }}>{label}</div>
      <div style={{
        fontSize: 30, fontWeight: 700, color: "#1A1A1A",
        letterSpacing: "-0.025em", lineHeight: 1,
        fontVariantNumeric: "tabular-nums",
        display: "flex", alignItems: "baseline", gap: 6
      }}>
        {v}
        {unit && <span style={{ fontSize: 14, color: "#6B6B6B", fontWeight: 500 }}>{unit}</span>}
      </div>
    </div>);

}

/* =============== RANKED SUMMARY =============== */
function RankedSummary() {
  return (
    <section className="sec-white" style={{ paddingTop: 64, paddingBottom: 56, backgroundColor: "rgb(253, 246, 238)" }}>
      <div className="page-w">
        <div style={{
          borderLeft: "3px solid #985830", paddingLeft: 24,
          marginBottom: 28
        }}>
          <Eyebrow>Ranked summary</Eyebrow>
          <h2 style={{
            fontSize: "clamp(28px, 3.2vw, 36px)", fontWeight: 700,
            letterSpacing: "-0.02em", lineHeight: 1.1,
            color: "#1A1A1A", margin: "10px 0 0"
          }}>
            Composite + per-dimension scores.
          </h2>
        </div>

        <div className="demo-ranked-wrap" style={{
          background: "#fff", border: "1px solid #E8D8C4", borderRadius: 6,
          overflow: "hidden",
          boxShadow: "0 2px 8px rgba(152, 88, 48, 0.06)"
        }}>
          {/* Header */}
          <div className="demo-row-hdr" style={{
            display: "grid",
            gridTemplateColumns: "44px 2fr 1.2fr repeat(7, 0.7fr)",
            background: "#FDF6EE",
            borderBottom: "1px solid #E8D8C4",
            padding: "14px 24px",
            fontSize: 11, fontWeight: 700, letterSpacing: "0.10em",
            textTransform: "uppercase", color: "#6B6B6B",
            gap: 16
          }}>
            <span>#</span>
            <span>Creative</span>
            <span>Composite</span>
            <span>Hook</span>
            <span>Hier.</span>
            <span>Copy</span>
            <span>Brand</span>
            <span>Fatigue</span>
            <span>Offer</span>
            <span>Emot.</span>
          </div>

          {CREATIVES.map((c, i) =>
          <SummaryRow key={i} c={c} last={i === CREATIVES.length - 1} />
          )}
        </div>
      </div>
    </section>);

}

function SummaryRow({ c, last }) {
  const compColor = scoreColor(c.composite);
  return (
    <a href={`#creative-${c.rank}`} className="demo-row" style={{
      display: "grid",
      gridTemplateColumns: "44px 2fr 1.2fr repeat(7, 0.7fr)",
      padding: "18px 24px",
      borderBottom: last ? "none" : "1px solid #F0E5D2",
      alignItems: "center", gap: 16,
      textDecoration: "none", color: "inherit",
      transition: "background 150ms cubic-bezier(0.2,0,0,1)"
    }}
    onMouseEnter={(e) => e.currentTarget.style.background = "#FDF6EE"}
    onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>
      <span style={{
        fontSize: 14, fontWeight: 700, color: "#985830",
        letterSpacing: "-0.005em",
        fontVariantNumeric: "tabular-nums"
      }}>#{c.rank}</span>

      <div style={{ display: "flex", alignItems: "center", gap: 12, minWidth: 0 }}>
        <span style={{
          width: 28, height: 28, borderRadius: 4,
          background: "#FDF6EE", border: "1px solid #E8D8C4",
          color: "#985830", flexShrink: 0,
          display: "inline-flex", alignItems: "center", justifyContent: "center",
          fontSize: 10, fontWeight: 700, letterSpacing: "0.04em"
        }}>{c.type === "video" ? "VID" : "IMG"}</span>
        <div style={{ minWidth: 0 }}>
          <div style={{
            fontSize: 14, fontWeight: 600, color: "#1A1A1A",
            letterSpacing: "-0.005em",
            whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
            fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace"
          }}>{c.file}</div>
          {c.sub &&
          <div style={{ fontSize: 11, color: "#6B6B6B", marginTop: 2 }}>{c.sub}</div>
          }
        </div>
      </div>

      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
        <span style={{
          fontSize: 18, fontWeight: 700, color: compColor.fg,
          letterSpacing: "-0.01em", fontVariantNumeric: "tabular-nums",
          minWidth: 36
        }}>{c.composite.toFixed(1)}</span>
        <div style={{ flex: 1, minWidth: 60, maxWidth: 120 }}>
          <ScoreBar value={c.composite} max={10} height={6} />
        </div>
      </div>

      {DIM_KEYS.map((k) => {
        const sc = scoreColor(c.scores[k]);
        return (
          <span key={k} style={{
            display: "inline-flex", alignItems: "center", justifyContent: "center",
            width: 32, height: 28,
            background: sc.bg, color: sc.fg,
            border: `1px solid ${sc.border}`,
            borderRadius: 4,
            fontSize: 13, fontWeight: 700,
            fontVariantNumeric: "tabular-nums"
          }}>{c.scores[k]}</span>);

      })}
    </a>);

}

function ScoreBar({ value, max = 10, height = 8 }) {
  const pct = Math.max(0, Math.min(100, value / max * 100));
  const c = scoreColor(value);
  return (
    <div style={{
      width: "100%", height, background: "#E8D8C4", borderRadius: 999,
      overflow: "hidden"
    }}>
      <div style={{
        width: `${pct}%`, height: "100%",
        background: c.fg, borderRadius: 999,
        transition: "width 400ms cubic-bezier(0.2,0,0,1)"
      }} />
    </div>);

}

/* =============== IMPACT BADGE =============== */
const IMPACT_STYLES = {
  critical:  { bg: "#FFEBEE", border: "#EF9A9A", color: "#B71C1C", label: "CRITICAL" },
  high:      { bg: "#FFF3E0", border: "#FF9800", color: "#E65100", label: "HIGH" },
  quick_win: { bg: "#E8F4FD", border: "#90CAF9", color: "#1565C0", label: "QUICK WIN" }
};
function ImpactBadge({ impact }) {
  const s = IMPACT_STYLES[impact] || IMPACT_STYLES.high;
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", gap: 5,
      background: s.bg, border: `1px solid ${s.border}`, color: s.color,
      padding: "2px 8px", borderRadius: 4,
      fontSize: 10, fontWeight: 700, letterSpacing: "0.06em",
      lineHeight: 1.5, whiteSpace: "nowrap", flexShrink: 0
    }}>
      {s.label}
    </span>);
}

/* =============== BREAKDOWNS =============== */
function Breakdowns() {
  return (
    <section className="sec-cream" style={{ paddingTop: 64, backgroundColor: "rgb(255, 255, 254)" }}>
      <div className="page-w">
        <div style={{
          borderLeft: "3px solid #985830", paddingLeft: 24,
          marginBottom: 36, maxWidth: 820
        }}>
          <Eyebrow>Creative breakdowns</Eyebrow>
          <h2 style={{
            fontSize: "clamp(28px, 3.2vw, 36px)", fontWeight: 700,
            letterSpacing: "-0.02em", lineHeight: 1.1,
            color: "#1A1A1A", margin: "10px 0 14px"
          }}>
            What's working, what isn't, what to do about it.
          </h2>
          <p style={{ fontSize: 15, lineHeight: 1.6, color: "#6B6B6B", margin: 0, maxWidth: 680 }}>
            Each creative gets a per-dimension rationale, impact-tiered weak signals flagged on any score of 6 or below (Critical / High / Quick Win), and a priority fix.
          </p>
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>
          {CREATIVES.map((c) => <BreakdownCard key={c.rank} c={c} />)}
        </div>
      </div>
    </section>);

}

function BreakdownCard({ c }) {
  const compColor = scoreColor(c.composite);
  return (
    <article id={`creative-${c.rank}`} style={{
      background: "#fff", border: "1px solid #E8D8C4", borderRadius: 8,
      padding: "32px 36px 36px",
      boxShadow: "0 2px 8px rgba(152, 88, 48, 0.08)",
      scrollMarginTop: 88
    }}>

      <div style={{
        display: "grid",
        gridTemplateColumns: "1fr auto",
        gap: 24, alignItems: "start",
        paddingBottom: 24,
        borderBottom: "1px solid #F0E5D2",
        marginBottom: 24
      }}>
        <div style={{ minWidth: 0 }}>
          <div style={{
            display: "flex", alignItems: "center", gap: 10, marginBottom: 12
          }}>
            <span style={{
              fontSize: 14, fontWeight: 700, color: "#985830",
              letterSpacing: "-0.005em",
              fontVariantNumeric: "tabular-nums"
            }}>#{c.rank}</span>
            <span style={{
              width: 28, height: 28, borderRadius: 4,
              background: "#FDF6EE", border: "1px solid #E8D8C4",

            {c.sub &&
            <span style={{

              textTransform: "uppercase", fontWeight: 600
            }}>{c.sub}</span>
            }
          </div>
          <h3 style={{
            fontSize: 22, fontWeight: 700, color: "#1A1A1A",
            letterSpacing: "-0.015em", lineHeight: 1.25,

            fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",
            wordBreak: "break-all"
          }}>{c.file}</h3>
        </div>

        <CompositeChip composite={c.composite} color={compColor} />
      </div>

      {/* Per-dimension table */}
      <div className="demo-dim-wrap" style={{
        border: "1px solid #E8D8C4", borderRadius: 6, overflow: "hidden",
        marginBottom: 24
      }}>
        <div className="demo-dim-hdr" style={{
          display: "grid",
          gridTemplateColumns: "180px 96px 1fr",
          background: "#FDF6EE",
          borderBottom: "1px solid #E8D8C4",
          padding: "12px 20px",
          fontSize: 11, fontWeight: 700, letterSpacing: "0.10em",
          textTransform: "uppercase", color: "#6B6B6B",
          gap: 18
        }}>
          <span>Dimension</span>

          <span>Rationale</span>
        </div>

        {DIM_KEYS.map((k, i) =>
        <DimRow key={k} k={k} dim={c.dims[k]} score={c.scores[k]} last={i === DIM_KEYS.length - 1} />
        )}
      </div>

      {/* Overall + priority */}
      <div className="demo-card-bottom" style={{
        display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16
      }}>
        <div style={{
          background: "#FDF6EE", border: "1px solid #E8D8C4", borderRadius: 6,
          padding: "20px 22px"
        }}>
          <Eyebrow>Overall notes</Eyebrow>
          <p style={{
            fontSize: 14, lineHeight: 1.6, color: "#1A1A1A",
            margin: "10px 0 0"
          }}>{c.notes}</p>
        </div>
        <div style={{
          background: "#fff",
          border: "1px solid #E8D8C4", borderLeft: "3px solid #985830",
          borderRadius: "0 6px 6px 0",
          padding: "20px 22px"
        }}>
          <Eyebrow>Priority fix</Eyebrow>
          <p style={{
            fontSize: 14, lineHeight: 1.6, color: "#1A1A1A",
            margin: "10px 0 0", fontWeight: 500
          }}>{c.priority}</p>
        </div>
      </div>
    </article>);

}

function CompositeChip({ composite, color }) {
  return (
    <div style={{
      background: color.bg, border: `1px solid ${color.border}`,
      borderRadius: 6, padding: "12px 20px",
      textAlign: "right", minWidth: 140

      <div style={{
        fontSize: 10, fontWeight: 700, letterSpacing: "0.10em",
        textTransform: "uppercase", color: color.fg, marginBottom: 4, opacity: 0.85

        fontSize: 28, fontWeight: 700, color: color.fg,

}

function DimRow({ k, dim, score, last }) {
  const sc = scoreColor(score);
  return (
    <div className="demo-dim-row" style={{
      display: "grid",
      gridTemplateColumns: "180px 96px 1fr",

      borderBottom: last ? "none" : "1px solid #F0E5D2",

    }}>
      <div style={{
        fontSize: 14, fontWeight: 600, color: "#1A1A1A",
        letterSpacing: "-0.005em", paddingTop: 4
      }}>{DIM_LABELS[k]}</div>

      <div style={{ paddingTop: 2 }}>
        <div style={{
          display: "inline-flex", alignItems: "center", gap: 8

          <span style={{
            fontSize: 18, fontWeight: 700, color: sc.fg,
            letterSpacing: "-0.01em",

        </div>
        <div style={{ marginTop: 6, width: 70 }}>

        <div style={{
          marginTop: 10,
          background: dim.impact === "critical" ? "#FFEBEE" : dim.impact === "quick_win" ? "#E8F4FD" : "#FFF3E0",

          borderRadius: 6,
          padding: "10px 12px",
          display: "flex", gap: 10, alignItems: "flex-start"
        }}>
          <div style={{ marginTop: 1, flexShrink: 0 }}>
            <ImpactBadge impact={dim.impact} />
          </div>
          <div style={{ fontSize: 13, lineHeight: 1.55, color: "#1A1A1A", flex: 1 }}>{dim.weak}</div>
        </div>
        }
      </div>
    </div>);

}

/* =============== RUN-YOUR-OWN CTA =============== */
function RunYourOwn() {
  return (
    <section className="sec-white" style={{ backgroundColor: "rgb(253, 246, 238)" }}>
      <div className="page-w">

            }}>
              Run this on your own creatives.

            <div style={{
              fontSize: 15, lineHeight: 1.55, color: "#6B6B6B", maxWidth: 580

          <BtnFilled large href="/creative-analysis">

function FooterCrossSell() {
  return (
    <section style={{
      background: "linear-gradient(135deg, #1A1A1A 0%, #241408 100%)",
      padding: "56px 32px"
    }}>
      <div style={{
        maxWidth: 1080, margin: "0 auto",
        display: "flex", justifyContent: "space-between", alignItems: "center",
        flexWrap: "wrap", gap: 18
      }}>
        <p style={{
          fontSize: 18, lineHeight: 1.45, color: "#fff",
          margin: 0, letterSpacing: "-0.01em", fontWeight: 500,
          maxWidth: 640
        }}>
          Creative is one lever. The account and the landing page are the other two.
        </p>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
          <a href="/google-ads-audit" style={darkCtaBtn(true)}>
            Audit your Google Ads →
          </a>
          <a href="/landing-page-audit" style={darkCtaBtn(false)}>
            Audit your landing page →
          </a>
        </div>
      </div>
    </section>);

}

function darkCtaBtn(filled) {
  return {
    display: "inline-flex", alignItems: "center", gap: 8,
    fontSize: 15, fontWeight: 600,
    color: "#fff",
    background: filled ? "#985830" : "transparent",
    border: filled ? "1.5px solid #985830" : "1.5px solid rgba(255,255,255,0.3)",
    padding: "13px 22px", borderRadius: 4,
    textDecoration: "none", letterSpacing: "-0.005em"
  };
}

function Footer() {
  return (
    <footer style={{
      background: "linear-gradient(135deg, #1A1A1A 0%, #241408 100%)",
      padding: "28px 32px",
      borderTop: "1px solid rgba(255,255,255,0.08)"
    }}>
      <div style={{
        maxWidth: 1200, margin: "0 auto",
        display: "flex", justifyContent: "space-between", alignItems: "center",
        flexWrap: "wrap", gap: 12
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 16, fontSize: 12, color: "rgba(255,255,255,0.4)" }}>
          <span style={{ fontSize: 16, fontWeight: 700, color: "#fff", letterSpacing: "-0.01em" }}>
            Phillips<span style={{ color: "#985830" }}>.</span>
          </span>
          <span>© 2026 Lewis Phillips · phillips-uk.com</span>
        </div>
      </div>
    </footer>);

}

/* =============== APP =============== */
function App() {
  return (
    <div data-screen-label="01 Creative Analysis Demo">
      <Nav />
      <ReportHeader />
      <RankedSummary />
      <Breakdowns />
      <RunYourOwn />
      <FooterCrossSell />
      <Footer />

}
