<script type="text/babel">

/* =============== SEVERITY TOKENS =============== */
/* Warm-tuned palette. Critical = deepest red; ramps through amber to a muted green pass. */
const SEV = {
  critical: { label: "Critical", fg: "#8C1A0A", bg: "#F3D9D2", border: "#E0B0A2", solid: true  },
  high:     { label: "High",     fg: "#B83A1F", bg: "#F8E4DC", border: "#EBC4B5", solid: false },
  medium:   { label: "Medium",   fg: "#985830", bg: "#F5EBD9", border: "#E8D8C4", solid: false },
  low:      { label: "Low",      fg: "#6B6B6B", bg: "#EFECE6", border: "#DCD7CC", solid: false },
  pass:     { label: "Pass",     fg: "#4F7A4A", bg: "#E6EFE4", border: "#CDDCC8", solid: false },
};

/* Band tokens for category scores: Poor / Average / Good / Excellent */
const BAND = {
  poor:      { label: "Poor",      fg: "#B83A1F", bg: "#F8E4DC", border: "#EBC4B5" },
  average:   { label: "Average",   fg: "#985830", bg: "#F5EBD9", border: "#E8D8C4" },
  good:      { label: "Good",      fg: "#4F7A4A", bg: "#E6EFE4", border: "#CDDCC8" },
  excellent: { label: "Excellent", fg: "#2E5A2A", bg: "#D9E6D6", border: "#B7CCB1" },
};
const bandFor = (s) => s >= 85 ? "excellent" : s >= 70 ? "good" : s >= 50 ? "average" : "poor";

/* =============== BUTTONS =============== */
function BtnFilled({ children, onClick, large }) {
  const [h, setH] = React.useState(false);
  return (
    <button onClick={onClick} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{
        background: h ? "#7A3F1F" : "#985830", color: "#fff", border: 0,
        padding: large ? "16px 32px" : "14px 30px",
        fontSize: large ? 15 : 14, fontWeight: 600,
        borderRadius: 4, cursor: "pointer", fontFamily: "inherit",
        transition: "background 150ms cubic-bezier(0.2,0,0,1)",
        letterSpacing: "-0.005em",
      }}>{children}</button>
  );
}
function BtnFilledSmall({ children, onClick, icon, disabled }) {
  const [h, setH] = React.useState(false);
  return (
    <button onClick={onClick} disabled={disabled}
      onMouseEnter={() => !disabled && setH(true)} onMouseLeave={() => setH(false)}
      style={{
        background: disabled ? "#C4956A" : (h ? "#7A3F1F" : "#985830"), color: "#fff", border: 0,
        padding: "10px 20px", fontSize: 13, fontWeight: 600,
        borderRadius: 4, cursor: disabled ? "default" : "pointer", fontFamily: "inherit",
        transition: "background 150ms cubic-bezier(0.2,0,0,1)",
        display: "inline-flex", alignItems: "center", gap: 8,
        outline: "none",
      }}>
      {icon}
      <span>{children}</span>
    </button>
  );
}
function BtnOutline({ children, onClick, icon }) {
  const [h, setH] = React.useState(false);
  return (
    <button onClick={onClick} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{
        background: h ? "#985830" : "transparent",
        color: h ? "#fff" : "#1A1A1A",
        border: "1.5px solid #985830",
        padding: "10px 18px",
        fontSize: 13, fontWeight: 600,
        borderRadius: 4, cursor: "pointer", fontFamily: "inherit",
        transition: "background 150ms cubic-bezier(0.2,0,0,1), color 150ms cubic-bezier(0.2,0,0,1)",
        display: "inline-flex", alignItems: "center", gap: 8,
      }}>
      {icon}
      <span>{children}</span>
    </button>
  );
}

/* =============== NAV =============== */

/* =============== SHARED PRIMITIVES =============== */
function SeverityBadge({ kind, size = "md" }) {
  const s = SEV[kind];
  const pad = size === "sm" ? "3px 9px" : "4px 11px";
  const fs = size === "sm" ? 10 : 11;
  if (s.solid) {
    return (
      <span style={{
        display: "inline-flex", alignItems: "center", gap: 6,
        background: s.fg, color: "#fff",
        border: `1px solid ${s.fg}`,
        padding: pad, borderRadius: 20,
        fontSize: fs, fontWeight: 700, letterSpacing: "0.10em",
        textTransform: "uppercase", lineHeight: 1, whiteSpace: "nowrap",
      }}>
        <span style={{
          width: 6, height: 6, borderRadius: 999,
          background: "#fff", display: "inline-block",
        }}/>
        {s.label}
      </span>
    );
  }
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", gap: 6,
      background: s.bg, color: s.fg,
      border: `1px solid ${s.border}`,
      padding: pad, borderRadius: 20,
      fontSize: fs, fontWeight: 700, letterSpacing: "0.10em",
      textTransform: "uppercase", lineHeight: 1, whiteSpace: "nowrap",
    }}>
      <span style={{
        width: 6, height: 6, borderRadius: 999,
        background: s.fg, display: "inline-block",
      }}/>
      {s.label}
    </span>
  );
}

function BandBadge({ score, size = "md" }) {
  const b = BAND[bandFor(score)];
  const pad = size === "sm" ? "3px 9px" : "4px 11px";
  const fs = size === "sm" ? 10 : 11;
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", gap: 6,
      background: b.bg, color: b.fg,
      border: `1px solid ${b.border}`,
      padding: pad, borderRadius: 20,
      fontSize: fs, fontWeight: 700, letterSpacing: "0.10em",
      textTransform: "uppercase", lineHeight: 1, whiteSpace: "nowrap",
    }}>
      <span style={{ width: 6, height: 6, borderRadius: 999, background: b.fg }}/>
      {b.label}
    </span>
  );
}

function Eyebrow({ children, color = "#985830" }) {
  return (
    <span style={{
      display: "inline-block",
      fontSize: 11, fontWeight: 700, letterSpacing: "0.12em",
      textTransform: "uppercase", color,
    }}>{children}</span>
  );
}

function SectionHeader({ eyebrow, title, emphasis, sub }) {
  return (
    <div style={{ borderLeft: "3px solid #985830", paddingLeft: 24, marginBottom: 32 }}>
      <Eyebrow>{eyebrow}</Eyebrow>
      <h2 style={{
        fontSize: "clamp(28px, 3.2vw, 36px)", fontWeight: 700,
        letterSpacing: "-0.02em", lineHeight: 1.1,
        color: "#1A1A1A", margin: "10px 0 0", maxWidth: 800,
      }}>
        {title}
        {emphasis && <> <em style={{ fontStyle: "italic", color: "#985830" }}>{emphasis}</em></>}
      </h2>
      {sub && (
        <p style={{ fontSize: 15, lineHeight: 1.6, color: "#6B6B6B", margin: "12px 0 0", maxWidth: 720 }}>
          {sub}
        </p>
      )}
    </div>
  );
}

function ProblemFixImpact({ detail, fix, impact, dense }) {
  const Row = ({ label, body }) => (
    <div className="rpt-pfi-row" style={{
      display: "grid",
      gridTemplateColumns: dense ? "78px 1fr" : "86px 1fr",
      gap: 16,
      padding: dense ? "10px 0" : "12px 0",
      borderTop: "1px solid #F0E5D2",
    }}>
      <div style={{
        fontSize: 10, fontWeight: 700, letterSpacing: "0.14em",
        textTransform: "uppercase", color: "#985830",
        paddingTop: 3,
      }}>{label}</div>
      <div style={{ fontSize: dense ? 13 : 14, lineHeight: 1.6, color: "#1A1A1A" }}>{body}</div>
    </div>
  );
  return (
    <div>
      <Row label="Problem" body={detail}/>
      <Row label="Fix" body={fix}/>
      <Row label="Impact" body={<span style={{ color: "#6B6B6B" }}>{impact}</span>}/>
    </div>
  );
}

/* =============== SHARE + PDF BUTTONS =============== */
function ShareButton() {
  const [copied, setCopied] = React.useState(false);
  function handleShare() {
    const url = window.location.href;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(() => {
        setCopied(true); setTimeout(() => setCopied(false), 2000);
      }).catch(() => fallback(url));
    } else { fallback(url); }
  }
  function fallback(url) {
    const ta = document.createElement('textarea');
    ta.value = url; ta.style.cssText = "position:fixed;opacity:0;";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch(e) {}
    document.body.removeChild(ta);
  }
  return <BtnOutline icon={<IconShare/>} onClick={handleShare}>{copied ? "Link copied!" : "Share"}</BtnOutline>;
}

function PdfDownloadButton() {
  const [busy, setBusy] = React.useState(false);
  async function handleDownload() {
    if (busy || !window.html2pdf) return;
    setBusy(true);
    try {
      const el = document.getElementById('root');
      const filename = "google-ads-audit-" + (ACCOUNT.cid || "report") + "-" + new Date().toISOString().slice(0,10) + ".pdf";
      await html2pdf().set({
        margin: [8,8,8,8],
        filename,
        image: { type:'jpeg', quality: 0.92 },
        html2canvas: { scale: 2, useCORS: true, logging: false },
        jsPDF: { unit:'mm', format:'a4', orientation:'portrait' },
        pagebreak: { mode: ['avoid-all','css','legacy'] },
      }).from(el).save();
    } catch(e) { console.error(e); }
    finally { setBusy(false); }
  }
  return (
    <BtnFilledSmall icon={busy ? <Spinner/> : <IconDownload/>} disabled={busy} onClick={handleDownload}>
      {busy ? "Generating…" : "Download PDF"}
    </BtnFilledSmall>
  );
}

/* =============== SEARCH TERM N-GRAMS =============== */
function SearchTermNgrams() {
  const [filter, setFilter] = React.useState(0);
  const filtered = filter === 0 ? NGRAM_DATA : NGRAM_DATA.filter(t => t.n === filter);
  const wasteTotal = NGRAM_DATA.filter(t => t.conv === 0).reduce((s, t) => s + t.cost, 0);
  const fmt = (n) => "\xA3" + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");

  const tabs = [
    { label: "All patterns", val: 0 },
    { label: "1-word",       val: 1 },
    { label: "2-word",       val: 2 },
    { label: "3-word",       val: 3 },
  ];

  return (
    <section className="sec-cream">
      <div className="page-w">
        {/* Header */}
        <div style={{ borderLeft: "3px solid #985830", paddingLeft: 24, marginBottom: 40 }}>
          <span style={{
            display: "block", fontSize: 11, fontWeight: 700, letterSpacing: "0.12em",
            textTransform: "uppercase", color: "#985830", marginBottom: 12,
          }}>Search term waste</span>
          <h2 style={{
            fontSize: "clamp(28px, 3.5vw, 36px)", fontWeight: 700,
            letterSpacing: "-0.025em", lineHeight: 1.1, color: "#1A1A1A",
            margin: "0 0 10px",
          }}>
            N-gram analysis — <em style={{ fontStyle: "italic", color: "#985830" }}>non-buyer intent patterns</em>
          </h2>
          <p style={{ fontSize: 14, color: "#6B6B6B", margin: 0, lineHeight: 1.6 }}>
            {fmt(wasteTotal)} spent on search terms with zero conversions in the last 30 days. These n-gram patterns appear across multiple search terms — adding them as negatives removes the entire class of query.
          </p>
        </div>

        {/* Tabs */}
        <div style={{ display: "flex", gap: 8, marginBottom: 20, flexWrap: "wrap" }}>
          {tabs.map(t => {
            const active = filter === t.val;
            return (
              <button key={t.val} onClick={() => setFilter(t.val)} style={{
                padding: "7px 16px", fontSize: 13, fontWeight: 600,
                borderRadius: 4, border: "1.5px solid",
                borderColor: active ? "#985830" : "#E8D8C4",
                background: active ? "#985830" : "#fff",
                color: active ? "#fff" : "#1A1A1A",
                cursor: "pointer", fontFamily: "inherit",
                transition: "all 150ms cubic-bezier(0.2,0,0,1)",
              }}>{t.label}</button>
            );
          })}
        </div>

        {/* Table */}
        <div className="gaa-search-table" style={{
          background: "#fff", border: "1px solid #E8D8C4", borderRadius: 6,
          overflow: "hidden", boxShadow: "0 2px 8px rgba(152,88,48,0.08)",
        }}>
          {/* Inner wrapper gives the grid a concrete min-width so 1fr resolves and the container scrolls */}
          <div style={{ minWidth: 660 }}>
          {/* Table header */}
          <div style={{
            display: "grid",
            gridTemplateColumns: "minmax(120px, 1fr) 80px 90px 90px 80px 150px",
            padding: "12px 20px",
            background: "#F5EBD9",
            borderBottom: "1px solid #E8D8C4",
            fontSize: 11, fontWeight: 700, letterSpacing: "0.08em",
            textTransform: "uppercase", color: "#985830",
            gap: 8,
          }}>
            <span>Pattern</span>
            <span style={{ textAlign: "right" }}>N-gram</span>
            <span style={{ textAlign: "right" }}>Clicks</span>
            <span style={{ textAlign: "right" }}>Cost</span>
            <span style={{ textAlign: "right" }}>Conv.</span>
            <span style={{ textAlign: "right" }}>Status</span>
          </div>
          {filtered.map((row, i) => {
            const isWaste = row.conv === 0;
            const cpa = row.conv > 0 ? fmt(row.cost / row.conv) + " CPA" : null;
            return (
              <div key={i} style={{
                display: "grid",
                gridTemplateColumns: "minmax(120px, 1fr) 80px 90px 90px 80px 150px",
                padding: "14px 20px",
                borderBottom: i < filtered.length - 1 ? "1px solid #E8D8C4" : "none",
                background: i % 2 === 0 ? "#fff" : "#FDFAF6",

              }}>
                <span style={{ fontSize: 14, fontWeight: 600, color: "#1A1A1A", fontFamily: "monospace" }}>
                  "{row.term}"

                <span style={{ fontSize: 13, color: "#6B6B6B", textAlign: "right" }}>
                  {row.n}-word
                </span>
                <span style={{ fontSize: 13, color: "#1A1A1A", textAlign: "right" }}>
                  {row.clicks.toLocaleString()}
                </span>
                <span style={{ fontSize: 13, fontWeight: 600, color: "#1A1A1A", textAlign: "right" }}>
                  {fmt(row.cost)}

                      letterSpacing: "0.08em", textTransform: "uppercase", whiteSpace: "nowrap",

        </div>

        {/* Callout */}
        <div style={{
          marginTop: 20, padding: "16px 20px",
          background: "#F5EBD9", borderRadius: 6, border: "1px solid #E8D8C4",
          fontSize: 13, color: "#1A1A1A", lineHeight: 1.6,
        }}>
          <strong>Recommended action:</strong> Add the zero-conversion 1-word patterns as campaign-level negatives this week. 2- and 3-word patterns with zero conversions follow in the next pass. Expected waste recapture: <strong>{fmt(NGRAM_DATA.filter(t=>t.conv===0).reduce((s,t)=>s+t.cost,0))}/month</strong>.
        </div>
      </div>
    </section>
  );
}

/* =============== DAY & HOUR HEATMAP =============== */
function DayHourHeatmap() {
  const hourTotals = Array.from({length: 24}, (_, h) => HEATMAP.reduce((s, row) => s + row[h], 0));
  const dayTotals  = HEATMAP.map(row => row.reduce((s, v) => s + v, 0));
  const grandTotal = dayTotals.reduce((s, v) => s + v, 0);
  const peakHour   = hourTotals.indexOf(Math.max(...hourTotals));

  function cellColor(v) {
    if (v === 0) return "#F5F2EE";
    const t = Math.min(v / HEATMAP_MAX, 1);
    // interpolate cream → amber: #FDF6EE → #985830
    const r = Math.round(0xFD + (0x98 - 0xFD) * t);
    const g = Math.round(0xF6 + (0x58 - 0xF6) * t);
    const b = Math.round(0xEE + (0x30 - 0xEE) * t);
    return `rgb(${r},${g},${b})`;
  }
  function textColor(v) {
    return v / HEATMAP_MAX > 0.55 ? "#fff" : "#1A1A1A";
  }

  const CELL = { width: 34, height: 28, fontSize: 10, borderRadius: 3, margin: 1.5 };

  return (
    <section className="sec-white">
      <div className="page-w">
        {/* Header */}
        <div style={{ borderLeft: "3px solid #985830", paddingLeft: 24, marginBottom: 40 }}>
          <span style={{
            display: "block", fontSize: 11, fontWeight: 700, letterSpacing: "0.12em",
            textTransform: "uppercase", color: "#985830", marginBottom: 12,
          }}>Conversion timing</span>
          <h2 style={{
            fontSize: "clamp(28px, 3.5vw, 36px)", fontWeight: 700,
            letterSpacing: "-0.025em", lineHeight: 1.1, color: "#1A1A1A",
            margin: "0 0 10px",
          }}>
            When does Smart Bidding <em style={{ fontStyle: "italic", color: "#985830" }}>have signal?</em>
          </h2>
          <p style={{ fontSize: 14, color: "#6B6B6B", margin: 0, lineHeight: 1.6 }}>
            Conversions by day and hour over the last 30 days. Dark cells = high conversion volume. Budget runs flat 24/7 — this heatmap shows where ad scheduling could recapture efficiency.
          </p>
        </div>

        {/* Heatmap card */}
        <div style={{
          background: "#fff", border: "1px solid #E8D8C4", borderRadius: 6,
          padding: "32px 28px 28px",
          boxShadow: "0 2px 8px rgba(152,88,48,0.08)",
          overflowX: "auto",
        }}>
          <div style={{ minWidth: 860 }}>
            {/* Hour axis labels */}
            <div style={{ display: "flex", marginLeft: 52, marginBottom: 4 }}>
              {Array.from({length: 24}, (_, h) => (
                <div key={h} style={{
                  width: CELL.width + CELL.margin * 2, textAlign: "center",
                  fontSize: 9, color: "#6B6B6B", fontWeight: 500,
                }}>
                  {h % 3 === 0 ? `${String(h).padStart(2,"0")}:00` : ""}
                </div>
              ))}
            </div>

            {/* Rows */}
            {HEATMAP.map((row, d) => (
              <div key={d} style={{ display: "flex", alignItems: "center", marginBottom: 2 }}>
                {/* Day label */}
                <div style={{
                  width: 48, fontSize: 11, fontWeight: 600, color: "#6B6B6B",
                  flexShrink: 0, letterSpacing: "0.03em",
                }}>
                  {DAYS_LABEL[d]}
                </div>
                {/* Hour cells */}
                {row.map((v, h) => (
                  <div key={h} style={{
                    width: CELL.width, height: CELL.height,
                    margin: CELL.margin,
                    borderRadius: CELL.borderRadius,
                    background: cellColor(v),
                    display: "flex", alignItems: "center", justifyContent: "center",
                    fontSize: CELL.fontSize, fontWeight: 600,
                    color: textColor(v),
                    flexShrink: 0,
                  }}>
                    {v > 0 ? v : ""}
                  </div>
                ))}
                {/* Row total */}
                <div style={{
                  marginLeft: 10, fontSize: 11, fontWeight: 700,
                  color: "#985830", minWidth: 28, textAlign: "right",
                }}>
                  {dayTotals[d]}
                </div>
              </div>
            ))}

            {/* Hour totals row */}
            <div style={{ display: "flex", alignItems: "center", marginTop: 8, marginLeft: 52 }}>
              {hourTotals.map((v, h) => (
                <div key={h} style={{
                  width: CELL.width + CELL.margin * 2, textAlign: "center",
                  fontSize: 10, fontWeight: v === Math.max(...hourTotals) ? 700 : 400,
                  color: v === Math.max(...hourTotals) ? "#985830" : "#6B6B6B",
                }}>
                  {v > 0 ? v : ""}
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* Insight strip */}
        <div className="gaa-insight-strip" style={{
          display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12, marginTop: 16,
        }}>
          {[
            { label: "Peak conversion window", value: `${String(peakHour).padStart(2,"0")}:00–${String(peakHour+2).padStart(2,"0")}:00 weekdays` },
            { label: "Weekend share of conversions", value: `${Math.round((dayTotals[5]+dayTotals[6])/grandTotal*100)}% of total` },
            { label: "Dead hours (zero conversions)", value: `00:00–06:00 daily` },
          ].map((s, i) => (
            <div key={i} style={{
              background: "#F5EBD9", border: "1px solid #E8D8C4",
              borderRadius: 6, padding: "16px 18px",
            }}>
              <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", color: "#985830", marginBottom: 6 }}>
                {s.label}
              </div>
              <div style={{ fontSize: 16, fontWeight: 700, color: "#1A1A1A", letterSpacing: "-0.01em" }}>
                {s.value}
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

/* =============== LIVE DATA LOADER =============== */
const CAT_LABELS = {
  conversion_foundation: "Conversion Tracking",
  account_structure:     "Account Structure",
  bidding:               "Bidding & Budget",
  keyword_hygiene:       "Keyword Hygiene",
  audiences:             "Audiences",
  creative:              "Ad Creative",
  traffic_quality:       "Traffic Quality",
  ai_automation:         "AI & Automation",
  feed_health:           "Feed Health",
};

function applyReportData(raw) {
  const SEV_PENALTY = { critical: 20, high: 10, medium: 4, low: 1 };
  const meta = raw.metadata || {};

  // Account
  ACCOUNT.name    = raw.user_name || raw.account_name || "Your Account";
  ACCOUNT.cid     = (() => { const s = String(raw.customer_id || "").replace(/\D/g,""); return s.length===10?s.slice(0,3)+"-"+s.slice(3,6)+"-"+s.slice(6):s; })();
  ACCOUNT.score   = raw.score || 0;
  ACCOUNT.window  = meta.lookback || "Last 30 days";
  ACCOUNT.audited = new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
  if (meta.currency) ACCOUNT.currency = meta.currency;

  // Stats bar — compute from campaign data + benchmarks
  const sym = ACCOUNT.currency === "GBP" ? "£" : ACCOUNT.currency === "EUR" ? "€" : "$";
  const bm  = meta.benchmarks || {};

  // Estimate total spend: scan all issues for campaign avg_daily_spend (avoids double-counting)
  const seenCampaigns = new Set();
  let totalDailySpend = 0;
  Object.values(raw.categories || {}).forEach(cat => {
    (cat.issues || cat.findings || []).forEach(issue => {
      ((issue.data || {}).campaigns || []).forEach(c => {
        if (c.name && !seenCampaigns.has(c.name)) {
          seenCampaigns.add(c.name);
          totalDailySpend += c.avg_daily_spend || 0;
        }
      });
    });
  });
  const estSpend = totalDailySpend > 0 ? Math.round(totalDailySpend * 30) : null;

  ACCOUNT.stats = [
    estSpend != null
      ? { label: "30d Spend", value: sym + estSpend.toLocaleString("en-GB"), delta: "Est. from campaign data", trend: "neutral" }
      : null,
    bm.search_ctr != null
      ? { label: "Search CTR", value: bm.search_ctr.toFixed(2) + "%", delta: bm.search_ctr >= 5 ? "Above 5% benchmark" : "Below 5% benchmark", trend: bm.search_ctr >= 5 ? "up" : "down" }
      : null,
    bm.cost_per_conv != null
      ? { label: "Cost / Conv.", value: sym + bm.cost_per_conv.toFixed(2), delta: "Last 30 days", trend: "neutral" }
      : null,
    bm.is_acquired != null
      ? { label: "Impr. Share", value: bm.is_acquired.toFixed(1) + "%", delta: bm.is_lost_budget ? bm.is_lost_budget.toFixed(1) + "% lost to budget" : "Last 30 days", trend: (bm.is_lost_budget || 0) > 15 ? "down" : "up" }
      : null,
  ].filter(Boolean);
  if (!ACCOUNT.stats.length) {
    // Fallback: keep existing stats unchanged (demo mode)
    ACCOUNT.stats = ACCOUNT.stats;
  }

  // Map a single issue object to the finding format
  function mapIssue(f) {
    return {
      severity: (f.severity || "medium").toLowerCase(),
      title:    f.title || f.check || "",
      detail:   f.detail || "",
      fix:      f.recommendation || f.fix || "",
      impact:   f.reasoning || f.impact || "",
    };
  }

  // Categories — dict keyed by category slug, each has {label, issues[], passes[]}
  if (raw.categories && typeof raw.categories === "object" && !Array.isArray(raw.categories)) {
    CATEGORIES.length = 0;
    Object.entries(raw.categories).forEach(([key, cat]) => {
      const issues = cat.issues || cat.findings || [];
      // Compute score from severity penalties
      const penalty = issues.reduce((sum, f) => sum + (SEV_PENALTY[(f.severity||"medium").toLowerCase()] || 0), 0);
      CATEGORIES.push({
        name:     cat.label || CAT_LABELS[key] || key,
        score:    Math.max(0, 100 - penalty),
        findings: issues.map(mapIssue),
      });
    });
  }

  // Priority — use top_3 array (full issue objects with all fields)
  const top3 = raw.top_3 || [];
  if (top3.length) {
    PRIORITY = top3.map(f => ({
      ...mapIssue(f),
      category: CAT_LABELS[f.category] || f.category || "",
    }));
  } else {
    // Fallback: derive from categories
    PRIORITY = CATEGORIES
      .flatMap(c => c.findings.map(f => ({ ...f, category: c.name })))
      .filter(f => f.severity !== "pass")
      .sort((a, b) => SEV_RANK[a.severity] - SEV_RANK[b.severity])
      .slice(0, 3);
  }

  OVERALL      = raw.score || (CATEGORIES.length ? Math.round(CATEGORIES.reduce((s,c) => s+c.score, 0) / CATEGORIES.length) : 0);
  OVERALL_BAND = BAND[bandFor(OVERALL)];

  // N-gram data — metadata.ngrams.{performing, wasted}
  const ngramMeta = meta.ngrams;
  if (ngramMeta && (ngramMeta.performing || ngramMeta.wasted)) {
    NGRAM_DATA.length = 0;
    const addNgrams = (arr, status) => (arr || []).forEach(r => {
      const conv = r.conversions || r.conv || 0;
      NGRAM_DATA.push({
        pattern: r.ngram || r.pattern || r.term || "",
        clicks:  r.clicks  || 0,
        cost:    r.cost    || 0,
        conv,
        cpa:     conv > 0 ? Math.round((r.cost / conv) * 100) / 100 : 0,
        status,
      });
    });
    addNgrams(ngramMeta.performing, "performing");
    addNgrams(ngramMeta.wasted,     "wasted");
  }

  // Heatmap — metadata.heatmap.cells: [{day, hour, conversions, clicks, cost, impressions}]
  const heatCells = (meta.heatmap && meta.heatmap.cells) || meta.heatmap;
  if (Array.isArray(heatCells) && heatCells.length) {
    // Build 7×24 grid, using conversions (fall back to clicks)
    const grid = Array.from({length: 7}, () => Array(24).fill(0));
    heatCells.forEach(c => {
      const row = c.day  >= 0 && c.day  < 7  ? c.day  : null;
      const col = c.hour >= 0 && c.hour < 24 ? c.hour : null;
      if (row !== null && col !== null) grid[row][col] = c.conversions || c.clicks || 0;
    });
    HEATMAP.length = 0;
    grid.forEach(row => HEATMAP.push(row));
    HEATMAP_MAX = Math.max(...HEATMAP.flat()) || 1;
  }
}

function LoadingScreen() {
  return (
    <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", minHeight:"60vh", gap:16 }}>
      <div style={{ width:40, height:40, border:"3px solid #F5EBD9", borderTopColor:"#985830", borderRadius:"50%", animation:"ph-spin 0.8s linear infinite" }}/>
      <p style={{ fontSize:15, color:"#6B6B6B", margin:0 }}>Loading your report…</p>
    </div>
  );
}

function ErrorScreen() {
  return (
    <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", minHeight:"60vh", gap:16, padding:"0 24px", textAlign:"center" }}>
      <div style={{ fontSize:36 }}>⚠️</div>
      <h2 style={{ fontSize:22, fontWeight:700, color:"#1A1A1A", margin:0 }}>Couldn't load this report</h2>
      <p style={{ fontSize:15, color:"#6B6B6B", maxWidth:400, margin:0 }}>The report link may have expired or the audit is still processing. Try running the audit again.</p>
      <a href="/google-ads-audit" style={{ background:"#985830", color:"#fff", padding:"12px 24px", borderRadius:4, textDecoration:"none", fontWeight:600, fontSize:14 }}>Run audit</a>
    </div>
  );
}

function ReportLoader({ children }) {
  const [phase, setPhase] = React.useState(() => {
    const p = new URLSearchParams(window.location.search);
    if (p.get('id') || p.get('direct')) return 'loading';
    return 'demo';
  });

  React.useEffect(() => {
    const p = new URLSearchParams(window.location.search);
    const id     = p.get('id');
    const direct = p.get('direct');

    if (direct === '1') {
      // Data was stored in sessionStorage by the audit tool
      try {
        const stored = sessionStorage.getItem('gaa_result_direct');
        if (stored) {
          applyReportData(JSON.parse(stored));
          sessionStorage.removeItem('gaa_result_direct');
          setPhase('live');
          return;
        }
      } catch(e) {}
      setPhase('error');
      return;
    }

    if (!id) { setPhase('demo'); return; }

    fetch("/.netlify/functions/get-report?id=" + encodeURIComponent(id))
      .then(r => {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(raw => {
        applyReportData(raw);
        setPhase('live');
      })
      .catch(() => setPhase('error'));
  }, []);

  if (phase === 'loading') return <><Nav active="ga"/><LoadingScreen/></>;
  if (phase === 'error')   return <><Nav active="ga"/><ErrorScreen/></>;
  return children;
}

function App() {
  return (
    <ReportLoader>
      <div data-screen-label="01 Google Ads Audit Report">
        <Nav active="ga"/>
        <ReportHeader/>
        <PriorityActions/>
        <SearchTermNgrams/>
        <DayHourHeatmap/>
        <FindingsByCategory/>
        <EndCta/>
        <Footer/>
      </div>
    </ReportLoader>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
