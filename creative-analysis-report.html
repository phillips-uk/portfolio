<script>
window.downloadCreativePDF = async function () {
  const el = document.getElementById('pdf-layout');
  if (!el) { console.error('downloadCreativePDF: #pdf-layout not found'); return; }
  if (!window.html2pdf) { console.error('downloadCreativePDF: html2pdf.js not loaded'); return; }
  const prev = {
    display: el.style.display, position: el.style.position,
    left: el.style.left, top: el.style.top,
    zIndex: el.style.zIndex, visibility: el.style.visibility,
  };
  el.style.display    = 'block';
  el.style.position   = 'fixed';
  el.style.left       = '-10000px';
  el.style.top        = '0';
  el.style.zIndex     = '-1';
  el.style.visibility = 'visible';
  try {
    await window.html2pdf()
      .set({
        margin: [12, 14, 12, 14],
        filename: 'Creative-Analysis-Report.pdf',
        image: { type: 'jpeg', quality: 0.96 },
        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', windowWidth: 760, logging: false },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait', compress: true },
        pagebreak: { mode: ['css', 'legacy'], before: '.pdf-page-break' },
      })
      .from(el)
      .save();
  } finally {
    Object.assign(el.style, prev);
  }
};
</script>

/* =============== SCORE COLOR MAP =============== */
function scoreColor(n) {
  if (n >= 7) return { fg: "#4F7A4A", bg: "#E6EFE4", border: "#CDDCC8", label: "Strong" };
  if (n >= 5) return { fg: "#985830", bg: "#F5EBD9", border: "#E8D8C4", label: "Average" };
  return { fg: "#B83A1F", bg: "#F8E4DC", border: "#EBC4B5", label: "Weak" };
}

    onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}

      padding: large ? "16px 32px" : "14px 30px",

      letterSpacing: "-0.005em", textDecoration: "none",

}

function BtnOutline({ children, onClick, icon, disabled }) {
  const [h, setH] = React.useState(false);
  return (
    <button onClick={onClick} disabled={disabled}
    onMouseEnter={() => !disabled && setH(true)} onMouseLeave={() => setH(false)}
    style={{
      background: disabled ? "transparent" : h ? "#985830" : "transparent",
      color: disabled ? "#6B6B6B" : h ? "#fff" : "#1A1A1A",
      border: `1.5px solid ${disabled ? "#E8D8C4" : "#985830"}`,
      padding: "9px 16px", fontSize: 13, fontWeight: 600,

      fontFamily: "inherit",
      transition: "background 150ms cubic-bezier(0.2,0,0,1), color 150ms cubic-bezier(0.2,0,0,1)",
      display: "inline-flex", alignItems: "center", gap: 8

      <span>{children}</span>

}
function PdfDownloadButton() {
  const [busy, setBusy] = React.useState(false);
  return (
    <BtnOutline
      icon={busy ? <Spinner /> : <IconDownload />}
      disabled={busy}
      onClick={async () => {
        if (busy || !window.downloadCreativePDF) return;
        setBusy(true);
        try {await window.downloadCreativePDF();}
        catch (e) {console.error(e);} finally
        {setBusy(false);}
      }}>
      {busy ? "Generating…" : "Download PDF"}
    </BtnOutline>);

}

                background: cc.bg, border: `1px solid ${cc.border}`,
                borderRadius: 5, padding: "10px 16px",
                textAlign: "right", marginLeft: 20, flexShrink: 0
              }}>
                <div style={{ fontSize: 7, fontWeight: 700, letterSpacing: "0.10em", textTransform: "uppercase", color: cc.fg, marginBottom: 4 }}>Composite</div>
                <div style={{ fontSize: 22, fontWeight: 700, color: cc.fg, letterSpacing: "-0.02em", lineHeight: 1 }}>
                  {c.composite.toFixed(1)}<span style={{ fontSize: 10, fontWeight: 500, opacity: 0.7 }}> / 10</span>
                </div>
                <div style={{ fontSize: 9, fontWeight: 600, color: cc.fg, opacity: 0.75, marginTop: 2 }}>{cc.label}</div>
              </div>
            </div>

            {/* Dimension table */}
            <div style={{ fontSize: 8, fontWeight: 700, letterSpacing: "0.12em", textTransform: "uppercase", color: "#985830", marginBottom: 8 }}>Dimension breakdown</div>
            <div style={{ border: "1px solid #E8D8C4", borderRadius: 4, overflow: "hidden", marginBottom: 12 }}>
              {/* Column headers */}
              <div style={{ display: "flex", background: "#FDF6EE", borderBottom: "1px solid #E8D8C4", padding: "9px 14px" }}>
                <div style={{ width: 130, flexShrink: 0, fontSize: 8, fontWeight: 700, letterSpacing: "0.10em", textTransform: "uppercase", color: "#985830" }}>Dimension</div>
                <div style={{ width: 86, flexShrink: 0, fontSize: 8, fontWeight: 700, letterSpacing: "0.10em", textTransform: "uppercase", color: "#985830" }}>Score</div>
                <div style={{ flex: 1, fontSize: 8, fontWeight: 700, letterSpacing: "0.10em", textTransform: "uppercase", color: "#985830" }}>Rationale</div>
              </div>
              {DIM_KEYS.map((k, i) => {
                const sc = scoreColor(c.scores[k]);
                const dim = c.dims[k];
                return (
                  <div key={k} style={{
                    display: "flex", padding: "12px 14px",
                    borderTop: i === 0 ? "none" : "1px solid #F0E5D2",
                    alignItems: "flex-start"
                  }}>
                    <div style={{ width: 130, flexShrink: 0, fontSize: 11, fontWeight: 600, color: "#1A1A1A", paddingTop: 2 }}>{DIM_LABELS[k]}</div>
                    <div style={{ width: 86, flexShrink: 0, paddingTop: 1 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 5 }}>
                        <span style={{ fontSize: 15, fontWeight: 700, color: sc.fg, letterSpacing: "-0.01em" }}>{c.scores[k]}</span>
                        <span style={{ fontSize: 9, color: sc.fg, fontWeight: 600 }}>/ 10</span>
                      </div>
                      <div style={{ width: 56, height: 4, background: "#F0E5D2", borderRadius: 2, overflow: "hidden" }}>
                        <div style={{ width: `${c.scores[k] / 10 * 100}%`, height: "100%", background: sc.fg, borderRadius: 2 }} />
                      </div>
                    </div>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 11, lineHeight: 1.6, color: "#1A1A1A" }}>{dim.rationale}</div>
                      {dim.weak &&
                      <div style={{
                        marginTop: 8, background: "#F8E4DC",
                        border: "1px solid #EBC4B5", borderRadius: 4, padding: "8px 10px"
                      }}>
                          <div style={{ fontSize: 7, fontWeight: 700, letterSpacing: "0.10em", textTransform: "uppercase", color: "#B83A1F", marginBottom: 5 }}>Weak signal</div>
                          <div style={{ fontSize: 10, lineHeight: 1.55, color: "#1A1A1A" }}>{dim.weak}</div>
                        </div>
                      }
                    </div>
                  </div>);

              })}
            </div>

            {/* Notes + Priority */}
            <div style={{ display: "flex", gap: 10, marginBottom: 8 }}>
              <div style={{ flex: 1, background: "#FDF6EE", border: "1px solid #E8D8C4", borderRadius: 4, padding: "14px 16px" }}>
                <div style={{ fontSize: 7, fontWeight: 700, letterSpacing: "0.12em", textTransform: "uppercase", color: "#985830", marginBottom: 6 }}>Overall notes</div>
                <div style={{ fontSize: 11, lineHeight: 1.65, color: "#1A1A1A" }}>{c.notes}</div>
              </div>
              <div style={{ flex: 1, background: "#fff", border: "1px solid #E8D8C4", borderLeft: "3px solid #985830", borderRadius: "0 4px 4px 0", padding: "14px 16px" }}>
                <div style={{ fontSize: 7, fontWeight: 700, letterSpacing: "0.12em", textTransform: "uppercase", color: "#985830", marginBottom: 6 }}>Priority fix</div>
                <div style={{ fontSize: 11, lineHeight: 1.65, color: "#1A1A1A", fontWeight: 500 }}>{c.priority}</div>
              </div>
            </div>
          </div>);

      })}

      {/* Footer line */}
      <div style={{ margin: "28px 44px 0", paddingTop: 12, borderTop: "1px solid #E8D8C4", display: "flex", justifyContent: "space-between", fontSize: 9, color: "#6B6B6B" }}>
        <span>End of report · 27 May 2026</span>
        <span>phillips-uk.com</span>
      </div>
      <div style={{ height: 24 }}></div>
    </div>);

}

/* =============== APP =============== */
function App() {
  const [loading, setLoading] = React.useState(true);
  React.useEffect(() => {
    const t = setTimeout(() => setLoading(false), 700);
    return () => clearTimeout(t);
  }, []);

  if (loading) return <LoadingState />;

  return (
    <div>
      <Nav />
      <ReportHeader />
      <RankedSummary />
      <Breakdowns />
      <RunYourOwn />
      <FooterCrossSell />
      <Footer />
      <PdfLayout />
    </div>);

}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
