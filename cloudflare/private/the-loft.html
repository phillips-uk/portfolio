<html lang="en-GB">
<head>

<meta name="mobile-web-app-capable" content="yes">

<style>
/* The Loft booking app prototype, served privately at /the-loft by invite link.
   A gentlemen's barbershop: warm bone paper, black, and one brass accent. Manrope throughout: heavy for names, headings
   and numbers, tracked capitals for labels. Lots of space.
   Desktop and tablet: the app inside a phone frame, scaled to fit. Phones: the app full screen, like a native app. */
:root {
  color-scheme: light;
  --stage: #ECE7DF;
  --paper: #FBF9F6;
  --mist: #F3EFE9;
  --mist-2: #E8E2D8;
  --ink: #151515;
  --ink-2: #2E2E2E;
  --muted: #6E6960;
  --faint: #A29C92;
  --line: #E4DDD2;
  --stone: #B8AFA1;
  --brass: #A6834C;        /* the one accent: hairlines, the active tab, the owner's ring, stars */
  --brass-dk: #7A5C30;     /* brass for text */
  --brass-soft: #F3EBDD;
  --good: #3B6A4C; --good-soft: #E6EEE7;
  --bad: #8E2E24; --bad-soft: #F4E3DF;
  --f-display: 'Manrope', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --f-sans: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 12px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
* { -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--stage); color: var(--ink); font-family: var(--f-sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; font-family: var(--f-display); font-weight: 800; letter-spacing: -.03em; }
p { margin: 0; }
.lbl { font-family: var(--f-sans); font-size: 10.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); }
.lbl.gold { color: var(--brass-dk); }

/* The stage */
.stage { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 28px 16px; box-sizing: border-box; }
.device-wrap { width: 415px; height: 874px; flex: none; }
.device { position: relative; width: 415px; height: 874px; padding: 11px; border-radius: 68px; background: #1C1C1E; box-shadow: inset 0 0 0 1.5px #3A3A3C, inset 0 0 0 4px #0E0E0F, 0 60px 100px -50px rgba(21,21,21,.55), 0 30px 60px -30px rgba(21,21,21,.3); transform-origin: top left; }
.device .hw { position: absolute; width: 4px; background: #2C2C2E; border-radius: 2px; }
.device .hw-action { left: -3px; top: 150px; height: 34px; } .device .hw-up { left: -3px; top: 212px; height: 64px; } .device .hw-down { left: -3px; top: 290px; height: 64px; } .device .hw-power { right: -3px; top: 246px; height: 104px; }
.statusbar { flex: none; height: 54px; position: relative; z-index: 80; display: flex; align-items: center; justify-content: space-between; padding: 4px 32px 0 44px; background: var(--paper); font-size: 16px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.statusbar .island { position: absolute; left: 50%; top: 11px; width: 124px; height: 36px; margin-left: -62px; border-radius: 20px; background: #000; }
.statusbar .sb-icons { display: flex; align-items: center; gap: 6px; } .statusbar svg { display: block; }
.homebar { position: absolute; left: 50%; bottom: 8px; width: 136px; height: 5px; margin-left: -68px; border-radius: 3px; background: var(--ink); z-index: 70; pointer-events: none; }
.caption { margin: 0; font-size: 12.5px; color: var(--muted); text-align: center; max-width: 64ch; }
.caption b { color: var(--ink); }
.brief { display: flex; flex-direction: column; gap: 22px; }
.brief .by { font-size: 10.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.brief .by b { color: var(--ink); }
.brief h1 { font-size: 46px; line-height: 1.02; letter-spacing: -.04em; }
.brief .lede { color: var(--muted); font-size: 15.5px; max-width: 34ch; }
.ways { display: grid; gap: 2px; }
.way { display: flex; gap: 14px; align-items: center; text-align: left; border: 0; background: transparent; border-radius: 10px; padding: 10px 12px; margin: 0 -12px; transition: background-color .15s; }
.way:hover { background: var(--mist-2); }
.way.on { background: var(--paper); }
.way b { display: block; font-size: 14.5px; font-weight: 700; }
.way span.t { display: block; font-size: 13px; color: var(--muted); }
.try { display: grid; gap: 10px; }
.try ol { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 13.5px; }
.try ol button { border: 0; background: none; padding: 0; color: var(--ink); font-weight: 700; text-decoration: underline; text-decoration-color: var(--brass); text-underline-offset: 4px; }
.try ol button:hover { text-decoration-color: var(--ink); }
.lists { display: grid; gap: 16px; }
.lists ul { margin: 8px 0 0; padding: 0; list-style: none; columns: 2; column-gap: 20px; font-size: 13px; color: var(--muted); }
.lists li { break-inside: avoid; margin-bottom: 4px; }
.small { font-size: 12.5px; color: var(--faint); }

/* The phone */
.phone { --sab: 22px; --sat: 54px; position: relative; width: 100%; height: 100%; border-radius: 57px; overflow: hidden; background: var(--paper); display: flex; flex-direction: column; }
.screen { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.screen::-webkit-scrollbar { display: none; }
.topbar { position: relative; z-index: 20; background: var(--paper); padding: 6px 18px 10px; display: flex; align-items: center; gap: 10px; }
.topbar .proto { display: none; font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }
.topbar .about { display: inline-flex; border: 0; background: var(--mist); border-radius: 8px; padding: 8px 12px; font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.viewseg { margin-left: auto; display: inline-flex; background: var(--mist); border-radius: 9px; padding: 3px; gap: 2px; }
.viewseg button { border: 0; background: transparent; color: var(--muted); border-radius: 6px; padding: 7px 12px; font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; transition: background-color .15s, color .15s; }
.viewseg button.on { background: var(--ink); color: var(--paper); }
.tabbar { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border-top: 1px solid var(--line); background: var(--paper); padding-bottom: var(--sab); }
.tabbar button { border: 0; background: none; padding: 12px 2px 13px; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 9.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); position: relative; white-space: nowrap; }
.tabbar button svg { width: 21px; height: 21px; }
.tabbar button.on { color: var(--ink); }
.tabbar button.on::after { content: ""; position: absolute; top: -1px; left: 50%; transform: translateX(-50%); width: 22px; height: 2px; background: var(--brass); }
.pad { padding: 14px 22px 44px; display: flex; flex-direction: column; gap: 38px; }

/* The wordmark */
.mark { display: flex; flex-direction: column; gap: 12px; }
.mark .wm { font-family: var(--f-display); font-weight: 800; font-size: 52px; line-height: .95; letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; }
.mark .sub { display: flex; align-items: center; gap: 12px; font-size: 10px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
.mark .sub::before { content: ""; width: 28px; height: 1px; background: var(--brass); }

/* Monograms: the barber's initial; the owner's has a brass ring */
.ball { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--ink); color: var(--paper); }
.ball i { font-style: normal; font-family: var(--f-display); font-weight: 800; font-size: 17px; line-height: 1; }
.ball.own { outline: 1.25px solid var(--brass); outline-offset: 2.5px; }
.ball.lg { width: 72px; height: 72px; } .ball.lg i { font-size: 26px; }
.ball.sm { width: 34px; height: 34px; } .ball.sm i { font-size: 13px; } .ball.sm.own { outline-offset: 2px; }
.ball.empty { background: transparent; color: var(--faint); box-shadow: inset 0 0 0 1px var(--stone); } .ball.empty i { font-size: 12px; }
.ball.cust { background: var(--mist-2); color: var(--muted); } .ball.cust svg { width: 17px; height: 17px; }
.ball.ph { background: var(--mist-2); } .ball img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
.ball.xl { width: 96px; height: 96px; } .ball.xl i { font-size: 34px; }

/* Buttons */
.btn { border: 0; background: var(--mist); color: var(--ink); border-radius: 8px; padding: 11px 18px; font-weight: 700; font-size: 13.5px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background-color .15s, transform .1s; }
.btn:hover { background: var(--mist-2); }
.btn:active { transform: scale(.985); }
.btn svg { width: 16px; height: 16px; }
.btn.primary, .btn.ink { background: var(--ink); color: var(--paper); } .btn.primary:hover, .btn.ink:hover { background: var(--ink-2); }
.btn.big { padding: 19px 22px; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; width: 100%; }
.btn.sm { padding: 7px 11px; font-size: 12.5px; border-radius: 6px; }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 1px var(--line); } .btn.ghost:hover { background: var(--mist); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.link { border: 0; background: none; padding: 0 0 2px; color: var(--ink); font-weight: 700; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; border-bottom: 1px solid var(--brass); white-space: nowrap; }

/* Customer home */
.hero { padding: 36px 22px 6px; display: flex; flex-direction: column; gap: 28px; }
.hero .tag { font-size: 17px; font-weight: 600; line-height: 1.45; color: var(--ink-2); max-width: 28ch; }
.nextfree { display: flex; align-items: center; gap: 12px; padding: 2px 0; }
.nextfree .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brass); box-shadow: 0 0 0 4px var(--brass-soft); flex: none; }
.nextfree div { flex: 1; min-width: 0; font-size: 13.5px; color: var(--muted); }
.nextfree div b { color: var(--ink); font-weight: 600; }
.sec { display: flex; flex-direction: column; gap: 16px; }
.sec-h h2 { font-size: 24px; line-height: 1.15; }
.sec-h p { font-size: 13.5px; color: var(--muted); margin-top: 4px; }
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: 76%; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -22px; padding: 0 22px 4px; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.bcard { scroll-snap-align: start; text-align: left; border: 0; background: var(--mist); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 16px; transition: background-color .15s; }
.bcard:hover { background: var(--mist-2); }
.bhead { display: flex; align-items: center; gap: 14px; }
.bhead b { display: block; font-family: var(--f-display); font-size: 19px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
.bhead small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.does { font-size: 13.5px; color: var(--muted); }
.bfoot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: 12.5px; color: var(--muted); padding-top: 14px; border-top: 1px solid var(--line); }
.bfoot span { white-space: nowrap; }
.bfoot b { color: var(--ink); font-weight: 600; }
.perks { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 16px; }
.perk { display: flex; gap: 12px; align-items: flex-start; }
.perk .pi { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink); }
.perk .pi svg { width: 18px; height: 18px; }
.perk b { display: block; font-size: 14px; font-weight: 700; } .perk small { display: block; font-size: 12.5px; color: var(--muted); }
.events { display: grid; }
.event { display: flex; gap: 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.event:first-child { padding-top: 0; }
.event:last-child { border-bottom: 0; }
.event .d { width: 54px; height: 58px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; flex: none; }
.event .d small { font-size: 9.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--brass-dk); line-height: 1; }
.event .d b { font-family: var(--f-display); font-weight: 800; font-size: 21px; letter-spacing: -.02em; line-height: 1; margin-top: 4px; }
.event .t { display: block; font-weight: 700; font-size: 14.5px; } .event .n { font-size: 13.5px; color: var(--muted); }

/* Alerts: a slot opened, rate your cut */
.alert { background: var(--brass-soft); border-radius: var(--r); padding: 18px; display: grid; gap: 10px; }
.alert b { font-weight: 800; font-size: 16px; letter-spacing: -.01em; }
.alert p { font-size: 13.5px; color: var(--muted); }
.stars { display: flex; gap: 6px; }
.star { border: 0; background: var(--paper); width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; color: var(--stone); transition: color .12s; }
.star svg { width: 22px; height: 22px; }
.star.on, .star:hover { color: var(--brass); }

/* Booking flow */
.crumb { display: flex; align-items: center; gap: 16px; }
.back { border: 0; background: var(--mist); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.back:hover { background: var(--mist-2); }
.back svg { width: 18px; height: 18px; }
.steps { display: flex; gap: 6px; flex: 1; }
.steps i { flex: 1; height: 2px; background: var(--mist-2); }
.steps i.on { background: var(--ink); }
.profile { display: flex; gap: 20px; align-items: center; }
.profile h1 { font-size: 38px; line-height: 1; letter-spacing: -.04em; }
.profile p { margin-top: 6px; color: var(--muted); font-size: 13.5px; }
.work { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.wph { position: relative; aspect-ratio: 4 / 5; border-radius: 10px; overflow: hidden; background: var(--mist-2); border: 0; padding: 0; display: block; box-shadow: var(--lift); }
.wph img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
.wph:hover img { transform: scale(1.06); }
.wph .x { position: absolute; top: 5px; right: 5px; background: rgba(251,249,246,.92); }
.wph.add { display: grid; place-items: center; align-content: center; gap: 4px; background: transparent; box-shadow: none; border: 1.5px dashed var(--stone); color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
.wph.add svg { width: 20px; height: 20px; }
.svcs { display: flex; flex-direction: column; }
.svc { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 16px 12px; margin: 0 -12px; transition: background-color .12s; }
.svc:last-child { border-bottom: 0; }
.svc:hover { background: var(--mist); border-radius: 10px; }
.svc.on { background: var(--mist); border-radius: 10px; }
.svc b { display: block; font-size: 15px; font-weight: 600; } .svc small { color: var(--muted); font-size: 12.5px; }
.svc .p { font-family: var(--f-display); font-weight: 800; font-size: 17px; letter-spacing: -.01em; line-height: 1; }
.days { display: grid; grid-auto-flow: column; grid-auto-columns: 60px; gap: 8px; overflow-x: auto; margin: 0 -22px; padding: 2px 22px 6px; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.day { border: 0; background: var(--mist); border-radius: 10px; padding: 11px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; transition: background-color .12s; }
.day:hover { background: var(--mist-2); }
.day small { font-size: 9.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.day b { font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: -.02em; line-height: 1.2; }
.day em { font-style: normal; font-size: 10.5px; color: var(--faint); font-weight: 600; white-space: nowrap; }
.day em.md { color: var(--brass-dk); font-weight: 700; }
.day.off b { color: var(--faint); }
.day.on { background: var(--ink); color: var(--paper); } .day.on b { color: var(--paper); } .day.on small, .day.on em { color: rgba(251,249,246,.65); } .day.on em.md { color: #D9BE8E; }
.slots h3 { font-family: var(--f-sans); font-size: 10.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); margin-bottom: 10px; }
.slotgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.slot { border: 0; background: var(--mist); border-radius: 8px; padding: 11px 0; font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; transition: background-color .12s; }
.slot:hover { background: var(--mist-2); }
.slot.on { background: var(--ink); color: var(--paper); }
.none { background: var(--mist); border-radius: var(--r); padding: 26px 20px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.none b { color: var(--ink); font-size: 15px; }
.summary { display: grid; gap: 12px; }
.summary .row { display: flex; justify-content: space-between; gap: 12px; font-size: 14.5px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.summary .row:last-child { border-bottom: 0; padding-bottom: 0; }
.summary .row span { color: var(--muted); }
.summary .row b { text-align: right; font-weight: 600; }
.summary .row s { color: var(--faint); font-weight: 500; margin-right: 6px; }
.pill { display: inline-flex; align-items: center; gap: 10px; background: var(--mist); border-radius: 10px; padding: 6px 14px 6px 6px; font-size: 13.5px; font-weight: 600; align-self: flex-start; }
.field { display: flex; flex-direction: column; gap: 7px; }
.field label, .field .fl { font-size: 10.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.inp { border: 0; background: var(--mist); border-radius: 8px; padding: 14px 15px; font-size: 15px; width: 100%; min-width: 0; }
.inp:focus { outline: 1.5px solid var(--ink); outline-offset: 0; background: var(--paper); }
textarea.inp { resize: vertical; min-height: 84px; line-height: 1.45; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--muted); cursor: pointer; }
.check input { accent-color: var(--ink); width: 18px; height: 18px; margin: 1px 0 0; flex: none; }
.paybox { border-radius: var(--r); padding: 16px; display: flex; gap: 14px; align-items: flex-start; background: var(--mist); }
.paybox svg { width: 21px; height: 21px; flex: none; color: var(--muted); }
.paybox.now { background: var(--brass-soft); } .paybox.now svg { color: var(--brass-dk); }
.paybox b { display: block; font-weight: 700; }
.paybox p { margin-top: 2px; font-size: 13.5px; color: var(--muted); }
.paybox .link { margin-top: 8px; display: inline-block; }
.pchips { display: flex; flex-wrap: wrap; gap: 8px; }
.pchip { border: 0; background: var(--mist); border-radius: 8px; padding: 9px 12px; font-size: 13px; font-weight: 600; }
.pchip.on { background: var(--ink); color: var(--paper); }
.pchip[disabled] { opacity: .45; cursor: not-allowed; }
.err { color: var(--bad); font-size: 13.5px; font-weight: 600; }

/* The confirmation card */
.done-head h1 { font-size: 36px; line-height: 1.05; letter-spacing: -.04em; }
.done-head p { color: var(--muted); margin-top: 8px; }
.ticket { border-radius: 14px; background: var(--mist); overflow: hidden; }
.ticket .tt { padding: 22px 22px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.ticket .tt .mark .wm { font-size: 18px; }
.ticket .tt .mark .sub { display: none; }
.ticket .tt .ref { font-size: 9.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); text-align: right; }
.ticket .tt .ref b { display: block; color: var(--ink); font-size: 14px; letter-spacing: .06em; font-variant-numeric: tabular-nums; margin-top: 2px; }
.ticket .tb { padding: 28px 22px 22px; display: grid; gap: 18px; }
.ticket .when { font-family: var(--f-display); font-weight: 800; font-size: 30px; letter-spacing: -.035em; line-height: 1.1; }
.ticket .cut { height: 0; border-top: 1px dashed var(--stone); margin: 0 18px; position: relative; }
.ticket .cut::before, .ticket .cut::after { content: ""; position: absolute; top: -11px; width: 22px; height: 22px; border-radius: 50%; background: var(--paper); }
.ticket .cut::before { left: -30px; } .ticket .cut::after { right: -30px; }
.ticket .tf { padding: 18px 22px 22px; display: grid; gap: 6px; font-size: 13.5px; color: var(--muted); }
.ticket .tf b { color: var(--ink); font-weight: 700; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 16px; font-size: 14px; }
.kv span { color: var(--muted); } .kv b { text-align: right; font-weight: 600; }

/* Lists */
.list { display: flex; flex-direction: column; }
.item { padding: 16px 0; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.item:last-child { border-bottom: 0; }
.item .top { display: flex; gap: 14px; align-items: flex-start; }
.item .time { font-family: var(--f-display); font-weight: 800; font-size: 18px; letter-spacing: -.02em; line-height: 1.1; min-width: 54px; font-variant-numeric: tabular-nums; }
.item .time small { display: block; font-family: var(--f-sans); font-size: 11.5px; font-weight: 500; color: var(--faint); margin-top: 5px; letter-spacing: 0; }
.item .what { flex: 1; min-width: 0; }
.item .what b { display: block; font-weight: 600; } .item .what span { font-size: 13px; color: var(--muted); }
.item .price { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.item .side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.item .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.ex { display: block; font-size: 12px; color: var(--brass-dk); font-weight: 600; margin-top: 3px; }
.chip { display: inline-block; font-size: 9.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; padding: 4px 8px; border-radius: 4px; white-space: nowrap; }
.chip.booked { box-shadow: inset 0 0 0 1px var(--ink); color: var(--ink); } .chip.done, .chip.paid { background: var(--good-soft); color: var(--good); }
.chip.noshow { background: var(--bad-soft); color: var(--bad); } .chip.cancelled { background: var(--mist); color: var(--faint); }
.chip.free, .chip.gold { background: var(--brass-soft); color: var(--brass-dk); } .chip.plain, .chip.src { background: var(--mist); color: var(--muted); }
.confirm { background: var(--bad-soft); border-radius: 10px; padding: 12px 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; font-size: 13.5px; font-weight: 600; color: var(--bad); }
.rowbtns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chipbtn { border: 0; background: none; padding: 0; }

/* Barber and owner screens */
.who { display: flex; align-items: center; gap: 16px; }
.who .grow { flex: 1; min-width: 0; }
.who small { display: block; font-size: 12.5px; color: var(--muted); }
.who small.lbl { font-size: 9.5px; color: var(--faint); }
.who select { border: 0; background: transparent; font-family: var(--f-display); font-weight: 800; font-size: 24px; letter-spacing: -.03em; line-height: 1.2; padding: 0; max-width: 100%; }
.who .name { display: block; font-family: var(--f-display); font-weight: 800; font-size: 24px; letter-spacing: -.03em; line-height: 1.2; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--mist); border-radius: var(--r); padding: 14px 14px 12px; }
.stat small { display: block; font-size: 9.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.stat b { display: block; font-family: var(--f-display); font-weight: 800; font-size: 26px; letter-spacing: -.03em; line-height: 1.2; margin-top: 4px; font-variant-numeric: tabular-nums; }
.stat.hi { background: var(--paper); box-shadow: inset 0 0 0 1px var(--ink); }
.lede2 { font-size: 14px; color: var(--muted); }
.lede2 b { color: var(--ink); font-weight: 700; }
.callout { display: flex; gap: 12px; align-items: center; background: var(--brass-soft); border-radius: var(--r); padding: 15px 16px; font-size: 14px; border: 0; text-align: left; width: 100%; }
.callout b { font-weight: 700; }
.callout svg { width: 17px; height: 17px; }
.hours { display: flex; flex-direction: column; }
.hrow { padding: 13px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 46px auto minmax(0, 1fr); gap: 12px; align-items: center; }
.hrow:last-child { border-bottom: 0; }
.hrow .dn { font-size: 10.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
.hrow .times { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; font-size: 13px; color: var(--muted); }
.hrow select, .orow2 select { border: 0; background: var(--mist); border-radius: 6px; padding: 7px 8px; font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.hrow .brk { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; }
.hrow .brk input { accent-color: var(--ink); }
.hrow.closed { opacity: .55; }
.sw { position: relative; width: 44px; height: 26px; flex: none; }
.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.sw span { position: absolute; inset: 0; border-radius: 999px; background: var(--mist-2); transition: background-color .15s; pointer-events: none; }
.sw span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--paper); box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .15s; }
.sw input:checked + span { background: var(--ink); } .sw input:checked + span::after { transform: translateX(18px); }
.sw input:focus-visible + span { outline: 1.5px solid var(--ink); outline-offset: 2px; }
.trow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 600; }
.trow:last-child { border-bottom: 0; }
.trow small { display: block; font-size: 12.5px; color: var(--muted); font-weight: 500; }
.orow2 { padding: 15px 0; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.orow2:last-child { border-bottom: 0; }
.orow2 .t { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.orow2 .t b { font-weight: 700; font-size: 14.5px; }
.orow2 .d { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.orow2 .money { width: 92px; }
.menu-row { padding: 12px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 32px; gap: 8px; align-items: center; }
.menu-row:last-child { border-bottom: 0; }
.menu-row .inp { padding: 10px 12px; font-size: 14px; }
.menu-row .nm { grid-column: 1 / 3; font-weight: 600; }
.menu-row .x { grid-column: 3; grid-row: 1; }
.money { display: flex; align-items: center; gap: 4px; background: var(--mist); border-radius: 8px; padding: 0 12px; }
.money span { color: var(--muted); font-weight: 600; font-size: 14px; }
.money input { border: 0; background: transparent; padding: 10px 0; width: 100%; min-width: 0; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.money input:focus { outline: none; }
.money:focus-within { outline: 1.5px solid var(--ink); background: var(--paper); }
.x { border: 0; background: none; color: var(--faint); width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.x:hover { color: var(--bad); background: var(--bad-soft); }
.x svg { width: 15px; height: 15px; }
.share { display: flex; gap: 10px; align-items: center; background: var(--mist); border-radius: 10px; padding: 12px 12px 12px 16px; }
.share svg { width: 17px; height: 17px; color: var(--muted); flex: none; }
.share code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; flex: 1; min-width: 0; overflow-wrap: anywhere; color: var(--muted); }
.floor { overflow-x: auto; }
.floor .lane { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; align-items: center; margin-bottom: 10px; min-width: 280px; }
.floor .lane b { font-size: 13.5px; font-weight: 600; display: block; }
.floor .lane small { display: block; font-size: 11px; color: var(--faint); }
.track { position: relative; height: 28px; background: var(--mist); border-radius: 6px; overflow: hidden; }
.track .out { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, var(--mist-2) 0 2px, transparent 2px 7px); }
.track .bk { position: absolute; top: 5px; bottom: 5px; border-radius: 3px; background: var(--ink); box-shadow: 0 0 0 1.5px var(--mist); }
.track .bk.done { background: var(--stone); } .track .bk.noshow { background: var(--bad); }
.axis { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; min-width: 280px; }
.axis div { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.key { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: 8px; }
.key i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.util { display: grid; gap: 14px; }
.util .u { display: grid; grid-template-columns: 70px minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: 13.5px; }
.util .bar { height: 4px; background: var(--mist-2); overflow: hidden; }
.util .bar i { display: block; height: 100%; background: var(--ink); }
.util .u b { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.chair { padding: 16px 0; border-bottom: 1px solid var(--line); display: grid; gap: 12px; }
.chair:last-child { border-bottom: 0; }
.chair .top { display: flex; align-items: center; gap: 14px; }
.chair .grow { flex: 1; min-width: 0; }
.chair .grow b { display: block; font-family: var(--f-display); font-weight: 800; font-size: 16.5px; letter-spacing: -.01em; line-height: 1.25; } .chair .grow small { color: var(--muted); font-size: 12.5px; }
.invite { display: flex; gap: 8px; } .invite .inp { padding: 11px 13px; font-size: 14px; }
.seg { display: flex; flex-direction: column; gap: 8px; }
.opt { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; text-align: left; align-items: start; border: 0; background: var(--mist); border-radius: var(--r); padding: 15px 16px; transition: background-color .12s; }
.opt:hover { background: var(--mist-2); }
.opt .dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--faint); margin-top: 2px; background: var(--paper); }
.opt.on { background: var(--paper); box-shadow: inset 0 0 0 1px var(--ink); } .opt.on .dot { border: 5.5px solid var(--ink); }
.opt b { display: block; font-size: 14.5px; font-weight: 700; } .opt small { display: block; font-size: 13px; color: var(--muted); }
.form2 { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 8px; }
.mseg { display: inline-flex; background: var(--mist); border-radius: 9px; padding: 3px; gap: 2px; align-self: flex-start; }
.mseg button { border: 0; background: transparent; color: var(--muted); border-radius: 6px; padding: 7px 14px; font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.mseg button.on { background: var(--ink); color: var(--paper); }
.rev { padding: 14px 0; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.rev:last-child { border-bottom: 0; }
.rs { display: inline-flex; gap: 2px; color: var(--brass); } .rs svg { width: 14px; height: 14px; } .rs .off { color: var(--mist-2); }
.rev .rt { display: flex; justify-content: space-between; gap: 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
.rev b { font-size: 13.5px; font-weight: 700; color: var(--ink); } .rev p { font-size: 13.5px; color: var(--muted); }
.prod { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.prod:last-child { border-bottom: 0; }
.prod b { display: block; font-weight: 700; } .prod span.m { display: block; font-size: 12.5px; color: var(--muted); }
.prod .chip { margin-top: 4px; }
.stepper { display: inline-flex; align-items: center; gap: 2px; background: var(--mist); border-radius: 8px; padding: 2px; }
.stepper button { border: 0; background: transparent; width: 30px; height: 30px; border-radius: 6px; font-size: 16px; font-weight: 700; line-height: 1; }
.stepper button:hover { background: var(--mist-2); }
.stepper b { min-width: 22px; text-align: center; font-size: 14px; font-variant-numeric: tabular-nums; }

/* Wallet */
.loyal, .offer { background: var(--mist); border-radius: var(--r); padding: 18px; display: grid; gap: 16px; }
.stamps { display: grid; gap: 6px; }
.stamp { aspect-ratio: 1; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--stone); display: grid; place-items: center; color: var(--paper); font-size: 7.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
.stamp svg { width: 55%; height: 55%; }
.stamp.on { background: var(--ink); box-shadow: none; }
.stamp.free { color: var(--brass-dk); box-shadow: inset 0 0 0 1px var(--brass); }
.stamp.free.on { background: var(--brass); color: var(--paper); box-shadow: none; }
.orow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding-top: 14px; border-top: 1px solid var(--line); }
.orow b { display: block; font-weight: 700; font-size: 14.5px; } .orow small { display: block; font-size: 12.5px; color: var(--muted); }
.orow .op { font-weight: 800; font-size: 14px; white-space: nowrap; }
.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 24px; font-weight: 700; letter-spacing: .12em; padding: 18px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--brass); text-align: center; }
.amts { display: flex; gap: 8px; }
.amt-chip { flex: 1; border: 0; background: var(--mist); border-radius: 8px; padding: 14px 0; font-weight: 800; font-size: 16px; }
.amt-chip.on { background: var(--ink); color: var(--paper); }

/* The website preview */
.site-wrap { position: absolute; inset: 0; z-index: 46; background: var(--paper); display: flex; flex-direction: column; padding-top: var(--sat); }
.site-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.site-body { flex: 1; overflow-y: auto; scrollbar-width: none; }
.site-body::-webkit-scrollbar { display: none; }
.srow { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.srow:last-child { border-bottom: 0; }
.srow .grow { flex: 1; min-width: 0; } .srow b { display: block; font-weight: 800; font-size: 16px; } .srow small { font-size: 12.5px; color: var(--muted); }
.plist .pr { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.plist .pr:last-child { border-bottom: 0; }
.plist .pr span { display: block; color: var(--muted); font-size: 12.5px; } .plist .pr b { font-weight: 800; white-space: nowrap; }

/* Toast and sheets */
.toast { position: absolute; left: 18px; right: 18px; bottom: calc(66px + var(--sab)); z-index: 60; background: var(--ink); color: var(--paper); border-radius: 10px; padding: 13px 16px; font-size: 13.5px; font-weight: 600; transform: translateY(12px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
.toast.on { opacity: 1; transform: none; }
.sheet-bg { position: absolute; inset: 0; z-index: 45; background: rgba(21,21,21,.32); display: flex; align-items: flex-end; }
.sheet { width: 100%; max-height: 92%; overflow-y: auto; background: var(--paper); border-radius: 18px 18px 0 0; padding: 30px 22px calc(24px + var(--sab)); display: grid; gap: 14px; text-align: center; }
.sheet.left { text-align: left; }
.sheet h3 { font-size: 22px; }
.sheet p { color: var(--muted); font-size: 13.5px; }
.sheet .preview b { color: var(--ink); }
.sheet .amt { font-family: var(--f-display); font-weight: 800; font-size: 56px; letter-spacing: -.04em; line-height: 1; }
.sheet .acts { display: grid; gap: 8px; margin-top: 8px; }
.tap-ico { justify-self: center; width: 64px; height: 64px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--line); display: grid; place-items: center; }
.tap-ico svg { width: 30px; height: 30px; }
.demo-tag { font-size: 9.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--brass-dk); background: var(--brass-soft); border-radius: 4px; padding: 5px 10px; justify-self: center; }
.sheet.left .demo-tag { justify-self: start; }
.brief-sheet { text-align: left; gap: 22px; }


/* ---------- depth and motion ---------- */
:root { --lift: 0 1px 2px rgba(21,21,21,.04), 0 10px 24px -18px rgba(21,21,21,.3); --lift-2: 0 2px 4px rgba(21,21,21,.05), 0 24px 44px -24px rgba(21,21,21,.42); }
.bcard, .loyal, .offer, .stat, .ticket, .alert, .callout, .paybox, .opt, .soc { box-shadow: var(--lift); }
.stat.hi, .opt.on { box-shadow: inset 0 0 0 1px var(--ink), var(--lift); }
.event .d { box-shadow: inset 0 0 0 1px var(--line), var(--lift); }
.bcard { transition: background-color .15s, box-shadow .25s; }
.bcard:hover { box-shadow: var(--lift-2); }
.btn.primary { box-shadow: 0 10px 20px -12px rgba(21,21,21,.55); }
.btn.big.primary { box-shadow: 0 18px 30px -16px rgba(21,21,21,.6); }
.bcard:active, .slot:active, .day:active, .svc:active, .fchip:active { scale: .97; }
.rv { opacity: 0; translate: 0 22px; transition: opacity .55s ease, translate .75s cubic-bezier(.2,.75,.2,1); transition-delay: var(--d, 0ms); }
.rv.in { opacity: 1; translate: none; }
.cover { position: relative; height: 250px; overflow: hidden; background: #1C1C1E; }
.cover-img { position: absolute; left: 0; right: 0; top: -30px; bottom: -30px; background-size: cover; background-position: center 45%; transform: scale(1.06); will-change: transform; }
.cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,21,21,0) 45%, rgba(21,21,21,.35)); }
.hero.lift { position: relative; z-index: 1; margin-top: -30px; padding-top: 32px; background: var(--paper); border-radius: 26px 26px 0 0; box-shadow: 0 -18px 30px -24px rgba(21,21,21,.5); }
.minibar { position: sticky; top: 0; z-index: 6; height: 52px; margin-bottom: -52px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px 0 22px; background: rgba(251,249,246,.9); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); translate: 0 -100%; opacity: 0; transition: translate .35s cubic-bezier(.2,.8,.2,1), opacity .25s; pointer-events: none; }
.minibar.show { translate: none; opacity: 1; pointer-events: auto; }
.minibar .wm-s { font-weight: 800; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; }
.rail > .bcard { transform-origin: 50% 50%; transition: transform .25s ease-out, box-shadow .25s, background-color .15s, opacity .55s ease var(--d, 0ms), translate .75s cubic-bezier(.2,.75,.2,1) var(--d, 0ms); }
@keyframes flipIn { from { opacity: 0; transform: perspective(900px) rotateX(-75deg) translateY(30px); } to { opacity: 1; transform: none; } }
.ticket { animation: flipIn .9s cubic-bezier(.2,.8,.2,1) .15s both; transform-origin: 50% 0; }
@keyframes stampIn { from { scale: .2; opacity: 0; } 70% { scale: 1.14; opacity: 1; } to { scale: 1; opacity: 1; } }
.loyal.in .stamp.on { animation: stampIn .45s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--k, 0) * 70ms + 250ms); }
@keyframes sheetUp { from { translate: 0 100%; } to { translate: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideIn { from { translate: 100% 0; } to { translate: none; } }
@keyframes zoomIn { from { scale: .86; opacity: 0; } to { scale: 1; opacity: 1; } }
.sheet-bg { animation: fadeIn .25s ease both; }
.sheet { animation: sheetUp .42s cubic-bezier(.2,.8,.2,1) both; }
.site-wrap { animation: slideIn .45s cubic-bezier(.2,.8,.2,1) both; }
.lightbox { align-items: center; justify-content: center; padding: 22px; background: rgba(21,21,21,.82); cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 78%; border-radius: 14px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.6); animation: zoomIn .35s cubic-bezier(.2,.8,.2,1) both; }

/* ---------- barber profile: photo, socials, work ---------- */
.socials { display: flex; gap: 8px; flex-wrap: wrap; }
.soc { display: inline-flex; align-items: center; gap: 10px; border: 0; background: var(--mist); border-radius: 12px; padding: 9px 14px 9px 10px; text-align: left; transition: background-color .15s; }
.soc:hover { background: var(--mist-2); }
.soc svg { width: 22px; height: 22px; flex: none; }
.soc span { font-weight: 700; font-size: 13.5px; line-height: 1.25; }
.soc small { display: block; font-size: 9.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.pf-photo { display: flex; align-items: center; gap: 18px; }
.pf-photo .rowbtns { flex-direction: column; align-items: flex-start; }
.handle { display: flex; align-items: center; gap: 2px; background: var(--mist); border-radius: 8px; padding: 0 14px; }
.handle span { color: var(--muted); font-weight: 700; }
.handle input { border: 0; background: transparent; padding: 14px 0; width: 100%; min-width: 0; font-size: 15px; }
.handle input:focus { outline: none; }
.handle:focus-within { outline: 1.5px solid var(--ink); background: var(--paper); }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
label.btn { cursor: pointer; }

/* ---------- Read me ---------- */
.bgroup { display: grid; gap: 12px; }
.bens { display: grid; gap: 12px; }
.ben { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; }
.ben .bi { width: 34px; height: 34px; border-radius: 50%; background: var(--brass-soft); color: var(--brass-dk); display: grid; place-items: center; }
.ben .bi svg { width: 17px; height: 17px; }
.ben b { display: block; font-weight: 800; font-size: 14.5px; letter-spacing: -.01em; }
.ben span { display: block; font-size: 13.5px; color: var(--muted); }

/* ---------- the 3D stage on desktop and tablet ---------- */
.backdrop { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.backdrop .bd-word { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -54%); font-weight: 800; font-size: min(24vw, 400px); line-height: 1; letter-spacing: -.01em; text-transform: uppercase; white-space: nowrap; color: transparent; -webkit-text-stroke: 1.5px rgba(21,21,21,.07); }
.backdrop .glow { position: absolute; width: 560px; height: 560px; border-radius: 50%; filter: blur(90px); opacity: .6; animation: drift 18s ease-in-out infinite alternate; }
.backdrop .g1 { background: #E6CFA6; left: 6%; top: -8%; }
.backdrop .g2 { background: #D9CCBE; right: 4%; bottom: -12%; animation-delay: -9s; }
@keyframes drift { to { translate: 70px 40px; } }
.stage { position: relative; z-index: 1; }
.scene { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 56px; width: min(1280px, 100%); }
.chips { display: flex; flex-direction: column; gap: 22px; }
.chips-l { align-items: flex-end; } .chips-r { align-items: flex-start; }
.chips-l .fchip:nth-child(2) { margin-right: 48px; } .chips-r .fchip:nth-child(2) { margin-left: 48px; }
.fchip { display: flex; gap: 12px; align-items: center; width: 252px; text-align: left; border: 0; background: rgba(251,249,246,.86); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-radius: 16px; padding: 14px 16px; box-shadow: var(--lift-2); color: var(--ink); opacity: 0; animation: chipIn .8s cubic-bezier(.2,.8,.2,1) both, bob 6s ease-in-out infinite; animation-delay: var(--cd, .6s), calc(var(--cd, .6s) + .8s); transition: box-shadow .2s, background-color .2s; }
.fchip:hover { background: var(--paper); box-shadow: 0 2px 4px rgba(21,21,21,.06), 0 30px 50px -24px rgba(21,21,21,.5); }
.fchip .ci { width: 38px; height: 38px; flex: none; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; }
.fchip .ci svg { width: 18px; height: 18px; }
.fchip b { display: block; font-size: 13.5px; font-weight: 800; letter-spacing: -.01em; }
.fchip span.t { display: block; font-size: 12px; color: var(--muted); line-height: 1.35; }
@keyframes chipIn { from { opacity: 0; translate: 0 26px; } to { opacity: 1; translate: none; } }
@keyframes bob { 50% { translate: 0 -7px; } }
.device-wrap { position: relative; perspective: 2400px; }
.tilt { position: relative; width: 100%; height: 100%; transform-origin: 50% 50%; will-change: transform; animation: rise 1.1s cubic-bezier(.2,.8,.2,1) both, bob 8s ease-in-out 1.4s infinite; }
.tilt.hold { animation-play-state: paused, paused; }
@keyframes rise { from { opacity: 0; translate: 0 70px; } to { opacity: 1; translate: none; } }
.device::after { content: ""; position: absolute; inset: 0; border-radius: 68px; pointer-events: none; z-index: 95; background: linear-gradient(110deg, rgba(255,255,255,0) 35%, rgba(255,255,255,.13) 48%, rgba(255,255,255,0) 62%); background-size: 260% 100%; background-position: var(--gx, 50%) 0; transition: opacity .4s; }
.tilt.flat .device::after { opacity: 0; }
.ground { position: absolute; left: 10%; right: 10%; bottom: -44px; height: 46px; border-radius: 50%; background: radial-gradient(closest-side, rgba(21,21,21,.3), rgba(21,21,21,0)); filter: blur(4px); pointer-events: none; }
@media (max-width: 1180px) { .chips { display: none; } .scene { grid-template-columns: auto; justify-content: center; } }

/* A real phone: no frame, the app fills the screen and behaves like a native app */
@media (max-width: 600px), (pointer: coarse) and (max-height: 500px) {
  html, body { overflow: hidden; overscroll-behavior: none; }
  body { background: var(--paper); }
  .stage { display: block; height: 100%; min-height: 0; padding: 0; }
  .device-wrap { width: 100% !important; height: 100% !important; }
  .device { width: 100%; height: 100vh; height: 100dvh; padding: 0; border-radius: 0; background: var(--paper); box-shadow: none; transform: none !important; }
  .device .hw, .statusbar, .homebar, .caption, .backdrop, .chips, .ground { display: none; }
  .scene { display: block; width: 100%; height: 100%; }
  .tilt { transform: none !important; translate: none !important; animation: none !important; }
  .device::after { display: none; }
  .phone { --sab: env(safe-area-inset-bottom, 0px); --sat: env(safe-area-inset-top, 0px); border-radius: 0; }
  .phone .topbar { padding-top: max(12px, env(safe-area-inset-top, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
  .pad, .hero { padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); }
  .screen, .site-body, .sheet { overscroll-behavior: contain; }
  button, .tabbar, .topbar, .day, .slot { -webkit-user-select: none; user-select: none; }
  input, select, textarea { font-size: 16px !important; } /* stops iOS zooming into a field */

@media (max-width: 380px) {
  .viewseg button { padding: 7px 9px; letter-spacing: .1em; }
  .slotgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .mark .wm { font-size: 46px; }
  .tabbar button { font-size: 9px; letter-spacing: .06em; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

      S.bookings.push(x); save(); U.last = x.id; go({ c: 'done' });
    }
    if (!q.now) { finish(); return; }
    openPay({ title: 'Pay ' + b.name, amount: q.now, desc: (S.shop.pay === 'deposit' ? 'Deposit for ' + esc(s.name) + ', ' + esc(dayLabel(U.f.date)) + ' at ' + hm(U.f.time) + '. ' + gbp(s.price - q.now) + ' left to pay in the chair.' : esc(s.name) + ', ' + esc(dayLabel(U.f.date)) + ' at ' + hm(U.f.time) + '.') + ' At launch this is a card or phone payment that lands in ' + esc(b.name) + '’s own account.' }, finish);
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
    var f = ACT[t.getAttribute('data-act')]; if (!f) return;
    if (t.closest('#layer') && f !== ACT.closeLayer && !t.hasAttribute('data-keep')) closeLayer();
    f(t.dataset, t, e);
  });
  document.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'bookform') book();
    if (e.target.id === 'evform') {
      var tt = val('ev-t'), nn = val('ev-n'), dd = val('ev-d');
      if (!tt || !dd) { toast('Add what’s on and the date.'); return; }
      S.events.push({ id: 'e' + Date.now().toString(36), date: dd, title: tt.slice(0, 60), note: nn.slice(0, 90) }); save(); toast('Added. It’s on the customer home screen and the website now.'); render();
    }
    if (e.target.id === 'prform') {
      var pn = val('pr-n'), pp = Math.round(Number(val('pr-p')) * 100) / 100;
      if (!pn || !(pp > 0)) { toast('Add a name and a price.'); return; }
      S.products.push({ id: uid('p'), name: pn.slice(0, 32), price: pp, stock: 6, low: 3 }); save(); toast(pn + ' added. Customers can add it when they book.'); render();
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'as') { U.as = t.value; U.bDay = null; U.bCancel = null; render(); return; }
    var ch = t.getAttribute('data-ch'); if (!ch) return;
    if (ch === 'sh') { var prev = U.sheet && U.sheet.svc; grabSheet(); if (U.sheet.svc !== prev) U.sheet.time = null; renderSheet(); return; }
    if (ch === 'keepDep') { S.shop.keepDeposit = t.checked; save(); return; }
    if (ch === 'siteSw') { S.site[t.getAttribute('data-k')] = t.checked; save(); return; }
    if (ch === 'dep') { S.shop.deposit = Number(t.value); save(); render(); return; }
    if (ch === 'notice') { S.shop.notice = Number(t.value); save(); toast('Customers can book up to ' + t.options[t.selectedIndex].text + ' ahead of a slot.'); return; }
    var b = barber(U.as), d = Number(t.getAttribute('data-d')), i = Number(t.getAttribute('data-i')), k = t.getAttribute('data-k');
    if (ch === 'pf') { if (k === 'does') b.does = t.value.trim().slice(0, 60) || b.does; else { b.social = b.social || { ig: '', tt: '' }; b.social[k] = handle(t.value); b.sampleSocial = b.sampleSocial || {}; b.sampleSocial[k] = false; } save(); toast(k === 'does' ? 'Saved.' : (b.social[k] ? name0(k) + ' saved: @' + b.social[k] : name0(k) + ' removed.')); render(); return; }
    if (ch === 'ofOn') { if (k === 'loyalty') b.loyalty.on = t.checked; else if (k === 'gift') b.offers.gift = t.checked; else b.offers[k].on = t.checked; save(); render(); return; }
    if (ch === 'of') { var v = Math.max(0, Number(t.value) || 0), pth = k.split('.'); if (pth[0] === 'loyalty') b.loyalty.n = v || 8; else b.offers[pth[0]][pth[1]] = v; save(); if (pth[0] === 'loyalty' || pth[1] === 'n') render(); return; }
    if (ch === 'dayOn') { var sh = S.shop.hours[d]; b.hours[d].on = t.checked; if (t.checked) { b.hours[d].from = Math.max(b.hours[d].from, sh[0]); b.hours[d].to = Math.min(b.hours[d].to, sh[1]); if (b.hours[d].to - b.hours[d].from < 60) { b.hours[d].from = sh[0]; b.hours[d].to = sh[1]; } } save(); toast(b.name + (t.checked ? ' is in on ' : ' is off on ') + DAYS_L[d] + 's. Customers see it now.'); render(); return; }
    if (ch === 'from' || ch === 'to') { var hv = Number(t.value), hh = b.hours[d]; hh[ch] = hv; if (hh.to <= hh.from) { if (ch === 'from') hh.to = Math.min(hh.from + 60, S.shop.hours[d][1]); else hh.from = Math.max(hh.to - 60, S.shop.hours[d][0]); } save(); render(); return; }
    if (ch === 'brk') { var h2 = b.hours[d]; if (t.checked) { var mid = Math.round((h2.from + h2.to) / 2 / 30) * 30; h2.brk = [mid, mid + 30]; } else h2.brk = null; save(); render(); return; }
    if (ch === 'sName') { b.services[i].name = t.value.trim().slice(0, 40) || 'Service'; save(); return; }
    if (ch === 'sMins') { b.services[i].mins = Number(t.value); b.services[i].range = null; save(); return; }
    if (ch === 'sPrice') { var p = Math.max(0, Math.round(Number(t.value) * 100) / 100); b.services[i].price = isFinite(p) ? p : 0; save(); return; }
  });
  function name0(k) { return k === 'ig' ? 'Instagram' : 'TikTok'; }
  // Photo uploads in the barber's Profile tab
  document.addEventListener('change', function (e) {
    var t = e.target, kind = t.getAttribute && t.getAttribute('data-up'); if (!kind || !t.files || !t.files.length) return;
    var b = barber(U.as), room = kind === 'photo' ? 1 : 6 - b.work.length, files = [].slice.call(t.files, 0, Math.max(0, room)), prev = b.photo, added = 0, left = files.length;
    t.value = '';
    if (!files.length) { toast('Six photos is the most for now. Remove one first.'); return; }
    files.forEach(function (f) {
      shrink(f, kind === 'photo' ? 320 : 760, kind === 'photo', function (url) {
        if (url) { if (kind === 'photo') b.photo = url; else b.work.push(url); added++; }
        if (--left) return;
        if (!added) { toast('That file couldn’t be read. Try a JPG or PNG.'); return; }
        if (!save()) { if (kind === 'photo') b.photo = prev; else b.work.splice(b.work.length - added, added); save(); toast('That’s too big for the demo to keep. Try a smaller photo.'); }
        else toast(kind === 'photo' ? 'Photo updated. Customers see it on your profile.' : added + ' photo' + (added === 1 ? '' : 's') + ' added to your work.');
        render();
      });
    });
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLayer(); });

  S = loadState();
  U.anim = true;
  render();
  renderChips();

  // Desktop and tablet: scale the phone to fit the window. A real phone gets the app full screen instead.
  var PHONE_MQ = window.matchMedia('(max-width: 600px), (pointer: coarse) and (max-height: 500px)');
  function fit() {
    var wrap = document.getElementById('device-wrap'), dev = document.getElementById('device');
    if (PHONE_MQ.matches) { dev.style.transform = ''; wrap.style.width = wrap.style.height = ''; return; }
    var s = Math.max(.5, Math.min(1, (window.innerHeight - 128) / 874, (window.innerWidth - 32) / 415));
    dev.style.transform = s < 1 ? 'scale(' + s + ')' : '';
    wrap.style.width = (415 * s) + 'px'; wrap.style.height = (874 * s) + 'px';
  }
  function clock() { var d = new Date(), el = document.getElementById('sb-time'); if (el) el.textContent = d.getHours() + ':' + pad(d.getMinutes()); }
  fit(); clock(); setInterval(clock, 20000);
  window.addEventListener('resize', fit);
  if (PHONE_MQ.addEventListener) PHONE_MQ.addEventListener('change', fit);

  // The floating cards beside the phone: each one is a benefit, and tapping it shows it in the app
  function renderChips() {
    var CH = [['l', 'bell', 'Cancellations fill back up', 'The waitlist gets a text straight away', 'try4'], ['l', 'cash', 'Paid straight to each barber', 'The shop never holds their money', 'tryPaid'], ['l', 'chair', 'Every chair on one screen', 'Who’s in, how full, whose rent is due', 'tryChairs'],
      ['r', 'insta', 'Their work, front and centre', 'Photos, Instagram and TikTok on every barber', 'tryProfile'], ['r', 'star', 'Clients who come back', 'Loyalty cards, cut clubs, packs and gift cards', 'tryWallet'], ['r', 'scissors', 'Booked in four taps', 'Barber, cut, time, done', 'tryBook']];
    ['l', 'r'].forEach(function (side) {
      var el = document.getElementById('chips-' + side); if (!el) return;
      el.innerHTML = CH.filter(function (c) { return c[0] === side; }).map(function (c, i) { return '<button type="button" class="fchip" data-act="' + c[4] + '" data-z="' + (1 + i * .4) + '" style="--cd:' + (0.7 + i * 0.16 + (side === 'r' ? 0.08 : 0)).toFixed(2) + 's"><span class="ci">' + ico(c[1]) + '</span><span><b>' + c[2] + '</b><span class="t">' + c[3] + '</span></span></button>'; }).join('');
    });
  }

  // The phone in 3D: it sits at an angle, follows the mouse, and turns to face you when the pointer is on it
  var tiltEl = document.getElementById('tilt'), devEl = document.getElementById('device'), groundEl = document.getElementById('ground');
  var FINE = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  var pose = REDUCED ? { x: 0, y: 0 } : { x: 18, y: -34 }, aim = { x: 0, y: 0 }, over = false, mouse = { x: 0, y: 0 }, spinning = false;
  function aimFor() {
    if (PHONE_MQ.matches || REDUCED || !FINE || over) { aim.x = 0; aim.y = 0; return; }
    aim.x = 5 - mouse.y * 6; aim.y = -12 + mouse.x * 10;
  }
  function step() {
    pose.x += (aim.x - pose.x) * .075; pose.y += (aim.y - pose.y) * .075;
    tiltEl.style.transform = PHONE_MQ.matches ? '' : 'rotateX(' + pose.x.toFixed(2) + 'deg) rotateY(' + pose.y.toFixed(2) + 'deg)';
    devEl.style.setProperty('--gx', (50 + pose.y * 2.4).toFixed(1) + '%');
    tiltEl.classList.toggle('flat', Math.abs(pose.x) + Math.abs(pose.y) < 1.5);
    if (groundEl) groundEl.style.transform = 'translateX(' + (-pose.y * 2).toFixed(1) + 'px) scaleX(' + (1 - Math.abs(pose.y) / 120).toFixed(3) + ')';
    [].forEach.call(document.querySelectorAll('.fchip'), function (c) { var z = Number(c.getAttribute('data-z')) || 1; c.style.transform = 'translate3d(' + (mouse.x * 9 * z).toFixed(1) + 'px,' + (mouse.y * 7 * z).toFixed(1) + 'px,0)'; });
    if (Math.abs(aim.x - pose.x) + Math.abs(aim.y - pose.y) > .04) requestAnimationFrame(step); else spinning = false;
  }
  function kick() { aimFor(); if (!spinning) { spinning = true; requestAnimationFrame(step); } }
  window.addEventListener('mousemove', function (e) { mouse.x = e.clientX / window.innerWidth * 2 - 1; mouse.y = e.clientY / window.innerHeight * 2 - 1; kick(); }, { passive: true });
  devEl.addEventListener('mouseenter', function () { over = true; tiltEl.classList.add('hold'); kick(); });
  devEl.addEventListener('mouseleave', function () { over = false; tiltEl.classList.remove('hold'); kick(); });
  if (PHONE_MQ.addEventListener) PHONE_MQ.addEventListener('change', kick);
  setTimeout(kick, 350);
})();
</script>
